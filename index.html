<style>
/* layout: จอเกมพิกเซลซ้าย + แผงตัดสินใจขวา (PC) / ซ้อนบนล่าง (มือถือ) · โลกเดียว: กลางคืนแบบตู้เกม ทองวัดไทยเป็นสีเน้น */
:root{
  --bg:#0b1026; --bg2:#121a3a; --panel:#151f45; --line:#2b3a72; --ink:#f3ecd9; --dim:#a9b0cf; --faint:#6e78a3;
  --gold:#e8b04a; --gold2:#ffd77a; --teal:#3fd1c4; --good:#38e07b; --bad:#ff4d6d; --karma:#b58cff; --warn:#ffcf4d;
  --f-disp:"Chakra Petch", "IBM Plex Sans Thai", system-ui, sans-serif; --f-body:"IBM Plex Sans Thai", "Chakra Petch", system-ui, sans-serif; --f-px:"Silkscreen", "Chakra Petch", monospace;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0;
  background-image:radial-gradient(circle at 20% -10%, #1d2b5a 0, transparent 50%), radial-gradient(circle at 110% 120%, #2a1840 0, transparent 45%);}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{max-width:1180px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:12px;min-height:100%}
/* HUD */
.income-line{flex:1 0 100%;color:var(--gold2);font-size:13px;line-height:1.5;overflow-wrap:anywhere}
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--bg2);border:2px solid var(--line);padding:8px 12px;box-shadow:0 4px 0 #050817}
.who{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 220px}
.who b{font-family:var(--f-disp);font-size:18px;letter-spacing:.02em;white-space:nowrap}
.who .age{font-family:var(--f-px);font-size:12px;color:var(--gold2);white-space:nowrap}
.who .where{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.stat{display:flex;align-items:center;gap:5px;font-family:var(--f-px);font-size:12px;font-variant-numeric:tabular-nums;transition:transform .2s}
.stat img{width:14px;height:14px;image-rendering:pixelated}
.stat .bar{width:42px;height:6px;background:#0a0f24;border:1px solid var(--line);position:relative}
.stat .bar i{position:absolute;inset:0 auto 0 0;background:currentColor}
.stat.flash{transform:scale(1.15)}
.stat.H{color:#ff6b81}.stat.J{color:var(--warn)}.stat.S{color:#6cc6ff}.stat.C{color:var(--teal)}.stat.M{color:var(--gold2)}.stat.D{color:var(--bad)}
.stat .v{color:var(--ink);min-width:2ch}
/* main */
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:880px){ .main{grid-template-columns:minmax(0,1fr)} }
.screen{position:relative;border:3px solid #050817;outline:2px solid var(--line);background:#000;box-shadow:0 6px 0 #050817}
.screen canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%}
.scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(0,0,0,.045) 0 1px, transparent 1px 3px);mix-blend-mode:multiply}
.chips{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.chip{font-family:var(--f-px);font-size:12px;padding:2px 6px;background:rgba(5,8,23,.85);border:1px solid var(--line);animation:rise 2.2s ease-out forwards}
.chip.up{color:var(--good)}.chip.down{color:var(--bad)}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.timeline{margin-top:10px;position:relative;height:22px}
.timeline .track{position:absolute;left:0;right:0;top:9px;height:4px;background:#0a0f24;border:1px solid var(--line)}
.timeline .fill{position:absolute;left:0;top:9px;height:4px;background:var(--gold)}
.timeline .now{position:absolute;top:3px;width:10px;height:16px;margin-left:-5px;background:var(--gold2);box-shadow:0 0 0 2px #050817}
.timeline .tick{position:absolute;top:0;font-family:var(--f-px);font-size:9px;color:var(--faint);transform:translateX(-50%)}
.timeline .ev{position:absolute;top:8px;width:4px;height:6px;margin-left:-2px;background:var(--teal);opacity:.8}
.under{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.linkbtn{background:none;border:1px solid var(--line);color:var(--dim);padding:4px 10px;font-size:12.5px;cursor:pointer}
.ubtns{display:flex;gap:6px}
.linkbtn.snd b{color:var(--gold);font-weight:700}
.linkbtn.snd.off b{color:var(--faint);text-decoration:line-through}
.linkbtn.snd.off{color:var(--faint)}
.linkbtn:hover{color:var(--ink);border-color:var(--gold)}

/* panel */
.panel{background:var(--panel);border:2px solid var(--line);box-shadow:0 6px 0 #050817;padding:16px 16px 18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-px);font-size:11px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow span{color:var(--faint)}
.panel h2{font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
.panel .txt{white-space:pre-line;color:var(--dim);margin:0;max-width:62ch}
.head{border-left:4px solid var(--warn);background:rgba(255,207,77,.07);padding:8px 10px}
.head b{font-family:var(--f-disp);display:block;color:var(--warn)}
.head p{margin:2px 0 0;color:var(--dim);white-space:pre-line}
.arch{border:2px solid var(--teal);background:rgba(63,209,196,.08);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.arch b{font-family:var(--f-disp);font-size:20px;color:var(--teal)}
.arch span{color:var(--dim);font-size:14px}
.arch.rare{border-color:var(--gold2);background:rgba(255,215,122,.1)}
.arch.rare b{color:var(--gold2)}
.story{margin:0;padding:8px 12px;border-left:3px solid var(--gold);background:rgba(232,176,74,.07);color:var(--ink);font-size:15px;line-height:1.65}
.story + .pend{margin-top:-4px}
.pend{display:flex;flex-direction:column;gap:4px;border:1px dashed var(--line);padding:8px 10px;background:rgba(0,0,0,.18)}
.pend div{font-size:13.5px;color:var(--ink)}
.pend div::before{content:"▸ ";color:var(--gold)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;background:#1b2757;border:2px solid #31438a;padding:9px 11px;cursor:pointer;box-shadow:0 3px 0 #0a0f24;transition:transform .08s, border-color .12s}
.ch:hover:not(:disabled),.ch:focus-visible{border-color:var(--gold);outline:none;transform:translateY(-1px)}
.ch:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0a0f24}
.ch .k{font-family:var(--f-px);font-size:11px;color:var(--faint);grid-row:1/3}
.ch .l{font-family:var(--f-disp);font-weight:600;font-size:15.5px;min-width:0}
.ch .s{grid-column:2;font-size:12.5px;color:var(--dim);min-width:0}
.ch .price{grid-row:1/3;grid-column:3;font-family:var(--f-px);font-size:11.5px;color:var(--gold2);text-align:right;white-space:nowrap}
.ch .price small{display:block;font-family:var(--f-body);font-size:10px;color:var(--faint);letter-spacing:0}
.ch .loan{grid-column:2;font-size:12px;color:var(--warn)}
.ch:disabled{opacity:.5;cursor:not-allowed;filter:saturate(.4)}
.ch .lock{grid-column:2;font-size:12px;color:var(--bad)}
.ch.on{border-color:var(--teal);background:#183a52}
.ch .box{grid-row:1/3;width:14px;height:14px;border:2px solid var(--faint)}
.ch.on .box{background:var(--teal);border-color:var(--teal)}
.go{align-self:flex-start;font-family:var(--f-disp);font-weight:700;font-size:16px;background:var(--gold);color:#1a1205;border:0;padding:10px 22px;cursor:pointer;box-shadow:0 4px 0 #8a5d12}
.go:hover,.go:focus-visible{background:var(--gold2);outline:none}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5d12}
.go.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* timeskip chart */
.chart{display:flex;align-items:center;gap:2px;height:96px;border-bottom:1px solid var(--line);border-top:1px solid var(--line);position:relative;overflow:hidden}
.chart .b{flex:1 1 0;min-width:2px;max-width:22px;position:relative;height:100%}
.chart .b i{position:absolute;left:0;right:0;background:var(--good)}
.chart .b.neg i{background:var(--bad)}
.chart .b.rec i{background:#8b93b8}
.chart .zero{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--faint)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.omen{color:var(--karma);font-style:italic}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13.5px}
.kv dt{color:var(--faint)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
/* title */
.title-art{font-family:var(--f-disp);font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1;margin:4px 0 0;color:var(--gold2);text-shadow:3px 3px 0 #7a3a22, 6px 6px 0 #050817;letter-spacing:.01em}
.title-art small{display:block;font-family:var(--f-px);font-size:12px;color:var(--teal);text-shadow:none;letter-spacing:.12em;margin-top:10px}
/* karma */
.ledger{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;padding-right:4px}
.led{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 8px;padding:6px 8px;border-left:4px solid var(--karma);background:rgba(181,140,255,.08);animation:pop .4s both}
.led.good{border-color:var(--gold);background:rgba(232,176,74,.08)}
.led .a{font-family:var(--f-px);font-size:10px;color:var(--faint)}
.led .t{font-size:13.5px}
.led .st{font-family:var(--f-px);font-size:10px;text-align:right}
.led .st.y{color:var(--warn)} .led .st.n{color:var(--faint)}
.led .e{grid-column:2/4;font-size:12.5px;color:var(--dim)}
@keyframes pop{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.bigK{font-family:var(--f-px);font-size:26px}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .n{font-family:var(--f-disp);font-weight:700;font-size:44px;color:var(--gold2);line-height:1}
.score .p{font-family:var(--f-disp);font-size:18px}
.parts{display:flex;flex-direction:column;gap:5px}
.part{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px}
.part .bar{height:8px;background:#0a0f24;border:1px solid var(--line);position:relative}
.part .bar i{position:absolute;inset:0 auto 0 0;background:var(--teal)}
.part span:last-child{font-family:var(--f-px);font-size:11px;text-align:right}
.card{max-width:100%;width:300px;image-rendering:pixelated;border:2px solid var(--line);display:block}
.cardwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.cardwrap > div{min-width:0;flex:1 1 200px}
/* drawer */
.drawer{position:fixed;inset:0;background:rgba(5,8,23,.7);display:flex;justify-content:flex-end;z-index:20}
.drawer .in{width:min(420px,100%);height:100%;background:var(--bg2);border-left:2px solid var(--line);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-right:max(16px, env(safe-area-inset-right,0px));overflow:auto}
.drawer h3{font-family:var(--f-disp);margin:0 0 8px}
.drawer ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.drawer li{display:grid;grid-template-columns:44px 1fr;font-size:13.5px}
.drawer li b{font-family:var(--f-px);font-size:11px;color:var(--gold)}
.tree{display:flex;flex-direction:column;gap:8px}
.gen{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 10px;border:2px solid var(--line);background:#121a3a}
.gen .g{font-family:var(--f-px);font-size:11px;color:var(--gold)}
.gen .d{font-size:12.5px;color:var(--dim)}
.gen .sc{font-family:var(--f-disp);font-weight:700;font-size:18px;color:var(--gold2)}
.help{font-size:12px;color:var(--faint)}
/* สัญลักษณ์แทนตัวอักษร */
.ic{width:13px;height:13px;image-rendering:pixelated;vertical-align:-2px;margin:0 2px 0 0}
.ic.big{width:18px;height:18px;vertical-align:-4px}
.ic.huge{width:34px;height:34px}
.fx{white-space:nowrap;font-family:var(--f-px);font-size:11.5px;margin-right:4px}
.fx.up{color:var(--good)} .fx.dn{color:var(--bad)}
.chip{display:flex;align-items:center;gap:2px}
.chip .arw{font-size:9px;margin-left:3px}
.mgcard{display:flex;flex-direction:column;gap:8px;padding:10px 12px;margin:10px 0;border:1px solid rgba(233,181,86,.35);border-radius:8px;background:rgba(10,14,30,.45);font-size:13.5px;color:var(--dim)}
.mgcard b{color:var(--text,#f5e4bd)}.mg-goal{line-height:1.6}.mg-sus{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.mgcard .sus{display:flex;flex-direction:column;gap:3px;padding:7px 9px;border-radius:6px;background:rgba(255,255,255,.04);border-left:3px solid #e9b556}
.mgcard .sus small{opacity:.8}.mgcard .sus em{font-style:normal;font-size:12.5px;color:#e9b556}.mgcard .sus.out{opacity:.5;border-left-color:#b04a4a}.mgcard .sus.out em{color:#e07a7a}.mgcard .sus.hidden{opacity:.45;border-left-color:#666}
.mgcard .traits{display:flex;flex-wrap:wrap;gap:3px}.mgcard .t{font-size:11.5px;padding:1px 6px;border-radius:10px;background:rgba(255,255,255,.08)}.mgcard .t.ok{background:rgba(90,170,110,.35);color:#d8f5df}.mgcard .t.no{background:rgba(180,70,70,.35);color:#ffd6d6}
.mg-clues ul{margin:4px 0 0;padding-left:18px}.mg-left{font-weight:bold;color:#e9b556}.mgcard.love .hearts{font-size:16px;color:#ff7a9a;letter-spacing:1px}.mgcard.love .hearts small{font-size:12px;color:var(--dim);letter-spacing:0}.mg-heart{display:flex;flex-direction:column;gap:2px}.mg-row.recap{opacity:.85;font-size:12.5px}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lines li{color:var(--dim);padding-left:16px;position:relative}
.lines li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;background:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tile{background:#101836;border:2px solid var(--line);padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;min-width:0}
.tile .ic{grid-row:1/4}
.tile .lab{font-size:11.5px;color:var(--faint)}
.tile b{font-family:var(--f-disp);font-size:17px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.tile b.neg{color:var(--bad)} .tile b.pos{color:var(--good)}
.tile .note{font-size:11.5px;color:var(--gold2);grid-column:2}
.tile .meter{grid-column:1/3;height:4px;background:#0a0f24;margin-top:5px;position:relative}
.tile .meter i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;padding:10px 6px 4px;border:2px solid var(--line);background:#0e1532}
.rung{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;opacity:.55}
.rung.me{opacity:1}
.rung .pc{font-family:var(--f-px);font-size:10px;color:var(--dim)}
.rung .col{width:100%;max-width:34px;height:70px;position:relative;background:#0a0f24}
.rung .col i{position:absolute;left:0;right:0;bottom:0;background:#4b5a99}
.rung.me .col i{background:var(--gold);box-shadow:0 0 0 2px var(--gold2)}
.rung .cn{display:flex;flex-wrap:wrap;justify-content:center;max-width:42px;min-height:13px}
.rung .cn .ic{width:9px;height:9px;margin:0}
.rung .nm{font-size:10.5px;color:var(--faint);text-align:center;line-height:1.2}
.rung.me .nm{color:var(--gold2);font-weight:600}
.rung .you{position:absolute;top:-12px;font-family:var(--f-px);font-size:9px;background:var(--gold);color:#1a1205;padding:0 4px}
.money{display:flex;align-items:center;gap:12px;padding:8px 12px;border:2px solid #6b4f16;background:linear-gradient(90deg,#2a2210,#151f45)}
.money b{font-family:var(--f-disp);font-size:26px;color:var(--gold2);display:block;line-height:1.1}
.money span{font-size:12px;color:var(--dim)}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sb{display:flex;align-items:center;gap:5px;min-width:0}
.sb .bar{flex:1;height:6px;background:#0a0f24;border:1px solid var(--line);position:relative;min-width:20px}
.sb .bar i{position:absolute;inset:0 auto 0 0;background:var(--teal)}
.sb b{font-family:var(--f-px);font-size:11px}
.outcome{align-self:flex-start;font-family:var(--f-disp);font-weight:700;font-size:20px;padding:4px 14px;border:2px solid;display:flex;gap:8px;align-items:center}
.outcome.good{color:var(--good);background:rgba(56,224,123,.1)} .outcome.mid{color:var(--warn);background:rgba(255,207,77,.08)} .outcome.bad{color:var(--bad);background:rgba(255,77,109,.1)}
.legendgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 12px}
.legendgrid div{display:grid;grid-template-columns:auto 1fr;gap:0 6px;align-items:center}
.legendgrid .ic{grid-row:1/3}

function wpick(items, wf){ const ws = items.map(it => Math.max(0, wf(it))); const tot = ws.reduce((s,w)=>s+w,0); if(tot<=0) return items[0]; let r = rnd()*tot; for(let i=0;i<items.length;i++){ r -= ws[i]; if(r<=0) return items[i]; } return items[items.length-1]; }
function gauss(){ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

const STATNAME = { H:'สุขภาพ', J:'ความสุข', S:'ทักษะ', C:'เส้นสาย' };
function fx(p, d){
  const shown = [];
  for(const k of ['H','J','S','C']){ if(d[k]){ const before = p[k]; p[k] = clamp(p[k] + (k === 'H' ? d[k] : dimin(p[k], d[k])), 0, 100); const real = p[k]-before; if(real) shown.push([k, real]); } }
  if(d.K){ p.K = clamp(p.K + d.K, -100, 100); }
  if(d.m){ addMoney(p, d.m); shown.push(['฿', d.m]); }
  if(p.io && shown.length) p.io.chips(shown);
  return shown;
}
function fxText(d, hideK = true){
  const out = [];
  for(const k of ['H','J','S','C']) if(d[k]) out.push(k + (d[k]>0?'+':'−') + Math.abs(d[k]));
  if(d.K && !hideK) out.push('K' + (d.K>0?'+':'−') + Math.abs(d.K));
  if(d.m) out.push('฿' + (d.m>0?'+':'−') + baht(Math.abs(d.m)));
  return out.join(' ');
}
function totalDebt(p){ return p.debt.f + p.debt.k + p.debt.i; }
function formalLimit(p){ if(p.flags.bkRecord && p.age < p.flags.bkRecord) return 0; return p.q <= 1 ? 200000 : 50000000; }
const bkRec = p => (p.flags.bkRecord && p.age < p.flags.bkRecord) ? .15 : 1;
function addMoney(p, amt){
  p.money += amt;
  if(p.money < 0){
    const short = -p.money; p.money = 0;
    const room = Math.max(0, formalLimit(p) - p.debt.f);
    const f = Math.min(room, short); p.debt.f += f; p.debt.i += short - f;
  }
}
function canLoan(p, cost){ return p.debt.f + Math.max(0, cost - p.money) <= formalLimit(p); }
function hhIncome(p){ // รายได้ครัวเรือนต่อเดือน
  if(p.age < 22 && !p.career) return QS[p.q].inc;
  let m = p.career ? curIncome(p) : 0;
  if(p.spouse && !p.spouse.separated) m += p.spouse.income;
  if(p.age >= 60) m = p.retireIncome + (p.spouse && !p.spouse.separated ? p.spouse.income*0.3 : 0);
  return Math.max(m, 1);
}
function monthsOf(p, cost){ return Math.round(cost / Math.max(hhIncome(p), 1)); }

function roll3(p, [g, m, b], adj = {}){
  const mm = M(p);
  let G = clamp(g + mm + (adj.g||0), 5, 85), B = clamp(b - 0.5*mm + (adj.b||0), 5, 85);
  let Mi = clamp(100 - G - B, 5, 85); const s = G + B + Mi; const r = rnd()*s;
  return r < G ? 'good' : r < G + Mi ? 'mid' : 'bad';
}

// choice: { label, sub, cost, cond, condText, loan('bank'|'kys'|false), run }
function prepChoices(p, list){
  return list.map(c => {
    const cost = c.cost || 0; const r = { ...c, cost, disabled: false, lock: null, loanNote: null };
    if(c.cond === false){ r.disabled = true; r.lock = c.condText || 'ไม่ผ่านเงื่อนไข'; return r; }
    if(cost > p.money){
      const short = cost - p.money;
      if(c.loan === 'kys'){ r.loanNote = `กู้ กยศ. ${baht(short)} (1%/ปี)`; }
      else if(c.loan !== false && canLoan(p, cost)){ r.loanNote = `กู้ ${baht(short)} (7%/ปี)`; }
      else { r.disabled = true; r.lock = `= ${monthsOf(p,cost).toLocaleString()} เดือนของรายได้บ้านคุณ`; }
    }
    return r;
  });
}
function spend(p, cost, kind){
  if(cost <= 0) return;
  if(cost > p.money && kind === 'kys'){ const short = cost - p.money; p.debt.k += short; p.money += short; }
  addMoney(p, -cost);
}
async function choose(p, io, opt){
  const choices = prepChoices(p, opt.choices);
  if(!choices.some(c => !c.disabled)) choices[choices.length-1].disabled = false; // กันเกมค้าง
  const head = p.evHead; p.evHead = null;
  const idx = await io.ask({ ...opt, choices, pend: p.pend.splice(0), head });
  const c = choices[idx];
  const at = p.pend.length;
  if(!c.defer) spend(p, c.cost, c.loan);
  if(c.run) await c.run();
  if(!opt.noStory){ const s = storyFor(p, opt, c); if(s) p.pend.splice(Math.min(at, p.pend.length), 0, { text: s, story: true }); }
  return c;
}
async function yesno(p, io, opt){ // opt: {title, text, cost, sub, yes, no, cond, condText, loan}
  const c = await choose(p, io, { ...opt, kind: opt.kind || 'minor', choices: [
    { label: opt.yes || 'ทำ', sub: opt.sub, cost: opt.cost || 0, cond: opt.cond, condText: opt.condText, loan: opt.loan === undefined ? false : opt.loan, yes: true },
    { label: opt.no || 'ไม่ทำ', sub: opt.noSub || '', cost: 0, yes: false },
  ]});
  return c.yes;
}

function personalMonthlyIncome(p){
  if(p.age >= 60) return Math.max(0, Math.round(p.retireIncome || 0));
  if(p.status.prison || !p.career || p.unemployed > 0) return 0;
  let income = curIncome(p) * skillMult(p) * statWorkF(p) * worldIncomeF(p);
  if(p.career === 'farm' && p.flags.rentLand) income *= .8;
  return Math.max(0, Math.round(income));
}
function incomeCaption(p){
  const amount = '฿' + baht(personalMonthlyIncome(p)) + '/เดือน';
  if(p.age >= 60) return 'รายได้เกษียณ ' + amount;
  if(p.status.prison) return 'รายได้จากงาน ' + amount + ' · อยู่ระหว่างคุมขัง';
  if(p.unemployed > 0) return 'รายได้จากงาน ' + amount + ' · ว่างงานชั่วคราว';
  if(!p.career) return 'รายได้ส่วนตัว ' + amount + ' · ยังไม่มีงาน';
  return 'รายได้จากงานโดยประมาณ ' + amount;
}
function curIncome(p){ // รายได้ส่วนตัวต่อเดือนก่อนตัวคูณ
  if(!p.career || p.unemployed > 0) return 0;
  if(p.career === 'pol') return polPay(p) * (1 - p.incomeCut);
  const C = CAREERS[p.career];
  const cap = p.cOut ? C.caps[p.cOut] : C.caps.mid;
  let base = C.start * Math.pow(1 + C.grow, p.cYears);
  if(p.career === 'biz' && p.cOut === 'mid') base = 60000;
  if(p.career === 'influ' && p.cOut === 'mid') base = 35000;
  return (Math.min(base, cap) * p.incomeBoost * (p.eduBoost || 1) * (1 - p.incomeCut) + publicSafetyAllowance(p)) * (p.career==='police'&&p.age<(p.flags.policeSalaryPenaltyUntil||0)?.85:1);
}
// ทักษะและเส้นสายช่วยให้รายได้นิ่ง: C,S 80 → ผันผวนราว 0.6 เท่า · C,S 20 → ราว 1.4 เท่า
function volF(p){ return clamp(1 - .006*(p.C - 50) - .006*(p.S - 50), .35, 1.5); }
function skillMult(p){ return clamp(1 + 0.01*(p.S - 50), 0.7, 1.4); }
function saveRate(p){
  let s = p.age >= 22 ? .15 : QS[p.q].save;
  if(!p.spouse || p.spouse.separated) s += .05;

async function showSkip(p, io, startAge, bars, notes, opts){

}
async function runBeats(p, io, beats, endAge, opts = {}){
  beats.sort((a,b) => a.age - b.age);
  for(const b of beats){
    if(b.age > endAge) continue;
    if(b.age > p.age) await years(p, io, b.age - p.age, opts);
    await b.run();
    await billionaireTick(p,io);
  }
  if(endAge > p.age) await years(p, io, endAge - p.age, opts);
}

// ===== event สุ่ม =====
function drawEvents(p, pool, n = 2){
  const avail = pool.filter(e => e.w(p) !== null);
  const out = [];
  while(out.length < n && avail.length){
    const e = wpick(avail, x => Math.max(1, x.w(p)));
    out.push(e); avail.splice(avail.indexOf(e), 1);
  }
  return out;
}
function evBeat(p, io, e, age){ return { age, run: async () => { await runEvent(p, io, e); } }; }
async function runEvent(p, io, e){
  if(e.w && e.w(p) === null) return;
  p.evHead = { title: typeof e.title === 'function' ? e.title(p) : e.title, text: e.text ? e.text(p) : '', bg: typeof e.bg === 'function' ? e.bg(p) : e.bg };
  log(p, p.evHead.title);
  await e.run(p, io);
  if(p.evHead){ const h = p.evHead; p.evHead = null; await say(p, io, { kind:'event', bg:h.bg, title:h.title, text:h.text }); }
}

async function offerDeed(p, io){
  if(p.status.prison) return;
  p.seenDeeds = p.seenDeeds || {};
  const ok = d => p.age >= d.min && p.age <= d.max && !p.seenDeeds[d.id] && !p.deeds[d.id] && (!d.careers || d.careers.includes(p.career)) && (!d.needIncome || p.career) && (!d.cond || d.cond(p));
  const goods = DEEDS.filter(ok), bads = TEMPTS.filter(ok);
  if(!goods.length && !bads.length) return;
  const bad = bads.length && (!goods.length || chance(.45));
  const d = pickOne(bad ? bads : goods); p.seenDeeds[d.id] = true;
  if(bad) return offerTempt(p, io, d);
  const yes = await yesno(p, io, { kind:'deed', bg: p.age < 18 ? 'school' : 'village', title:'โอกาสทำความดี', text: d.label, sub: d.costText, cost: d.cost || 0, yes: d.yes || 'ทำ', no: d.no || 'ผ่านไป' });
  if(!yes) return;
  p.deeds[d.id] = true;
  const ctx = {};
  if(d.fx) fx(p, d.fx);
  if(d.incomeCut) p.incomeCut += d.incomeCut;
  fx(p, { K: d.K }); tagGood(p, d.tag, d.label);
  if(d.run) d.run(p, ctx);
  if(d.risk && chance(d.risk)){ note(p, 'คุณบาดเจ็บระหว่างช่วยเหลือผู้ประสบภัย'); fx(p,{ H:-20 }); await seriousIllness(p, io, 20); }
  if(ctx.note) note(p, ctx.note);
}

async function birth(p, io){

  const lines = [];
  if(p.gen > 1 && p.family){
    lines.push(`คุณเกิดเป็นลูกของ${p.family.parentName} (รุ่นที่ ${p.gen - 1}) ที่${p.prov}`);
  } else {
    lines.push(`คุณเกิดที่${p.prov} โอกาสเกิดที่นี่ ${provPct.toFixed(2)}%`);

  lines.push(`เงินที่ครอบครัวพร้อมทุ่มให้คุณตลอดวัยเรียน ฿${baht(p.money)}`);

  log(p, `เกิดที่${p.prov} ครอบครัว${Q.name}`);
  await years(p, io, 6, { silent: true });
}

  rural:{ now:{S:5}, odds:[15,55,30], good:{S:15,J:5}, mid:{S:5}, bad:{S:-5,J:-5} },
  elite:{ now:{S:15,C:10,J:-5}, odds:[30,50,20], good:{S:20,C:5}, mid:{S:8}, bad:{J:-15} },

};

async function stage1(p, io){
  p.stage = 1; famDebtTick(p);
  const setSchool = id => { p.school = id; fx(p, SCHOOL_FX[id].now); };
  await choose(p, io, { kind:'main', bg:'school', title:'เลือกโรงเรียน (ป.1–ม.6)', text:'ราคารวม 12 ปี ครอบครัวจ่ายจากเงินที่เตรียมไว้ให้คุณ', choices: [
    { label:'โรงเรียนเวทมนตร์จันทราพฤกษ์ — เข้าฟรี', sub:'เส้นทางแฟนตาซี · เรียนฟรี · ทุกทางเลือกมีความเสี่ยง · 5 อาชีพ 9 ฉากจบ', cost:0, story:'ประตูต้นไม้จันทราพฤกษ์เปิดออก คุณได้รับจดหมายตอบรับโดยไม่ต้องจ่ายค่าเรียน', run:()=>{ p.school='magic'; } },
    { label:'ร.ร.ประจำตำบล', sub:'เรียนฟรี + ค่าชุด 2,500/ปี · S+5', cost:0, run:()=>setSchool('rural') },
    { label:'ร.ร.รัฐชื่อดังในเมือง', sub:`ต้องสอบเข้า (ติด ${Math.round(30+0.5*(p.S-30))}%) · S+15 C+10 J−5`, cost:150000, defer:true, run: async () => {
        let pass = false;
        if(await yesno(p, io, { title:'จ่ายแป๊ะเจี๊ยะเพื่อการันตีที่นั่งไหม', text:'ผู้ปกครองบางคนจ่ายเงินพิเศษให้ลูกได้เข้าเรียนแน่นอน', cost:200000, sub:'การันตีเข้าเรียน', yes:'จ่าย', no:'สอบตามปกติ' })){
          pass = true; fx(p,{K:-10}); tagBad(p,'corrupt','จ่ายแป๊ะเจี๊ยะเข้าโรงเรียน',200000);
          if(chance(.05)){ fx(p,{J:-10,C:-5}); note(p,'เรื่องแป๊ะเจี๊ยะรั่วไปถึงสื่อ'); }
        } else pass = chance((30 + 0.5*(p.S-30))/100);
        if(pass){ spend(p, 150000); p.schoolPaid = 150000; setSchool('elite'); note(p,'สอบติดโรงเรียนรัฐชื่อดัง'); }
        else { setSchool('rural'); note(p,'สอบไม่ติด ไปเรียนโรงเรียนประจำตำบลแทน ไม่เสียเงิน'); }
      } },
    { label:'โรงเรียนเอกชน', sub:'S+12 C+8', cost:600000, run:()=>{ p.schoolPaid=600000; setSchool('priv'); } },
    { label:'โรงเรียนอินเตอร์', sub:'S+15 C+20 J+5', cost:3000000, run:()=>{ p.schoolPaid=3000000; setSchool('inter'); } },
  ]});
  if(p.school === 'magic'){ await magicSchool(p,io); return; }
  log(p, `เข้าเรียน${SCHOOLS.find(s=>s.id===p.school).name}`);
  const beats = [];
  const pool = S1_MINORS[p.school].slice(); const minors = []; while(minors.length < 3 && pool.length) minors.push(pool.splice(Math.floor(rnd()*pool.length), 1)[0]);
  const mAges = [9, 11, 14];
  minors.forEach((m, i) => beats.push({ age: mAges[i], run: async () => {
    const yes = await yesno(p, io, { title: m.title, sub: typeof m.sub === 'function' ? m.sub(p) : m.sub, cost: m.cost||0, cond: m.cond ? m.cond(p) : undefined, condText: m.condText });
    if(yes) m.run(p);
  }}));
  if(p.sex === 'M') beats.push({ age:15, run: async () => {
    if(await yesno(p, io, { title:'เรียน รด. (นักศึกษาวิชาทหาร) ไหม', sub:'H+3 · ไม่ต้องเกณฑ์ทหาร', cost:15000 })){ p.rd = true; fx(p,{H:3}); if(chance(.1)){ fx(p,{H:-5}); note(p,'บาดเจ็บเล็กน้อยระหว่างฝึก'); } }
  }});
  depthStage1(p, io, beats);
  if(!childhoodV1()){
    const evs = drawEvents(p, S1_EVENTS, 2); const eAges = distinctAges(evs.length, 7, 17);
    evs.forEach((e, i) => beats.push(evBeat(p, io, e, eAges[i])));
  }
  beats.push({ age: randi(9, 16), run: () => offerDeed(p, io) });
  beats.push({ age: 18, run: async () => {
    const F = SCHOOL_FX[p.school]; const o = roll3(p, F.odds); fx(p, F[o]);
    let t = { good:'เรียนได้ดีกว่าที่ใครคาด', mid:'เรียนจบตามปกติ', bad:'ช่วงมัธยมเป็นช่วงที่ยากลำบาก' }[o];
    if(p.school==='rural' && o==='bad' && chance(.1)){ p.dropout = true; t = 'คุณออกจากโรงเรียนกลางคันหลังจบ ม.3'; }
    if(p.status.bullied){ stOff(p,'bullied'); }
    await say(p, io, { kind:'result', bg:'school', title:`จบชีวิตวัยเรียน: ผลลัพธ์${OUT_TH[o]}`, text: t + (childhoodV1()&&p.flags.childMisconduct ? `\nเรื่องวัยเด็ก: เคยเกเร ${p.flags.childMisconduct} ครั้ง · บันทึกพฤติกรรมคงเหลือ ${p.flags.schoolWarnings||0}${p.flags.childReformed?' · เริ่มรับผิดชอบและกลับตัว':' · ยังไม่ได้แก้ไขสิ่งที่ทำ'}${p.flags.juvenile?' · มีประวัติสถานพินิจ':''}` : ''), outcome:o });
    log(p, `จบโรงเรียน ผล${OUT_TH[o]}`);
  }});
  await runBeats(p, io, beats, 18);
}

async function arrested(p, io, why, sev = 1){

    { label:'รับสารภาพ', sub:`ติดคุก ${sev} ปี J−20 C−10`, k:'confess' },
    { label:'ใช้เส้นช่วย', sub:'ต้องมี C 60 ขึ้นไป · หลุด 70%', cost:100000, cond:p.C>=60, condText:'C ต้องถึง 60', k:'line' } ]});

  if(c.k==='fight'){ if(chance(clamp(40+0.3*(p.C-50),5,95)/100)) note(p,'ศาลยกฟ้อง คุณกลับไปทำงานเดิมได้'); else jail(3*sev, {J:-30,C:-20}); }

}

function careerChoices(p, exclude = []){
  const land = p.q >= 3 || p.tier === 4 || p.tier === 5;
  return Object.entries(CAREERS).filter(([k,C])=>!C.magicOnly).map(([k, C]) => {
    let cond = !exclude.includes(k), condText = 'เพิ่งออกจากอาชีพนี้';
    if(k==='police' && !(p.degree==='cadet' && p.flags.policeQualified)){cond=false;condText='ต้องจบโรงเรียนนายร้อยตำรวจ';}
    if(k==='athlete' && !(p.flags.athleteQualified && p.H>=45)){cond=false;condText='ต้องจบเส้นทางกีฬา และมี H อย่างน้อย 45';}
    if(k==='coach' && !(p.degree==='sports' || p.flags.coachQualified)){cond=false;condText='ต้องจบสายกีฬา หรือผ่านหลักสูตรผู้ฝึกสอน';}
    if(C.needDegree && !p.degree){ cond = false; condText = 'ต้องจบปริญญา'; }
    if(C.maxAge && p.age > C.maxAge){ cond = false; condText = `อายุเกิน ${C.maxAge}`; }
    if(p.flags.restricted && ['gov','police','office','abroad','pol'].includes(k)){ cond = false; condText = 'มีประวัติติดคุก'; } if(p.flags.bkRecord && p.age < p.flags.bkRecord && ['gov','police','abroad'].includes(k)){ cond = false; condText = 'มีประวัติล้มละลาย'; }
    if(p.status.bankrupt && k==='abroad'){ cond = false; condText = 'ล้มละลาย ไปต่างประเทศไม่ได้'; }
    if(k==='crime' && cond && !crimeEntry(p)){ cond = false; condText = 'ไม่มีคนพาเข้าวงการ'; }
    if(k==='pol' && cond && !polEntry(p)){ cond = false; condText = 'ต้องมีเส้นสาย C 50 ขึ้นไป หรือมีคนหนุนหลัง'; }
    let cost = C.cost; if(k==='biz' && p.flags.bizFree) cost = 0;
    const inc = `฿${bahtS(C.start)}→${bahtS(C.caps.good)}/เดือน`;
    let sub = k==='pol' ? `฿${bahtS(25000)}→${bahtS(220000)}/เดือนตามตำแหน่ง · ต้องชนะเลือกตั้งทุก 4 ปี · ค่าสมัครและหาเสียง` : k==='crime' ? `${inc} · ทุกปีเสี่ยงติดคุกหรือถูกเก็บ · บาปสะสมทุกปี` : inc + (k==='gov' ? ` · สอบติด ${clamp(Math.round(20+0.5*(p.S-50)+0.3*(p.C-50)+(p.degree==='top'?10:0)),3,95)}%` : '') + (k==='farm' && !land ? ' · ต้องเช่าที่ (−20%)' : '');
    return { label:C.name, sub, cost, cond, condText, k };
  });
}

async function careerOutcome(p, io){
  if(!p.career || p.cOut || p.age >= 60) return;

  await say(p, io, { kind:'result', bg:C.bg, title:`${C.name}: ผลลัพธ์${OUT_TH[o]}`, text:(p.career==='police' && p.flags.policePath ? policeOutcomeText(p,o) : C.outText[o]) + (o==='good' && p.flags.seedWhy ? `\n${p.flags.seedWhy}ที่สะสมมาช่วยได้มาก` : ''), outcome:o });

  if(p.career==='crime' && o==='good') p.flags.crimeRank = Math.max(1, p.flags.crimeRank || 0);

}

async function stage3(p, io){
  p.stage = 3;
  await enterCareer(p, io, {});
  const beats = [];
  const cps = [22, 27, 33, 40, 47, 54].filter(a => a >= p.age - 1).map(a => Math.max(a, p.age));

  C_MINORS[firstCareer].forEach((m, i) => beats.push({ age: p.age + i, run: async () => {
    if(p.career !== firstCareer) return;

  }}));

  depthStage3(p, io, beats);
  beats.push({age:Math.max(35,p.age),run:async()=>{
    if(p.career!=='athlete')return;
    const c=await choose(p,io,{kind:'main',bg:'stadium',title:'เมื่อร่างกายเริ่มฟื้นตัวช้าลง',text:'ถึงเวลาวางแผนชีวิตหลังการแข่งขันเต็มเวลา ประสบการณ์ในสนามยังพาคุณไปต่อได้',choices:[
      {label:'อบรมและเปลี่ยนเป็นผู้ฝึกสอน',sub:'เริ่มรายได้ตามอาชีพโค้ช · S+5',k:'coach'},
      {label:'เริ่มอาชีพใหม่',sub:'เลือกเส้นทางนอกการแข่งขัน',k:'change'}]});
    p.flags.coachQualified=true;
    if(c.k==='coach'){p.career='coach';p.cYears=0;p.cOut=null;p.incomeBoost=1;p.flags.cAdj=0;p.flags.cBad=0;fx(p,{S:5});note(p,'สโมสรสนับสนุนการอบรม คุณแขวนชุดแข่งและเริ่มงานสอนรุ่นน้อง');}
    else await enterCareer(p,io,{title:'ชีวิตหลังเลิกแข่ง',exclude:['athlete']});
    beats.push({age:p.age+3,run:()=>careerOutcome(p,io)});
  }});
  investBeats(p, io, beats);
  // minor ทั่วไป
  beats.push({ age: 28, run: async () => {
    if(!p.career) return;
    if(!p.house) await houseChoice(p, io);
  }});
  beats.push({ age: 42, run: async () => { if(p.house && p.money + p.house.value * .9 > 2000000) await houseChoice(p, io, true); else if(!p.house && p.money > 500000) await houseChoice(p, io); } });
  beats.push({ age: 29, run: async () => {
    if(!p.career) return;
    if(!p.car) await carChoice(p, io);
    if(await yesno(p, io, { title:'ซื้อหวยทุกงวดไหม', sub:'งวดละ 80 บาท · J+2 (ความหวัง)' })){ p.lottery = true; fx(p,{J:2}); }
  }});
  beats.push({ age: 36, run: async () => {
    if(!p.career) return; const amt = CRYPTO_AMT[p.career];
    if(await yesno(p, io, { title:`ลงทุนคริปโต / เล่นแชร์ ฿${baht(amt)} ไหม`, sub:'30% ได้ ×3 · 50% ได้คืนครึ่ง · 20% แชร์ล้ม', cost:amt })){
      const r = rnd(); const lose = p.career==='farm'?.3:p.career==='influ'?.3:.2;
      if(r < .3){ fx(p,{m:amt*3}); note(p,`ได้กำไร ฿${baht(amt*2)}`); } else if(r < 1-lose){ fx(p,{m:amt/2}); note(p,'ได้คืนแค่ครึ่งเดียว'); } else note(p,'แชร์ล้ม เงินหายหมด');
    }
  }});
  // checkpoint: ระดับการใช้ชีวิต + โอกาสทำความดี
  cps.forEach((a, i) => { beats.push({ age:a, run: async () => { if(p.career && !p.unemployed && i > 0 && p.S < 80) p.S = Math.min(80, p.S + 2); await lifestyleChoice(p, io); if(i > 0) await freeTime(p, io); } }); if(i>0) beats.push({ age:a+1, run: () => offerDeed(p, io) }); });

  }});
  beats.push({ age:45, run: async () => { if(p.flags.layoff45 && p.career==='office'){ p.flags.layoff45=false; await say(p, io, { kind:'event', bg:'office', title:'ถูกเลิกจ้างตอนอายุ 45', text:'บริษัทปรับโครงสร้าง ตำแหน่งของคุณถูกยุบ' }); await layoffFork(p, io, true); beats.push({ age:p.age+3, run:()=>careerOutcome(p, io) }); } } });
  // ต่างประเทศครบสัญญา
  beats.push({ age:27, run: async () => { await abroadCheck(p, io, beats); } });

  twistBeats(p, io, beats, TWISTS, 3, 24, 58);
  // งานที่ตั้งเวลาไว้
  const flushLater = { age:0, run: null };
  await runBeatsWithLater(p, io, beats, 60);
}
async function abroadCheck(p, io, beats){
  if(p.career === 'abroad' && p.flags.abroadEnd && p.age >= p.flags.abroadEnd){
    if(p.cOut === 'good') fx(p,{m:1500000});
    p.flags.livesAbroad=false;
    await say(p, io, { kind:'event', bg:'abroad', title:'กลับไทย', text: p.cOut==='good' ? 'ครบสัญญา คุณกลับไทยพร้อมเงินก้อน ฿1,500,000' : 'ครบสัญญา ถึงเวลากลับบ้าน' });
    await enterCareer(p, io, { title:'กลับมาแล้วจะทำอะไรต่อ', exclude:['abroad'] }); beats.push({ age:p.age+3, run:()=>careerOutcome(p, io) });
  } else if(p.career === 'abroad'){ beats.push({ age: p.flags.abroadEnd || p.age + 5, run: () => abroadCheck(p, io, beats) }); }
}
async function runBeatsWithLater(p, io, beats, endAge){
  while(true){
    if(p.flags.later){ for(const l of p.flags.later.splice(0)) beats.push({ age:l.age, run: async () => l.fn() }); }
    if(p.flags.outAt){ const a = p.flags.outAt; p.flags.outAt = null; if(a < 60) beats.push({ age:a, run: () => careerOutcome(p, io) }); }
    if(p.flags.cutBack){ const a = p.flags.cutBack; p.flags.cutBack = null; beats.push({ age:a, run: async () => { p.incomeCut = Math.max(0, p.incomeCut - .2); } }); }
    beats.sort((a, b) => a.age - b.age);
    const b = beats.shift(); if(!b || b.age > endAge) break;
    if(b.age > p.age) await years(p, io, b.age - p.age);
    await b.run();
    await billionaireTick(p,io);
  }
  if(endAge > p.age) await years(p, io, endAge - p.age);
}

const LIFE_SCORE_WEIGHTS=[['joy','ความสุขเฉลี่ย',.25],['health','สุขภาพเฉลี่ย',.25],['finance','ความมั่นคงทางการเงิน',.20],['relations','ความสัมพันธ์',.15],['responsibility','ความรับผิดชอบต่อผู้อื่น',.15]];
function lifeScoreBand(s){return s>=99?'เกือบสมบูรณ์ทุกด้าน':s>=95?'หายาก':s>=90?'โดดเด่นมาก':s>=80?'ชีวิตยอดเยี่ยม':s>=65?'ชีวิตที่ดี':s>=50?'ประคองชีวิตได้':'ชีวิตที่ยังต้องฝ่าฟัน';}
function lifeScoreNumber(s){return Number.isInteger(s)?String(s):Number(s).toFixed(1);}
function lifeFinanceScore(net){
 if(net<0)return clamp(35/(1+Math.abs(net)/1000000),0,35);
 const pts=[[0,35],[100000,45],[1000000,60],[3000000,70],[10000000,80],[50000000,88],[200000000,93],[1000000000,96],[10000000000,99],[100000000000,100]];
 for(let i=1;i<pts.length;i++)if(net<=pts[i][0]){const [a,x]=pts[i-1],[b,y]=pts[i];return x+(y-x)*(Math.log1p(net)-Math.log1p(a))/(Math.log1p(b)-Math.log1p(a));}return 100;
}
// Snapshot before funeral choices: donations after death cannot rewrite a life.
function lifeScoreSnapshot(p){
 const good=p.tagsGood.map(t=>({type:t.type,age:t.age})),bad=p.tagsBad.map(t=>({type:t.type,age:t.age}));
 const kinds=new Set(good.map(t=>t.type));
 const supports=[...kinds].filter(t=>['family','community','edu','life','honest','justice'].includes(t)).length;
 const kidMean=p.kids.length?p.kids.reduce((s,k)=>s+clamp(k.kv,0,100),0)/p.kids.length:50;
 const v2=storyV2(),reformed=!!p.flags.childReformed;
 // Story v2: harm done as a child (before 18) weighs less than adult harm, and less again once repaired.
 const kidHarm=v2?bad.filter(t=>t.type==='harm'&&t.age<18).length:0,adultHarm=bad.filter(t=>t.type==='harm').length-kidHarm;
 const damage=adultHarm*5+kidHarm*(reformed?1:3)+bad.filter(t=>t.type==='abandon').length*10;
 const relations=clamp(55+Math.min(25,supports*6)+(p.friend?.bond===2?15:p.friend?.bond===1?8:0)+(p.flags.careParents?8:0)+(p.spouse&&!p.spouse.separated?6:0)+clamp((kidMean-50)*.2,-10,10)-(p.flags.affair?8:0)-Math.min(40,damage),0,100);
 const corrupt=bad.filter(t=>t.type==='corrupt').length,harm=bad.filter(t=>t.type==='harm').length,abandon=bad.filter(t=>t.type==='abandon').length,flee=bad.filter(t=>t.type==='debtflee').length;
 const penalty=Math.min(60,corrupt*8+adultHarm*6+kidHarm*(reformed?2:4)+abandon*6+flee*5);
 let responsibility=clamp(50+clamp(p.K,-100,100)*.3+Math.min(20,kinds.size*4)-penalty,0,100);
 if(corrupt)responsibility=Math.min(responsibility,corrupt>=3?35:60);
 if(adultHarm||(kidHarm&&!reformed))responsibility=Math.min(responsibility,75);
 if(abandon)responsibility=Math.min(responsibility,80);
 return {relations,responsibility,K:p.K,corrupt,harm,abandon,penalty,goodKinds:kinds.size};
}
function lifeLowPenalties(parts){
 return LIFE_SCORE_WEIGHTS.map(([key,label])=>{const value=parts[key];return {key,label,value,points:value<10?10:value<25?6:value<40?3:0};}).filter(x=>x.points>0);
}
function applyLifeScore(r,p,snapshot=lifeScoreSnapshot(p)){
 if(r.magic)return r;
 const parts={joy:100*Math.pow(clamp(r.Jbar,0,100)/100,1.15),health:100*Math.pow(clamp(r.Hbar,0,100)/100,1.15),finance:lifeFinanceScore(r.estate),relations:snapshot.relations,responsibility:snapshot.responsibility};
 let raw=LIFE_SCORE_WEIGHTS.reduce((s,[key,,w])=>s+parts[key]*w,0);
 // The highest band needs strength across all five dimensions.
 if(Object.values(parts).some(v=>v<95)||parts.responsibility<98)raw=Math.min(raw,98.9);
 r.scoreBase=Math.floor(clamp(raw,0,100)*10+1e-8)/10;
 r.scorePenalties=lifeLowPenalties(parts);r.scorePenalty=r.scorePenalties.reduce((sum,x)=>sum+x.points,0);
 r.score=Math.floor(Math.max(0,r.scoreBase-r.scorePenalty)*10+1e-8)/10;r.scoreVersion=3;r.scoreParts=parts;r.scoreSnapshot=snapshot;r.scoreBand=lifeScoreBand(r.score);return r;
}


function wealthPct(e){ const pts = [[0,5],[1e5,22],[5e5,40],[1e6,52],[3e6,68],[1e7,84],[5e7,95],[2e8,99]]; if(e <= 0) return 3; for(let i=1;i<pts.length;i++){ if(e <= pts[i][0]){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; const t = (Math.log10(e+1)-Math.log10(x0+1))/(Math.log10(x1+1)-Math.log10(x0+1)); return y0 + (y1-y0)*t; } } return 99.5; }

async function live(p, io){
  Object.defineProperty(p, 'io', { value: io, enumerable:false, writable:true });
  try {
    await birth(p, io); await stage1(p, io); if(p.school==='magic') return await magicLife(p,io); await stage2(p, io); await stage3(p, io); await stage6(p, io);
  } catch(e){ if(!(e instanceof Death)) throw e; p.dead = true; p.cause = e.cause; }
  p.dead = true;
  return await stage7(p, io);
}

// Fictional estate events for gameplay, not statutory tax rates.
function rollInheritance(estate, heirs){
  const pool = Math.max(0, Math.floor(estate || 0));
  const base = Math.floor(pool / Math.max(1, heirs));
  const events = [
    {name:'พินัยกรรมแบ่งเงินบางส่วนให้ญาติ', keep:75},
    {name:'แบ่งทรัพย์สินให้พี่น้องและผู้ดูแลเพิ่มเติม', keep:60},
    {name:'ครอบครัวกันเงินไว้ดูแลญาติผู้สูงอายุ', keep:80},
    {name:'ขายทรัพย์มรดกได้ต่ำกว่าราคาประเมิน', keep:65},
    {name:'ภาษีและค่าจัดการมรดก (เหตุการณ์สมมติในเกม)', keep:90},
    {name:'พินัยกรรมบริจาคส่วนหนึ่งให้สาธารณะ', keep:50},
  ];
  const event = pickOne(events);
  const net = Math.floor(base * event.keep / 100);
  return {pool, base, net, deduction:base-net, keep:event.keep, name:event.name};
}
function inheritanceText(d){
  const x = d.inheritance;
  if(!x) return d.share > 0 ? 'มรดกส่วนของคุณ ฿'+baht(d.share) : 'ไม่มีมรดกเหลือถึงคุณ';
  if(!x.pool) return 'ไม่มีทรัพย์มรดกสุทธิเหลือให้แบ่ง';
  return x.name+'\nกองมรดกสุทธิ ฿'+baht(x.pool)+' · ส่วนแบ่งก่อนเหตุการณ์ ฿'+baht(x.base)+'\nได้รับ '+x.keep+'% ของส่วนแบ่ง · หัก ฿'+baht(x.deduction)+'\nมรดกที่ได้รับจริง ฿'+baht(x.net);
}

function makeChild(p, res, kidIdx){
  const kid = p.kids[kidIdx];
  const q = incomeToQ(kid.hhInc);
  const nKids = p.kids.length;
  const inheritance = rollInheritance(res.heirsEstate, nKids + (p.spouse && !p.spouse.separated ? 1 : 0));
  const share = inheritance.net;
  const anc = { name:p.name, sex:p.sex, skin:p.skin, religion:p.religion, gen:p.gen, prov:p.prov, q:p.qBirth, career:res.career, age:p.age, score:Math.round(res.score), fruits:Object.keys(res.fruits), erupted:res.ledger.filter(l=>!l.good&&l.erupt).length, ssTier:p.flags.ssTier||0 };
  return newPlayer({ tier:p.tier, prov:p.prov, q, religion:p.religion, sex:kid.sex, name:kid.name, gen:p.gen+1,
    money: QS[q].start + (p.flags.kidInsurance ? 300000 : 0), famDebt: Math.min(kid.debtAt, 2000000), skipGen: !!p.flags.grandRaise,
    Jbonus: Math.round((clamp(kid.kv - res.kvPenalty,0,100) - 50)/5), Sbonus: res.fruits.edu ? 10 : 0, Cbonus: (res.fruits.honest ? 10 : 0) - (res.kvPenalty ? 10 : 0),
    family: { parentName: p.name }, ancestors: [...p.ancestors],
    parentDeath: { age: p.age - kid.born, name: p.name, ageAtDeath: p.age, sex: p.sex, other: (p.spouse && !p.spouse.separated) ? p.spouse.sex : null, otherName: (p.spouse && !p.spouse.separated) ? p.spouse.name : null, share, inheritance, anc, familyFruit: !!res.fruits.family },
    extra: { flags: { ssTier: p.flags.ssTier || 0 } } });
}

function mgFxText(d={}){const a=[];const b=fxText(d);if(b)a.push(b);for(const k in MG_SHORT)if(d[k])a.push(MG_SHORT[k]+(d[k]>0?'+':'−')+Math.abs(d[k]));if(d.strike)a.push('โดนทัณฑ์บน');if(d.rank)a.push(d.rank>0?'เลื่อนตำแหน่ง':'ลดตำแหน่ง');if(d.jobless)a.push('ขาดรายได้');return a.join(' ');}
function mgRank(p,dr,out){
  const M=p.magic;if(!p.career||!MG_RANKS[p.career])return;const R=MG_RANKS[p.career];
  if(dr<0&&M.rank===0){p.unemployed=Math.max(p.unemployed,1);out&&out.push('ถูกพักงาน 1 ปี');log(p,'ถูกพักงาน');return;}
  const n=clamp(M.rank+dr,0,3);if(n===M.rank)return;M.rank=n;p.incomeBoost=MG_BOOST[n];p.cOut=n>=2?'good':'mid';
  const s=(dr>0?'เลื่อนเป็น':'ถูกลดเป็น')+R[n];out&&out.push(s);log(p,s);
}
function mgApply(p,d={}){
  const M=p.magic,out=[];fx(p,d);
  for(const k in MG_KEY)if(d[k]){M[MG_KEY[k]]=(M[MG_KEY[k]]||0)+d[k];out.push(MG_LONG[k]+(d[k]>0?' +':' −')+Math.abs(d[k]));}
  for(const k of ['trust','knowledge','shadow'])M[k]=Math.max(0,M[k]);
  if(d.f)Object.assign(M.f,d.f);
  if(d.strike){M.strike+=d.strike;out.push((M.phase==='school'?'ทัณฑ์บน ':'ใบเตือนจากสภาเวท ')+Math.min(3,M.strike)+'/3');}
  if(d.rank)mgRank(p,d.rank,out);
  if(d.jobless){p.unemployed=Math.max(p.unemployed,d.jobless);out.push('ไม่มีรายได้ '+d.jobless+' ปี');}
  return out.join(' · ');
}
// ev: {t,bg,x,o:[{l,sub?,ch?,cost?,cond?,ct?,show?,ok:[ข้อความ,ผล,callback,ฉาก,outcome],bad:[...]}]}
async function mgEvent(p,io,ev){
  const friendWasDead=!!(p.magic&&p.magic.f.friendDead);
  const sceneCast=mgEventCast(p,ev);
  const opts=ev.o.filter(o=>!o.show||o.show(p));
  const choices=opts.map(o=>{
    const pct=o.ch?Math.round(o.ch(p)*100):100;
    const sub=mgT(p,o.sub?mgT(p,o.sub):o.ch?'สำเร็จราว '+pct+'% · ถ้าพลาด '+(mgFxText(o.bad[1])||'เสียโอกาส'):(mgFxText(o.ok[1])||'—'));
    return {label:mgT(p,o.l),sub,cost:o.cost||0,loan:false,cond:o.cond?o.cond(p):undefined,condText:o.ct,o};
  });
  const c=await choose(p,io,{sceneCast,sceneHidePlayer:ev.sceneHidePlayer,kind:ev.kind||'fork',bg:mgT(p,ev.bg),title:mgT(p,ev.t),text:mgT(p,ev.x),card:ev.card?ev.card(p):undefined,noStory:true,choices});
  const o=c.o,ok=!o.ch||chance(o.ch(p)),r=ok?o.ok:o.bad;
  let resultCast=r.sceneCast!==undefined?mgEventCast(p,r):o.sceneCast===undefined?sceneCast:mgEventCast(p,o);
  const extra=mgApply(p,r[1]);
  let tail='';if(r[2]){const t=await r[2](p,io);if(t)tail='\n'+mgT(p,t);}
  if(ev===MG_FRIEND&&p.magic.f.friendDead)resultCast=resultCast.filter(w=>w!=='friend');
  if(ev===MG_MENTOR&&!(MG_MENTOR.o.indexOf(o)===2&&ok))resultCast=resultCast.filter(w=>w!=='scholar');
  log(p,mgT(p,ev.t)+' — '+c.label+(o.ch?(ok?' (สำเร็จ)':' (พลาด)'):''));
  await say(p,io,{sceneCast:resultCast,sceneHidePlayer:ev.sceneHidePlayer,kind:'result',bg:r[3]||mgT(p,ev.bg),title:(o.ch?(ok?'สำเร็จ · ':'พลาด · '):'')+c.label,text:mgT(p,r[0])+tail+(extra?'\n'+mgT(p,extra):''),outcome:o.ch?(ok?'good':'bad'):r[4]});
  if(ev===MG4_RISE&&storyBossScenes())await mgRiseAftermath(p,io,o,ok);
  else if(ev===MG4_SHADE&&storyBossScenes())await mgShadeAftermath(p,io,o,ok);
  else await mgCheck(p,io,ev.death);
  await mgMemorialEvent(p,io,ev,o,ok,friendWasDead);
}

async function mgCheck(p,io,cause){
  if(p.H<=0&&p.magic&&!p.magic.f.nearDeath){p.magic.f.nearDeath=1;p.H=1;log(p,'เฉียดตาย');p.magic.nearCause=cause;await mgEvent(p,io,MG_NEAR);if(p.H<=0)throw new Death(cause||'บาดเจ็บสาหัสจากเวทมนตร์');return;}
  if(p.H<=0)throw new Death(cause||p.magic.nearCause||'บาดเจ็บสาหัสจากเวทมนตร์');
  const M=p.magic;if(M.strike<3)return;
  if(M.phase==='school'){if(!M.expelled)await mgEvent(p,io,MG_EXPEL);else M.strike=0;}
  else if(p.career){M.strike=0;await mgEvent(p,io,p.career==='mageRogue'?MG_JAIL:MG_REVOKE);}
  else M.strike=2;
}
async function mgAdvance(p,io,age){
  const M=p.magic;
  while(p.age<age){
    p.age++;
    if(p.career){const inc=personalMonthlyIncome(p);if(p.unemployed>0)p.unemployed--;addMoney(p,Math.round(inc*12*.2));p.lastSalary=inc;if(inc>0)p.cYears++;}
    if(p.age>=45&&p.age%2===0)fx(p,{H:-1});
    if(p.age>=55)fx(p,{H:-1});
    if(M.shadow>=10&&chance(Math.min(.4,(M.shadow-8)*.03))){fx(p,{H:-3,J:-4});note(p,pickOne(MG_WHISPER));}
    if(p.career&&p.unemployed===0){
      if(p.H<25&&chance(.3)){p.unemployed=1;fx(p,{J:-3});note(p,'ร่างกายทรุดหนัก คุณต้องลางานไปรักษาตัวหนึ่งปีเต็มโดยไม่มีรายได้');}
      else if(p.J<20&&chance(.25)){p.unemployed=1;note(p,'คุณหมดไฟจนลุกจากเตียงไม่ไหว ต้องลาพักงานยาวหนึ่งปี');}
    }
    {const base=p.age<50?62:p.age<60?52:42;if(p.H>0&&p.H<base&&(p.age<40||p.age%2===0))p.H=Math.min(base,p.H+1);}
    p.samples.H.push(p.H);p.samples.J.push(p.J);
    if(p.parentDeath&&!p.parentDeath.paid&&p.age>=p.parentDeath.age){const d=p.parentDeath;d.done=true;d.paid=true;addMoney(p,d.share);p.flags.parentsGone=true;note(p,inheritanceText(d));await say(p,io,{kind:'event',bg:'magicVigil',title:'จดหมายจากบ้าน',text:d.name+'จากไปแล้ว '+(storyMemorialScenes()?'คุณขออนุญาตกลับโลกมนุษย์ เพื่อร่วมส่งลาที่บ้าน':'คุณขออนุญาตกลับโลกมนุษย์ไปร่วมงานศพ ก่อนกลับมาพร้อมเอกสารมรดก')});if(d.anc&&!p.ancestors.some(a=>a.name===d.name))p.ancestors.push({...d.anc,sex:d.sex,skin:d.anc.skin,religion:d.anc.religion||p.religion});await mgHonor(p,io,{name:d.name,sex:d.sex,age:d.ageAtDeath,skin:d.anc&&d.anc.skin,religion:d.anc&&d.anc.religion||p.religion,family:true},{key:'parent:'+d.name});}
    if(M.f.mentorFarewellAt&&p.age>=M.f.mentorFarewellAt){M.f.mentorFarewellAt=null;M.f.mentorDead=1;if(storyMemorialScenes()){await say(p,io,{kind:'event',bg:'magicCottage',sceneCast:[],title:'จดหมายจากห้องชาของอาจารย์',text:'สามปีที่ยืดไว้สิ้นสุดลงแล้ว อาจารย์มณีจันทร์จากไปหลังฝากตำราให้โรงเรียน นักเรียนเก่าส่งข่าวมาเชิญคุณกลับไปร่วมส่งลา'});await mgHonor(p,io,memorialPerson(p,'scholar'));}}
    if(p.H<=0)await mgCheck(p,io,p.magic.shadow>=10?'พลังเงากัดกินร่างกายจนหมดลมหายใจ':'ร่างกายทรุดจนไปต่อไม่ไหว');
  }
  if(io.update)io.update(p);
}

  const M=p.magic;

  const o=sc>=22?'good':sc>=6?'mid':'bad';
  p.eduBoost={good:1.12,mid:1,bad:.88}[o];
  fx(p,{good:{J:8,C:5},mid:{J:3},bad:{J:-6,C:-2}}[o]);
  if(M.f.retake){await mgAdvance(p,io,19);note(p,'คุณใช้เวลาเพิ่มอีกหนึ่งปีกว่าจะสอบซ่อมผ่าน');}
  const t={good:'ชื่อของคุณถูกอ่านเป็นคนแรกในพิธีจบการศึกษา พร้อมเกียรตินิยม หอพิทักษ์และสภานักปรุงยาส่งจดหมายชวนไปทำงานตั้งแต่ยังไม่ถอดชุดครุย',mid:'คุณจบการศึกษาอย่างเรียบร้อย ไม่โดดเด่น แต่ก็ไม่มีอะไรให้อาย',bad:'คุณจบมาได้อย่างหวุดหวิด ใบประกาศนียบัตรมีหมายเหตุสีแดงเรื่องความประพฤติ ที่ทำงานดี ๆ หลายแห่งจะเห็นมันก่อนเห็นชื่อคุณ'}[o];
  log(p,'จบโรงเรียนเวทมนตร์ ผลลัพธ์'+OUT_TH[o]);
  await say(p,io,{kind:'result',bg:'magicSchool',title:'จบโรงเรียนเวทมนตร์: ผลลัพธ์'+OUT_TH[o],text:t,outcome:o});

const MG_SCHOOL_PLAN=[[6,MG_WAND],[7,MG_ROOM],[8,MG_FLOAT],[9,MG_HERB],[10,'R'],[11,MG_EXAM],[12,MG_LIB],[13,MG_DUEL],[13,'R'],[14,MG_FRAME],[15,MG_FIELD],[15,'R'],[16,MG_BALL],[17,MG_RIFT1],[18,MG_FINAL]];
async function magicSchool(p,io){
  if(storyV4())return await magicSchoolV4(p,io);
  p.magic={trust:0,knowledge:0,shadow:0,friend:0,rival:0,strike:0,rank:0,f:{},phase:'school'};p.schoolPaid=0;
  log(p,'เข้าโรงเรียนเวทมนตร์จันทราพฤกษ์ (เรียนฟรี)');
  try{
    await say(p,io,{kind:'stage',bg:'magicSchool',title:'โรงเรียนเวทมนตร์จันทราพฤกษ์',text:'คืนก่อนวันเปิดเทอม จดหมายผนึกขี้ผึ้งสีเงินโผล่อยู่ใต้หมอนของคุณ ลายมือในซองเขียนว่า “ประตูจะเปิดตอนพระจันทร์เต็มดวง” '+ctxOf(p).carer+'อ่านแล้วนิ่งไปนาน ก่อนจะยอมให้คุณไป\n\nที่นี่เรียนฟรี มีหอพักให้ แต่ทุกการตัดสินใจมีราคา ตัวเลือกที่เสี่ยงอาจสำเร็จหรือพังทั้งหมด ทัณฑ์บนครบสามครั้งคือถูกไล่ออก และสิ่งที่คุณสะสม ทั้งความไว้ใจ ความรู้เวท และพลังเงา จะติดตัวไปจนวันสุดท้าย'});
    const pool=MG_SCHOOL_RANDOM.slice();
    for(const [age,ev] of MG_SCHOOL_PLAN){
      if(p.magic.expelled)break;
      await mgAdvance(p,io,age);
      if(ev==='R'){if(pool.length)await mgEvent(p,io,pool.splice(Math.floor(rnd()*pool.length),1)[0]);}
      else await mgEvent(p,io,ev);
    }
    if(!p.magic.expelled)await mgGraduate(p,io);
    else{p.eduBoost=.8;await mgAdvance(p,io,18);}
  }catch(e){if(!(e instanceof Death))throw e;p.magic.died=e.cause;}
  p.degree=p.magic.expelled?null:'magic';p.uni='magic';
}

async function mgReview(p,io){
  const M=p.magic;if(!p.career||p.unemployed>0)return;
  const R=MG_RANKS[p.career];
  const c=await choose(p,io,{kind:'minor',bg:MAGIC_JOBS[p.career].bg,title:'รอบประเมินผลงาน',text:'ตำแหน่งตอนนี้: '+R[M.rank]+'\n'+incomeCaption(p),noStory:true,choices:[
    {k:'grind',label:'ทุ่มทำผลงานหนักทั้งปี',sub:'H−6 J−4 · โอกาสเลื่อนขั้นสูงขึ้นมาก'},
    {k:'boss',label:'เข้าหาผู้ใหญ่ในสภา',sub:'ยิ่งเส้นสายมากยิ่งได้ผล · เสี่ยงถูกมองว่าประจบ'},
    {k:'calm',label:'ทำงานตามปกติ ใช้ชีวิตให้สมดุล',sub:'J+3 H+2 · โอกาสเลื่อนขั้นน้อยลง'},
    {k:'shadow',label:'ใช้เงาข่มขู่คู่แข่ง',sub:'ได้ผลแทบแน่นอน · เงา+2 ไว้ใจ−2',cond:M.shadow>=6,condText:'ต้องมีพลังเงา 6 ขึ้นไป'}]});
  let adj=0;
  if(c.k==='grind'){fx(p,{H:-6,J:-4});adj=14;}
  if(c.k==='boss'){adj=(p.C-50)*.5+(chance(.3)?-12:4);}
  if(c.k==='calm'){fx(p,{J:3,H:2});adj=-4;}
  if(c.k==='shadow'){mgApply(p,{K:-4,sh:2,tr:-2});adj=26;}
  const sc=(p.S-50)*.5+M.knowledge*.8+M.trust*.5+(p.H-60)*.2+(p.career==='mageRogue'?M.shadow*.7:(M.shadow>=12?-8:0))-M.rank*9+adj+randi(-15,15);
  const o=sc>=12?'good':sc>=-6?'mid':'bad';const out=[];
  if(o==='good'){if(M.rank<3)mgRank(p,1,out);else{fx(p,{m:200000,J:5});out.push('ได้โบนัสพิเศษ ฿200,000');}fx(p,{J:4});}
  if(o==='mid'){fx(p,{J:-1});}
  if(o==='bad'){mgRank(p,-1,out);fx(p,{J:-6});}
  const t={good:'ผลงานของคุณเข้าตาผู้ใหญ่',mid:'ผลประเมินอยู่ในเกณฑ์ปกติ ตำแหน่งยังเท่าเดิม',bad:'ผลประเมินต่ำกว่าเกณฑ์ เพื่อนร่วมงานเริ่มซุบซิบกันลับหลัง'}[o]+(c.k==='boss'&&o!=='good'?'\nบางคนมองว่าคุณเอาแต่ประจบผู้ใหญ่':'');
  log(p,'ประเมินผลงาน: '+OUT_TH[o]);
  await say(p,io,{kind:'result',bg:MAGIC_JOBS[p.career].bg,title:'ผลประเมิน: '+OUT_TH[o],text:t+(out.length?'\n'+out.join(' · '):'')+'\n'+incomeCaption(p),outcome:o});
  await mgCheck(p,io);
}

function mgFinalOdds(p){
  const M=p.magic,f=M.f;
  const allies=(mgFriendHere(p)&&M.friend>=5?.1:0)+(f.rivalAlly?.1:0)+(f.lastLesson?.1:0);
  return {seal:clamp((M.trust-3)*.05+allies,.05,.95),study:clamp((M.knowledge-5)*.045+(f.riftLore?.08:0)+(f.lastLesson?.05:0),.05,.95),rule:clamp((M.shadow-5)*.05,.05,.95)};
}

 }
}

// Keep the old input slot so replay-based saves retain their event alignment.
// Value 4 marks automatic casting; values 0-3 belong to the former setup page.
async function mgSchoolCast(p,io){
 const setup=await choose(p,io,{autoChoice:4,noStory:true,choices:['opp','same','mix','classic','auto'].map(k=>({label:'',k}))});
 const other=p.sex==='M'?'F':'M',classic={rival:'M',friend:'F',star:'F'},cast={};
 for(const who of ['rival','friend','star']){
  // Old mixed-cast saves must consume the same random rolls when replayed.
  let sx=setup.k==='auto'?(who==='rival'?other:(chance(.5)?'M':'F')):
   setup.k==='opp'?other:setup.k==='same'?p.sex:setup.k==='classic'?classic[who]:(chance(.5)?'M':'F');
  if(who==='rival')sx=other;
  cast[who]={sex:sx,name:MG4_NAMES[who][sx]};
 }
 return cast;
}

async function mg4Rom(p,io,i){
 const M=p.magic,f=M.f;
 if(!M.loveWho||f.loveEnded)return;
 if(M.loveWho==='friend'&&!mgFriendHere(p)){f.loveEnded=1;return;}
 if(i>=3&&f.lrWin&&!f.partner){if(i===3){await mgEvent(p,io,{...MG4_HEART,card:mgLoveCard});f.romLast=p.log[p.log.length-1].text;}return;}
 if(i===4&&!f.partner)return;
 const ev=MG4_ROM[M.loveWho][i];
 await mgEvent(p,io,{...ev,t:q=>`บทรัก ${i+1}/5 · `+mgT(q,ev.t),card:mgLoveCard});
 f.romLast=p.log[p.log.length-1].text;
}

// Extra boss scenes start after the replay boundary stored by the save system.
function storyBossScenes(){
 if(typeof SaveGame==='undefined'||!SaveGame.active)return true;
 const from=SaveGame.active.game.bossStoryFrom;
 return Number.isInteger(from)&&SaveGame.cursor>=from;
}
function mgBossAllies(p,exclude=[]){
 const M=p.magic,f=M.f,out=[];
 const add=w=>{if(w&&!exclude.includes(w)&&!out.includes(w))out.push(w);};
 if(mgWithLove(p)&&!f.partnerDied&&!f.loveEnded&&!(M.loveWho==='rival'&&(f.drShadow||f.drJailed)))add(M.loveWho);
 if((f.rivalAlly||mgDrAlly(p))&&!f.drShadow&&!f.drJailed)add('rival');
 if(mgFriendHere(p)&&M.friend>=5)add('friend');
 if(M.star>=5)add('star');
 return out;
}
function mgBossRescuer(p,exclude=[]){
 const who=mgBossAllies(p,exclude)[0]||'guardian';
 return {who,name:who==='guardian'?'หัวหน้าหน่วยผู้พิทักษ์':mgN(p,who)};
}

}

async function mgBossPrelude(p,io){
 const M=p.magic,f=M.f,actors=mgBossAllies(p).slice(0,3);
 await mgBossBeat(p,io,'magicWarRoom','ก่อนระฆังครั้งสุดท้าย','เสียงเตือนดังมาถึงห้องที่คุณเก็บสมุดจากวิหารไว้ หน่วยลาดตระเวนรายงานว่าแนวป้องกันรอบโรงเรียนแตกแล้ว คุณหยิบไม้กายสิทธิ์เล่มเดิมขึ้นมา ก่อนเปิดหน้ากระดาษที่เคยวงไว้\n'+(f.bossPlan==='seal'?'สมุดบอกจังหวะที่วงคราสกลางอกเปิดรับคาถา คุณจดมันบนฝ่ามือ เผื่อในสนามรบจะไม่มีเวลาพลิกหน้า':f.bossPlan==='rescue'?'ระฆังสามครั้งดังจากแนวป่า จุดอพยพที่คุณเตรียมไว้เริ่มรับคนเจ็บ และมีคนรอสัญญาณจากคุณอยู่ที่ปลายทาง':'คุณฝากเส้นทางอพยพไว้กับหน่วยผู้พิทักษ์ แล้วเลือกทางที่ยังไปถึงลานกลางโรงเรียนได้')+'\n'+(actors.length?'คนที่มาถึงก่อนยืนรออยู่ข้างโต๊ะ ไม่มีใครพูดคำสัญญาว่าทุกคนจะกลับมา คุณจึงเรียกชื่อพวกเขาทีละคน เพื่อให้แน่ใจว่ายังได้ยินคำตอบ':'ไม่มีเพื่อนเก่ามาถึงจุดนัดพบ คุณส่งแผนให้หน่วยผู้พิทักษ์ แล้วเดินออกไปพร้อมเสียงระฆังที่ตามอยู่ด้านหลัง'),actors,{});
}
async function mgBossAftermath(p,io,id,ctx={}){
 const M=p.magic,f=M.f,dead=!!ctx.partnerDied||!!f.partnerDied,partner=mgWithLove(p)&&!dead?M.loveWho:null;
 const alive=mgBossAllies(p,dead&&M.loveWho?[M.loveWho]:[]),rescue=mgBossRescuer(p,dead&&M.loveWho?[M.loveWho]:[]);
 const beat=(bg,title,text,actors=alive.slice(0,2),detail={})=>mgBossBeat(p,io,bg,title,text,actors,detail);
 if(id==='exile'){
  await beat('magicResistance','ทางที่คุณเลือกเดินออกมา','คุณพ้นแนวป่าก่อนเสียงระฆังจะเงียบลง เมื่อหันกลับไป แสงเหนือโรงเรียนดับไปทีละหอ ไม่มีใครออกคำสั่งให้คุณกลับไป คุณจึงเดินต่อพร้อมสัมภาระที่ถือมาได้เพียงมือเดียว\n'+(partner?'{P}เดินข้างคุณ เงียบจนถึงที่พักแรก คืนนั้นทั้งคู่แบ่งน้ำถ้วยเดียวกัน และไม่มีใครเอ่ยถึงบ้านเดิม':[...alive].length?'คนที่ถอนตัวมาทันแยกย้ายกันตรงทางแยก ทุกคนมีชื่อที่ยังรอฟังข่าวอยู่':'คุณพักใต้ชายคาโรงเลี้ยงสัตว์ร้าง และสะดุ้งทุกครั้งที่เห็นแสงสีม่วงจากทิศที่เดินมา'),partner?[partner]:[],{});
  await beat('magicResistance','ข่าวจากบ้านที่ไกลออกไป','เดือนต่อมา จดหมายจากโลกเวทมาถึงพร้อมตราคราสสีดำ ถนนที่คุณจำได้ถูกปิด โรงเรียนหยุดรับนักเรียน และผู้คนเริ่มหายไปจากรายชื่อผู้ส่ง\nคุณหาที่อยู่ใหม่ ทำงานเล็ก ๆ เพื่อให้มีข้าวกิน และเก็บจดหมายทุกฉบับไว้ในหีบ ชีวิตยังเดินต่อได้ แต่ทุกครั้งที่เปิดหีบ คุณต้องเผชิญกับคืนที่เลือกเดินออกมาอีกครั้ง',partner?[partner]:[],{powerless:true});return;
 }
 if(id==='eclipse'){
  await beat('magicLastStand','ก่อนแสงสุดท้ายจะดับ','คุณพยายามลุกขึ้นอีกครั้ง แต่ขาไม่รับน้ำหนักแล้ว {B}ยกมือเข้าหาดวงจันทร์ เงาของเขาทอดข้ามตัวคุณไปถึงประตูโรงเรียน\n'+(alive.length?rescue.name+'วิ่งย้อนมาทางลาน คุณเห็นคาถาจากอีกฝั่งตกใส่ทางเชื่อมก่อนจะมาถึง จึงผลักไม้กายสิทธิ์ลงพื้น เปิดโล่ครั้งสุดท้ายให้คนที่ยังเดินได้ถอนตัว':'เสียงผู้พิทักษ์เรียกให้ถอยดังจากหลังแนวกำแพง คุณยกมือส่งสัญญาณว่าอย่ากลับมา ก่อนใช้แรงที่เหลือค้ำประตูให้คนเจ็บผ่านออกไป')+'\nโล่แตกก่อนเสียงระฆังครั้งถัดไป คุณไม่ได้เห็นว่าดวงจันทร์ดับลงเมื่อไร',alive.slice(0,1),{fallenPlayer:true,hidePlayer:true,dark:true});
  await beat('magicMemorial','ชื่อที่คนรอดชีวิตพากลับไป','ไม่มีใครนำร่างคุณกลับออกมาได้ ผู้รอดชีวิตเก็บเศษไม้กายสิทธิ์ไว้ในกล่อง และจารึกชื่อคุณบนหินที่แนวป่า\n'+(alive.length?rescue.name+'ยืนอ่านรายชื่อจนจบ ก่อนวางโคมลงข้างหิน':'หัวหน้าหน่วยผู้พิทักษ์อ่านรายชื่อแทนคนที่ไม่มีญาติมาถึง')+' ไม่มีเสียงปรบมือ มีเพียงคำบอกเล่าว่าคุณค้ำทางออกไว้นานพอให้พวกเขารอด\nหลังจากนั้น ที่พักชั่วคราวกลายเป็นจุดเริ่มต้นของคนกลุ่มเล็ก ๆ ที่ยังไม่ยอมรับคำสั่งจากราหุลกาฬ',alive.slice(0,2),{hidePlayer:true,dark:true});f.bossFinalMourned=1;return;
 }
 if(id==='rescued'){
  await beat('magicTempleEscape','คนที่ไม่ยอมทิ้งคุณไว้',rescue.name+'ย้อนกลับเข้ามาหลังโล่ของคุณแตก '+(rescue.who==='guardian'?'ลูกทีมของหน่วยผู้พิทักษ์ใช้ผ้าใบหามคุณผ่านทางระบายน้ำใต้ลาน':'มือที่คว้าคอเสื้อคุณไว้ลากผ่านซากบันได ขณะที่คุณหมดแรงแม้แต่จะบอกว่าเจ็บตรงไหน')+'\nข้างหลัง ราหุลกาฬยังยืนอยู่กลางวงคราส คุณแพ้ศึกนี้ แต่เสียงเรียกชื่อคุณยังดังอยู่ใกล้พอให้พยายามลืมตาอีกครั้ง',[rescue.who],{injured:true,dark:true});
  await beat('magicRecovery','ฟื้นขึ้นในที่ที่ยังมีคนรอ','คุณตื่นในที่พักชายป่า'+(rescue.who==='guardian'?' หัวหน้าหน่วยผู้พิทักษ์นั่งนับเสบียงอยู่ปลายเตียง':' '+rescue.name+'หลับคาเก้าอี้ มือยังจับชายผ้าที่พันแผลคุณไว้')+' ผู้รักษาบอกว่าคุณกลับไปสู้แบบเดิมไม่ได้อีกแล้ว\nคุณขอให้เปิดหน้าต่าง ดวงจันทร์ยังแหว่งอยู่ ผู้คนยังต้องหลบซ่อน แต่เช้าวันนั้นคุณเริ่มจดสิ่งที่พลาดลงในสมุด เพื่อไม่ให้คนที่จะไปต่อจากคุณต้องลองผิดแบบเดิม',[rescue.who],{injured:true,powerless:true});
  await beat('magicResistance','สิ่งที่สอนคนรุ่นต่อไป','ในเดือนต่อมา เด็กฝึกกลุ่มแรกมานั่งล้อมโต๊ะของคุณ พวกเขาถามว่าราหุลกาฬแพ้คาถาอะไร คุณเริ่มจากแผนที่ทางหนี แล้วค่อยเล่าเรื่องจังหวะที่ตัวเองมองไม่เห็น\nคุณฝึกให้พวกเขาเรียกชื่อกันทุกครั้งก่อนถอนตัว และกลับไปนับคนที่จุดนัดพบเสมอ การสู้ครั้งต่อไปจะเป็นของพวกเขา ส่วนหน้าที่ของคุณคือทำให้พวกเขามีโอกาสกลับมาเล่าต่อ',[rescue.who],{powerless:true,dark:true});return;
 }
 if(id==='shadow'){
  await beat('magicAftermath','เงาที่เหลืออยู่หลังเขาล้ม','ร่างของ{B}แตกลงกลางลาน แต่เงาจากบาดแผลของเขาไม่ได้กลับขึ้นฟ้า มันไหลเข้ามาตามเส้นเลือดของคุณ เสียงผู้คนที่ร้องเรียกเริ่มเบาลง จนเหลือเพียงเสียงของตัวเอง\nคุณทดลองยกมือ เงาทั้งลานยกตาม กำแพงที่แตกคืนรูปในพริบตา เมื่อหันกลับไป คนที่เคยยืนข้างคุณกำลังถอยห่าง',[],{dark:true});
  await beat('magicShadowThrone','ห้องที่ไม่มีใครกล้าเข้ามา','ประตูเมืองเปิดตามคำสั่งคุณ ถนนถูกซ่อม และไม่มีใครกล้าก่อเหตุใต้เงาจันทร์อีก ชาวเมืองก้มหัวเมื่อคุณผ่าน หน้าร้านที่เคยเรียกให้แวะดื่มชาปิดเงียบก่อนคุณจะเดินถึง\nในห้องทำงาน คุณวางเก้าอี้อีกตัวไว้ตรงข้ามโต๊ะ ไม่มีใครนั่งมันเลยตลอดฤดูหนาวนั้น',[],{dark:true});return;
 }
 const lost=ctx.partnerDied?M.loveWho:null;
 if(id==='redeemed'){
  await beat('magicAftermath','มือที่ดึงคุณกลับมา','เมื่อร่าง{B}สลาย เงาที่คุณใช้กลับพันรอบข้อมือตัวเอง แสงบนฟ้าดับวูบในสายตา และคุณเริ่มจำไม่ได้ว่ากำลังสู้เพื่ออะไร\n{F}คว้ามือข้างนั้นไว้ แล้วเรียกชื่อคุณซ้ำ ๆ เหมือนตอนปลุกไปเรียนปีแรก คุณปล่อยไม้กายสิทธิ์ เงาหลุดออกจากแขนกลับลงรอยแยก ทิ้งให้คุณล้มลงตรงหน้าคนที่ยังไม่ยอมปล่อยมือ',['friend'],{injured:true});
 }else if(id==='sacrifice'){
  await beat('magicAftermath','เมื่อคาถาสุดท้ายเงียบลง','รอยแยกหุบลงตรงหน้าคุณ {B}ยื่นมือกลับออกมาไม่ทัน แสงจากผนึกค่อย ๆ หมดจากปลายไม้กายสิทธิ์ ก่อนเนื้อไม้จะแตกเป็นผงอยู่ในมือ\nคุณลองเรียกแสงเล็ก ๆ แบบที่เรียนในคาบแรก ไม่มีอะไรเกิดขึ้นแล้ว '+(alive.length?rescue.name+'เข้ามารับน้ำหนักคุณไว้ ก่อนทั้งคู่จะนั่งลงกับพื้น':'ผู้พิทักษ์ที่รอดอยู่เข้ามาหามคุณออกจากแนวหิน')+' บนฟ้า ดวงจันทร์กลับมาเต็มดวง',alive.slice(0,1),{powerless:true,injured:true});
 }else{
  await beat('magicAftermath',id==='loveLost'?'ชัยชนะท่ามกลางความเงียบ':'เช้าที่ตามหลังคืนจันทร์ดับ','วงคราสกลางอก{B}แตก แสงที่ไหลออกมาคืนสู่ดวงจันทร์ทีละสาย เงาบนพื้นหายไป เหลือซากลานที่คุณเพิ่งมองเห็นว่าพังไปมากแค่ไหน\n'+(lost?'คุณเรียก{P}แล้วไม่ได้ยินคำตอบ ร่างที่รับคาถาแทนคุณยังอยู่ข้างเศษเสาหิน คุณคุกเข่าลง เรียกอีกครั้ง และรู้ว่าการที่ฟ้าสว่างแล้วไม่ได้ทำให้ทุกอย่างกลับมา':'คุณรอฟังคาถาลูกถัดไปอยู่หลายลมหายใจ เมื่อไม่มีอะไรตามมา จึงได้ยินเสียงคนเจ็บเรียกจากใต้ซากกำแพง คุณกับคนที่ยังยืนได้เริ่มยกหินออกทีละก้อน'),alive.slice(0,2),{deadWho:lost});
 }
 if(lost){
  await beat('magicMemorial','โคมที่ไม่ได้ลอยด้วยกัน','หลังหาคนที่ติดอยู่ใต้ซากลานครบ คุณพา{P}กลับผ่านประตูโรงเรียนด้วยกันเป็นครั้งสุดท้าย\nในคืนส่งลา คุณวางไม้กายสิทธิ์ของ{P}ข้างโคมหนึ่งดวง ไม่มีใครเร่งให้คุณกล่าวอะไร คุณจึงเล่าเรื่องเล็ก ๆ จากคืนที่ลอยโคมด้วยกัน จนคำพูดขาดหายไปเอง\nเมื่อทุกคนกลับ คุณเก็บโคมอีกดวงไว้กับตัว ดวงจันทร์สว่างเต็มฟ้า แต่ทางกลับห้องเงียบกว่าที่เคย',alive.slice(0,2),{memorialWho:lost});
  await mgHonor(p,io,memorialPerson(p,lost),{key:'partner:'+lost,skipService:true});
  await beat('magicRecovery','เช้าวันที่ยังต้องตื่นขึ้นมา','คุณกลับถึงห้องแล้วเผลอเรียก{P}ให้ช่วยปิดหน้าต่าง มือจึงหยุดอยู่กลางอากาศเมื่อจำได้\nข้างโต๊ะมีจดหมายจากคนที่ช่วยออกมาจากลาน หนึ่งฉบับเขียนชื่อเด็กที่ได้กลับบ้าน คุณอ่านมันช้า ๆ ก่อนวางข้างโคม ชีวิตหลังชัยชนะไม่ได้หายเจ็บในวันเดียว แต่เช้าวันนั้นคุณยอมเปิดประตูรับคนที่มาเคาะ',alive.slice(0,1),{powerless:id==='sacrifice',injured:true});

// ---------- นิสัยสุขภาพ ----------
function hab(p){ if(!p.hab) p.hab = { smoke:0, smokeFrom:0, smokeYrs:0, drink:0, drinkYrs:0, ex:0, exYrs:0, hFrac:0 }; return p.hab; }
const DISEASES = {
  hyper:   { name:'ความดันโลหิตสูง', chronic:true },
  diabetes:{ name:'เบาหวาน', chronic:true },
  lung:    { name:'มะเร็งปอด', chronic:false, lost:30 },
  liver:   { name:'ตับแข็ง', chronic:false, lost:25 },
  kidney:  { name:'ไตวายเรื้อรัง', chronic:true, lost:15 },
  heart:   { name:'หัวใจขาดเลือดเฉียบพลัน', chronic:false, lost:30 },
};
function hasDz(p, k){ return !!(p.dz && p.dz[k]); }
// เรียกทุกปีจาก years(): ผลสะสมของนิสัย + สุ่มโรค (คืนชื่อโรคที่เพิ่งเป็น)
function habitYear(p){
  const h = hab(p);
  if(h.smoke) h.smokeYrs++;
  if(h.drink === 2) h.drinkYrs++; else if(h.drink === 1) h.drinkYrs += .3;
  if(h.ex) h.exYrs++;
  let d = 0;

    diabetes: .0025 + .004*lux + .003*(h.ex?0:1) + .002*(h.drink>=1?1:0),

  };

}
function dzCause(p, k){

async function bizScale(p, io){
  if(p.career !== 'biz' || p.cOut !== 'good' || p.status.prison || p.flags.scaled) return;
  p.flags.scaled = true;
  const ipo = clamp(Math.round(25 + 0.3*(p.S-50) + 0.3*(p.C-50) + (p.flags.branch?10:0) + (p.seeds?.trader?5:0)), 8, 70);
  const c = await choose(p, io, { kind:'fork', bg:'office', title:'บริษัทของคุณโตจนนักลงทุนรายใหญ่เริ่มสนใจ', text:'ทางเลือกนี้อาจเปลี่ยนคุณเป็นเศรษฐีระดับประเทศ', choices:[
    { label:'เข้าตลาดหลักทรัพย์ (IPO)', sub:`สำเร็จ ${ipo}% · ถ้าสำเร็จ หุ้นที่ถือมีมูลค่าหลายร้อยล้านถึงหลักพันล้าน`, cost:5000000, k:'ipo' },
    { label:'ขายกิจการให้ทุนใหญ่', sub:'ได้เงินก้อน 40–120 ล้าน · หยุดทำธุรกิจ', k:'sell' },
    { label:'ทำต่อแบบเดิม', sub:'ไม่เสี่ยง', k:'keep' } ]});
  if(c.k==='ipo'){
    if(chance(ipo/100)){ const v = randi(30, 300) * 10000000 * .6; addMoney(p, Math.round(v)); p.incomeBoost *= 3; fx(p,{J:10,C:30}); p.flags.tycoon = true; log(p,'บริษัทเข้าตลาดหลักทรัพย์');
      await say(p, io, { kind:'result', bg:'office', outcome:'good', title:'เคาะระฆังเปิดซื้อขายวันแรก', text:`หุ้นที่คุณถือมีมูลค่า ฿${baht(Math.round(v))}\nชื่อคุณขึ้นทำเนียบคนรวยของนิตยสารธุรกิจ` }); }
    else { fx(p,{J:-10}); note(p,'ก.ล.ต. ไม่อนุมัติ นักลงทุนถอนตัว เงินเตรียมการ 5 ล้านหายไป'); }
  }
  if(c.k==='sell'){ const v = randi(40, 120) * 1000000; addMoney(p, v); p.incomeBoost *= .05; fx(p,{J:5}); p.flags.soldBiz = true; log(p,'ขายกิจการ'); note(p, `ขายกิจการได้ ฿${baht(v)} คุณไม่ต้องทำงานอีกเลยถ้าไม่อยากทำ`); }
}
async function influBrand(p, io){

  if(!await yesno(p, io, { kind:'fork', bg:'stream', title:'แฟนคลับเรียกร้องให้ออกแบรนด์ของตัวเอง', sub:'สำเร็จ 35% · ถ้าปัง ได้ 50–200 ล้าน', cost:2000000, yes:'ออกแบรนด์', no:'รับรีวิวต่อไป' })) return;

}

async function offerTempt(p, io, d){
  p._tempt = d;
  const yes = await yesno(p, io, { kind:'tempt', bg: p.age < 18 ? 'school' : 'city', title:'ทางลัดที่ไม่มีใครเห็น', text: val(d.label, p), sub: p.age >= 18 ? val(d.gain, p).replace(`${Math.round(d.risk*100)}%`, pctR(p, d.risk)) : val(d.gain, p), noSub: d.refuseK ? `K+${d.refuseK}` : '', yes: d.yes || 'ทำ', no: d.no || 'ไม่ทำ' });
  if(!yes){
    if(d.refuseRun) d.refuseRun(p);
    if(d.refuseK){ fx(p,{K:d.refuseK}); tagGood(p,'honest',`ปฏิเสธ: ${val(d.label,p)}`); }
    note(p, d.refuseNote || 'คุณเลือกไม่ทำ');
    return;
  }
  if(d.fx) fx(p, d.fx);
  if(d.m) fx(p, { m: val(d.m, p) });
  fx(p, { K: d.K }); tagBad(p, d.tag, val(d.label, p), val(d.amount, p) || val(d.m, p) || 0);
  let txt = d.run ? d.run(p) : '';
  if(chance(p.age >= 18 ? connRisk(p, d.risk) : d.risk)){ const t = await d.caught(p, io); if(t) note(p, t); }
  else note(p, txt || 'ไม่มีใครรู้ อย่างน้อยก็ในตอนนี้');
}

const CAREER_BANK = { gov:1, office:.95, factory:.9, biz:.8, farm:.75, influ:.7, abroad:.7 };
function loanOdds(p, price){
  const hh = Math.max(1, hhIncome(p)); const pay = price * .9 * .0065; const r = pay / hh;
  const base = r <= .3 ? .95 : r <= .45 ? .7 : r <= .6 ? .35 : r <= .8 ? .1 : .02;
  return clamp(base * (CAREER_BANK[p.career] || .6) * (p.status.bankrupt ? 0 : 1) * bkRec(p) * (p.flags.fled ? .3 : 1), 0, .97);
}
function setHouse(p, h, price, loan){
  const hh = Math.max(1, hhIncome(p));
  p.house = { value: price, years: 0, q: h.q, id: h.id, name: h.name, term: 30, loan: loan || 0, saveCut: loan > 0 ? clamp(loan * .0065 / hh, .03, .5) : 0 };
  fx(p, { J: h.J, C: h.C }); log(p, `ได้${h.name}`);
}
async function houseChoice(p, io, upgrade = false, title = null){
  if(p.flags.livesAbroad){
    if(upgrade || p.status.prison || !p.career) return;
    await say(p, io, { kind:'life', bg:'abroad', title:'บ้านของคุณในต่างแดน', text:'คุณต่อสัญญาเช่าห้องใกล้ที่ทำงาน ค่าที่พักรวมอยู่ในค่าใช้จ่ายปกติแล้ว ส่วนบ้านของครอบครัวยังอยู่ที่ไทย' });
    return;
  }
  if(!p.career || p.status.prison) return;
  if(!upgrade && p.house) return;
  if(upgrade && (!p.house || p.house.q >= 5)) return;
  const sell = upgrade ? Math.round(p.house.value * .9) : 0;
  const cash = Math.max(0, p.money) + sell;
  const opts = HOMES.filter(h => !upgrade || h.q > p.house.q).map(h => {
    const down = Math.round(h.price * .1);
    const payCash = cash >= h.price;
    const odds = payCash ? 1 : loanOdds(p, h.price);
    const pay = Math.round(h.price * .9 * .0065 / 100) * 100;
    const cond = (h.cond ? h.cond(p) : true) && cash >= down;
    return { label:h.name, sub: payCash ? `ราคา ฿${baht(h.price)} · จ่ายสดได้ · J+${h.J}` : `ราคา ฿${baht(h.price)} · ผ่อน ~${baht(pay)}/เดือน · กู้ผ่าน ${Math.round(odds*100)}%`, cost: upgrade ? 0 : (payCash ? h.price : down), loan:false,
      cond, condText: h.cond && !h.cond(p) ? h.condText : `ต้องมีเงินดาวน์ ฿${baht(down)}`, k:h.id, h, odds, payCash, down };
  });
  const famHome = !p.flags.livesAbroad && (p.q>=2 || p.tier===4 || p.tier===5);
  opts.push({ label: upgrade ? 'อยู่บ้านเดิมต่อ' : famHome ? (parentsWord(p) ? 'อยู่บ้านพ่อแม่ไปก่อน' : 'อยู่บ้านเก่าของครอบครัวไปก่อน') : 'เช่าอยู่ไปก่อน', sub: upgrade ? 'ไม่มีผล' : 'ค่าที่พักอยู่ในค่าใช้จ่ายปกติ', k:'none' });
  const c = await choose(p, io, { kind:'minor', bg:'home', title: title || (upgrade ? `ขายบ้านเดิม (ได้ ฿${baht(sell)}) แล้วขยับขึ้นไหม` : 'จะมีบ้านเป็นของตัวเองไหม'), text:`รายได้ครัวเรือนราว ฿${baht(hhIncome(p))}/เดือน · เงินเก็บ ฿${baht(p.money)}`, choices: opts.map(o => ({ ...o, defer: upgrade })) });
  if(c.k === 'none') return;
  if(!c.payCash && !chance(c.odds)){ if(!upgrade) addMoney(p, c.cost); note(p, 'ธนาคารไม่อนุมัติสินเชื่อ ได้เงินดาวน์คืน'); return; }
  if(upgrade){ addMoney(p, sell); const pay = c.payCash ? c.h.price : c.down; addMoney(p, -pay); note(p, `ขาย${p.house.name || 'บ้านเดิม'}ได้ ฿${baht(sell)}`); }
  setHouse(p, c.h, c.h.price, c.payCash ? 0 : c.h.price - c.down);
  note(p, c.payCash ? `ซื้อ${c.h.name}ด้วยเงินสด` : `กู้ผ่าน ได้${c.h.name} ผ่อน 30 ปี`);
}

async function carChoice(p, io){
  if(!p.career || p.status.prison) return;
  const hh = Math.max(1, hhIncome(p));
  const opts = CARS.map(c => {
    const down = Math.round(c.price * .15), pay = Math.round(c.price * .85 * 1.21 / 84 / 100) * 100;
    const payCash = p.money >= c.price;
    const r = pay / hh; const odds = payCash ? 1 : clamp((r <= .15 ? .95 : r <= .25 ? .75 : r <= .4 ? .35 : .05) * (CAREER_BANK[p.career] || .6) * (p.status.bankrupt ? 0 : 1) * bkRec(p), 0, .97);
    return { label:c.name, sub: payCash ? `฿${baht(c.price)} · จ่ายสดได้` : `฿${baht(c.price)} · ผ่อน ~${baht(pay)}/เดือน 7 ปี · ไฟแนนซ์ผ่าน ${Math.round(odds*100)}%`, cost: payCash ? c.price : down, loan:false,
      cond: p.money >= down, condText:`ต้องมีเงินดาวน์ ฿${baht(down)}`, k:c.id, car:c, payCash, pay, odds };
  });
  opts.push({ label:'ยังไม่ซื้อ ใช้รถสาธารณะ', sub:'ประหยัด', k:'none' });
  const c = await choose(p, io, { kind:'minor', bg:'road', title:'จะซื้อรถไหม', text:`รายได้ครัวเรือนราว ฿${baht(hh)}/เดือน · เงินเก็บ ฿${baht(p.money)}`, choices: opts });
  if(c.k === 'none') return;
  if(!c.payCash && !chance(c.odds)){ addMoney(p, c.cost); note(p,'ไฟแนนซ์ไม่อนุมัติ ได้เงินดาวน์คืน'); return; }
  const C = c.car; p.car = { id:C.id, name:C.name, price:C.price };
  fx(p, { J:C.J, C:C.C, H:C.H });
  if(!c.payCash) p.annual.push({ from:p.age, to:p.age+7, amt: c.pay * 12 });
  if(C.repair) p.annual.push({ from:p.age, to:p.age+8, amt:C.repair });
  log(p, `ได้${C.name}`);
  note(p, c.payCash ? `ซื้อ${C.name}ด้วยเงินสด` : `ไฟแนนซ์ผ่าน ได้${C.name}`);
}

function s0(p){ return p.tier === 1 ? 'ในซอยย่านชานเมืองกรุงเทพฯ' : `ในตัวเมือง${p.prov}`; }

function actionOf(o, c){

  let t = (o.title || '').replace(/\s*\(.*?\)\s*/g, ' ').replace(/\s*(ไหม|หรือเปล่า|\?)\s*$/, '').trim();
  return { pick: false, text: t };
}

function storyFor(p, o, c){
  try {
    if(!o || !c || SKIP_KIND.test(o.kind || '')) return '';
    if(c.story) return typeof c.story === 'function' ? c.story(p) : c.story;
    const X = ctxOf(p);
    let s = '';
    for(const S of STORIES){ if(S.t(o, c)){ s = S.f(X, p, o, c) || ''; break; } }
    if(!s) s = genericStory(p, X, o, c);
    p._recent = p._recent || [];

    p._recent.push(s); if(p._recent.length > 8) p._recent.shift();
    return s;
  } catch(e){ return ''; }

  if(kid){
    const react = costly ? (X.poor ? `${X.carer}นับเงินในกระป๋องอยู่นานก่อนจะพยักหน้า` : `${X.carer}จ่ายให้โดยไม่ถามสักคำ`)
      : pk([`${X.carer}ฟังแล้วไม่ได้ว่าอะไร`, `${X.carer}ลูบหัวคุณเบา ๆ`, `${X.carer}บอกว่าโตแล้วก็คิดเองได้`], p);
    return pk([`${did} คืนนั้นที่${X.home} ${react}`, `${did} เรื่องนี้กลายเป็นหัวข้อคุยในวงข้าวเย็นระหว่างกิน${X.food}`, `${did} ระหว่าง${X.go}กลับบ้าน คุณฟัง${X.sound}แล้วคิดเรื่องนี้ไปตลอดทาง`], p);
  }
  let money = '';
  if(costly && p.money < c.cost * 2 && p.money >= 0) money = 'เงินเก็บที่มีอยู่น้อยนิดหายไปอีกก้อน';
  else if(costly && p.money > c.cost * 50) money = 'เงินก้อนนี้แทบไม่ทำให้บัญชีของคุณขยับ';
  const tail = fresh(p, money) || fresh(p, mood(p)) || (rnd() < .6 ? fresh(p, memory(p)) : '');
  return `${placeNow(p, X)} ${did}${tail ? ' · ' + tail : ''}`;
}

  insider: { name:'หุ้นตามข้อมูลวงใน',         short:'หุ้นตามข้อมูลวงใน', sub:'เฉลี่ยราว 10%/ปี · ผันผวนต่ำ · K−10 · เสี่ยงโดน ก.ล.ต.' },

function investYear(p, notes){
  if(p.age < 22 || p.money <= 0) return;
  const k = p.invest || 'bank';
  const crash = chance(.06); // ปีวิกฤตของทั้งตลาด
  let r;
  if(k === 'bank') r = .015;
  else if(k === 'fund') r = crash ? -.30 + .05*gauss() : .065 + .11*gauss();
  else if(k === 'spec') r = crash ? -.6 + .1*gauss() : .07 + .38*gauss();
  else { r = .10 + .07*gauss(); if(chance(connRisk(p, .06))) p._secCase = true; }
  r = clamp(r, -.75, 1.5);
  const amt = Math.round(p.money * r);
  p.money += amt;
  p.invRet = (p.invRet || 0) + amt;
  if(crash && (k === 'fund' || k === 'spec')) notes.push(`ปีวิกฤต ตลาดหุ้นดิ่ง พอร์ต${INVEST[k].short}ของคุณหายไป ฿${bahtS(-amt)}`);
  else if(k === 'spec' && r > .6) notes.push(`หุ้นที่คุณถือพุ่งแรง พอร์ตโตขึ้น ฿${bahtS(amt)}`);
  else if(k === 'spec' && r < -.3) notes.push(`หุ้นซิ่งในพอร์ตร่วงหนัก หายไป ฿${bahtS(-amt)}`);
}
async function secCase(p, io){
  await say(p, io, { kind:'event', bg:'court', title:'ก.ล.ต. ตรวจพบการซื้อขายผิดปกติ', text:'ชื่อคุณอยู่ในรายชื่อคนที่ซื้อหุ้นก่อนข่าวใหญ่ออกไม่กี่วัน' });
  const fine = Math.round(Math.max(200000, p.money * .3));
  const c = await choose(p, io, { kind:'fork', bg:'court', title:'จะจัดการคดีนี้ยังไง', choices:[
    { label:'ยอมจ่ายค่าปรับทางแพ่ง', sub:`฿−${baht(fine)} · C−10`, k:'pay' },
    { label:'สู้คดี', sub:'ชนะ 40% · ถ้าแพ้โดนคดีอาญา', cost:300000, k:'fight' },
    { label:'ให้คนรู้จักช่วยเคลียร์', sub:`ต้องมี C 70 ขึ้นไป · หลุด 70%`, cond:p.C>=70, condText:'C ต้องถึง 70', k:'line' } ]});
  p.invest = 'bank';
  if(c.k==='pay'){ fx(p,{m:-fine,C:-10}); note(p,'จ่ายค่าปรับแล้ว ถูกห้ามซื้อขายหุ้น 5 ปี'); }
  if(c.k==='fight'){ if(chance(.4)) note(p,'ศาลยกฟ้อง แต่คุณเลิกใช้ข้อมูลวงในไปเลย'); else { fx(p,{m:-fine}); await arrested(p, io, 'คดีใช้ข้อมูลภายในซื้อขายหลักทรัพย์', 1); } }
  if(c.k==='line'){ fx(p,{K:-10}); tagBad(p,'corrupt','ใช้เส้นเคลียร์คดีหุ้น', fine); if(chance(.7)) note(p,'เรื่องเงียบหายไปอย่างไร้ร่องรอย'); else { fx(p,{m:-fine,C:-10}); note(p,'เส้นที่ใช้ไม่พอ ต้องจ่ายค่าปรับเต็ม'); } }
}
async function investChoice(p, io, retire = false){
  if(p.status.prison) return;
  const cur = p.invest || 'bank';
  const opts = Object.entries(INVEST).map(([k, v]) => ({ label: v.name + (k === cur ? ' (ตอนนี้)' : ''), sub: v.sub, k,
    cond: k !== 'insider' || p.C >= 60, condText:'ต้องมีเส้นสาย C 60 ขึ้นไปถึงจะได้ข้อมูลวงใน' }));
  const c = await choose(p, io, { kind:'minor', bg:'bank', title: retire ? 'เงินเกษียณจะเก็บไว้ที่ไหน' : 'เงินเก็บของคุณจะเก็บไว้ที่ไหน',
    text:`เงินเก็บตอนนี้ ฿${baht(Math.max(0, p.money))}${p.invRet ? ` · กำไรขาดทุนสะสม ฿${baht(p.invRet)}` : ''}`, choices: opts });
  p.invest = c.k;
  if(c.k === 'insider' && !p.flags.insiderTagged){ p.flags.insiderTagged = true; fx(p,{K:-10}); tagBad(p,'corrupt','ซื้อขายหุ้นด้วยข้อมูลวงใน', 0); }
  log(p, `เก็บเงินแบบ${INVEST[c.k].short}`);
}
function investBeats(p, io, beats){
  [25, 40].forEach(age => beats.push({ age, run: () => investChoice(p, io) }));
  beats.push({ age: 58, run: () => investChoice(p, io, true) });
}

function thaiBeats(stage, p, io, beats){
  if(stage === 1){ pickThai(p, THAI_KID, 2).forEach((e, i) => beats.push({ age: [8, 13][i], run: () => e.run(p, io) })); }
  if(stage === 2){ pickThai(p, THAI_YOUNG, 1).forEach(e => beats.push({ age: 19, run: () => e.run(p, io) })); }
  if(stage === 3){
    const evs = pickThai(p, THAI_ADULT, 3); const ages = distinctAges(evs.length, 26, 57);
    evs.forEach((e, i) => beats.push({ age: ages[i], run: () => { if(p.status.prison) return; return e.run(p, io); } }));
    beats.push({ age: 55, run: async () => { const k = pickThai(p, THAI_KIDS, 1)[0]; if(k && !p.status.prison) await k.run(p, io); } });
  }
  if(stage === 6){ pickThai(p, THAI_OLD, 1).forEach(e => beats.push({ age: randi(66, 74), run: () => e.run(p, io) })); }
}
