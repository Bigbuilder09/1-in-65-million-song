<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Silkscreen&display=swap">
<style>
/* layout: จอเกมพิกเซลซ้าย + แผงตัดสินใจขวา (PC) / ซ้อนบนล่าง (มือถือ) · โลกเดียว: กลางคืนแบบตู้เกม ทองวัดไทยเป็นสีเน้น */
:root{
  --bg:#0b1026; --bg2:#121a3a; --panel:#151f45; --line:#2b3a72; --ink:#f3ecd9; --dim:#a9b0cf; --faint:#6e78a3;
  --gold:#e8b04a; --gold2:#ffd77a; --teal:#3fd1c4; --good:#38e07b; --bad:#ff4d6d; --karma:#b58cff; --warn:#ffcf4d;
  --f-disp:"Chakra Petch", "IBM Plex Sans Thai", system-ui, sans-serif; --f-body:"IBM Plex Sans Thai", "Chakra Petch", system-ui, sans-serif; --f-px:"Silkscreen", "Chakra Petch", monospace;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0;
  background-image:radial-gradient(circle at 20% -10%, #1d2b5a 0, transparent 50%), radial-gradient(circle at 110% 120%, #2a1840 0, transparent 45%);}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{max-width:1180px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:12px;min-height:100%}
/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--bg2);border:2px solid var(--line);padding:8px 12px;box-shadow:0 4px 0 #050817}
.who{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 220px}
.who b{font-family:var(--f-disp);font-size:18px;letter-spacing:.02em;white-space:nowrap}
.who .age{font-family:var(--f-px);font-size:12px;color:var(--gold2);white-space:nowrap}
.who .where{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.stat{display:flex;align-items:center;gap:5px;font-family:var(--f-px);font-size:12px;font-variant-numeric:tabular-nums;transition:transform .2s}
.stat img{width:14px;height:14px;image-rendering:pixelated}
.stat .bar{width:42px;height:6px;background:#0a0f24;border:1px solid var(--line);position:relative}
.stat .bar i{position:absolute;inset:0 auto 0 0;background:currentColor}
.stat.flash{transform:scale(1.15)}
.stat.H{color:#ff6b81}.stat.J{color:var(--warn)}.stat.S{color:#6cc6ff}.stat.C{color:var(--teal)}.stat.M{color:var(--gold2)}.stat.D{color:var(--bad)}
.stat .v{color:var(--ink);min-width:2ch}
/* main */
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:880px){ .main{grid-template-columns:minmax(0,1fr)} }
.screen{position:relative;border:3px solid #050817;outline:2px solid var(--line);background:#000;box-shadow:0 6px 0 #050817}
.screen canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%}
.scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(0,0,0,.045) 0 1px, transparent 1px 3px);mix-blend-mode:multiply}
.chips{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.chip{font-family:var(--f-px);font-size:12px;padding:2px 6px;background:rgba(5,8,23,.85);border:1px solid var(--line);animation:rise 2.2s ease-out forwards}
.chip.up{color:var(--good)}.chip.down{color:var(--bad)}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.timeline{margin-top:10px;position:relative;height:22px}
.timeline .track{position:absolute;left:0;right:0;top:9px;height:4px;background:#0a0f24;border:1px solid var(--line)}
.timeline .fill{position:absolute;left:0;top:9px;height:4px;background:var(--gold)}
.timeline .now{position:absolute;top:3px;width:10px;height:16px;margin-left:-5px;background:var(--gold2);box-shadow:0 0 0 2px #050817}
.timeline .tick{position:absolute;top:0;font-family:var(--f-px);font-size:9px;color:var(--faint);transform:translateX(-50%)}
.timeline .ev{position:absolute;top:8px;width:4px;height:6px;margin-left:-2px;background:var(--teal);opacity:.8}
.under{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.linkbtn{background:none;border:1px solid var(--line);color:var(--dim);padding:4px 10px;font-size:12.5px;cursor:pointer}
.ubtns{display:flex;gap:6px}
.linkbtn.snd b{color:var(--gold);font-weight:700}
.linkbtn.snd.off b{color:var(--faint);text-decoration:line-through}
.linkbtn.snd.off{color:var(--faint)}
.linkbtn:hover{color:var(--ink);border-color:var(--gold)}
.simnote{font-size:12px;color:var(--faint)}
/* panel */
.panel{background:var(--panel);border:2px solid var(--line);box-shadow:0 6px 0 #050817;padding:16px 16px 18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-px);font-size:11px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow span{color:var(--faint)}
.panel h2{font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
.panel .txt{white-space:pre-line;color:var(--dim);margin:0;max-width:62ch}
.head{border-left:4px solid var(--warn);background:rgba(255,207,77,.07);padding:8px 10px}
.head b{font-family:var(--f-disp);display:block;color:var(--warn)}
.head p{margin:2px 0 0;color:var(--dim);white-space:pre-line}
.arch{border:2px solid var(--teal);background:rgba(63,209,196,.08);padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.arch b{font-family:var(--f-disp);font-size:20px;color:var(--teal)}
.arch span{color:var(--dim);font-size:14px}
.arch.rare{border-color:var(--gold2);background:rgba(255,215,122,.1)}
.arch.rare b{color:var(--gold2)}
.story{margin:0;padding:8px 12px;border-left:3px solid var(--gold);background:rgba(232,176,74,.07);color:var(--ink);font-size:15px;line-height:1.65}
.story + .pend{margin-top:-4px}
.pend{display:flex;flex-direction:column;gap:4px;border:1px dashed var(--line);padding:8px 10px;background:rgba(0,0,0,.18)}
.pend div{font-size:13.5px;color:var(--ink)}
.pend div::before{content:"▸ ";color:var(--gold)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;background:#1b2757;border:2px solid #31438a;padding:9px 11px;cursor:pointer;box-shadow:0 3px 0 #0a0f24;transition:transform .08s, border-color .12s}
.ch:hover:not(:disabled),.ch:focus-visible{border-color:var(--gold);outline:none;transform:translateY(-1px)}
.ch:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0a0f24}
.ch .k{font-family:var(--f-px);font-size:11px;color:var(--faint);grid-row:1/3}
.ch .l{font-family:var(--f-disp);font-weight:600;font-size:15.5px;min-width:0}
.ch .s{grid-column:2;font-size:12.5px;color:var(--dim);min-width:0}
.ch .price{grid-row:1/3;grid-column:3;font-family:var(--f-px);font-size:11.5px;color:var(--gold2);text-align:right;white-space:nowrap}
.ch .price small{display:block;font-family:var(--f-body);font-size:10px;color:var(--faint);letter-spacing:0}
.ch .loan{grid-column:2;font-size:12px;color:var(--warn)}
.ch:disabled{opacity:.5;cursor:not-allowed;filter:saturate(.4)}
.ch .lock{grid-column:2;font-size:12px;color:var(--bad)}
.ch.on{border-color:var(--teal);background:#183a52}
.ch .box{grid-row:1/3;width:14px;height:14px;border:2px solid var(--faint)}
.ch.on .box{background:var(--teal);border-color:var(--teal)}
.go{align-self:flex-start;font-family:var(--f-disp);font-weight:700;font-size:16px;background:var(--gold);color:#1a1205;border:0;padding:10px 22px;cursor:pointer;box-shadow:0 4px 0 #8a5d12}
.go:hover,.go:focus-visible{background:var(--gold2);outline:none}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5d12}
.go.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* timeskip chart */
.chart{display:flex;align-items:center;gap:2px;height:96px;border-bottom:1px solid var(--line);border-top:1px solid var(--line);position:relative;overflow:hidden}
.chart .b{flex:1 1 0;min-width:2px;max-width:22px;position:relative;height:100%}
.chart .b i{position:absolute;left:0;right:0;background:var(--good)}
.chart .b.neg i{background:var(--bad)}
.chart .b.rec i{background:#8b93b8}
.chart .zero{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--faint)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.omen{color:var(--karma);font-style:italic}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13.5px}
.kv dt{color:var(--faint)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
/* title */
.title-art{font-family:var(--f-disp);font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1;margin:4px 0 0;color:var(--gold2);text-shadow:3px 3px 0 #7a3a22, 6px 6px 0 #050817;letter-spacing:.01em}
.title-art small{display:block;font-family:var(--f-px);font-size:12px;color:var(--teal);text-shadow:none;letter-spacing:.12em;margin-top:10px}
/* karma */
.ledger{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;padding-right:4px}
.led{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 8px;padding:6px 8px;border-left:4px solid var(--karma);background:rgba(181,140,255,.08);animation:pop .4s both}
.led.good{border-color:var(--gold);background:rgba(232,176,74,.08)}
.led .a{font-family:var(--f-px);font-size:10px;color:var(--faint)}
.led .t{font-size:13.5px}
.led .st{font-family:var(--f-px);font-size:10px;text-align:right}
.led .st.y{color:var(--warn)} .led .st.n{color:var(--faint)}
.led .e{grid-column:2/4;font-size:12.5px;color:var(--dim)}
@keyframes pop{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.bigK{font-family:var(--f-px);font-size:26px}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .n{font-family:var(--f-disp);font-weight:700;font-size:44px;color:var(--gold2);line-height:1}
.score .p{font-family:var(--f-disp);font-size:18px}
.parts{display:flex;flex-direction:column;gap:5px}
.part{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px}
.part .bar{height:8px;background:#0a0f24;border:1px solid var(--line);position:relative}
.part .bar i{position:absolute;inset:0 auto 0 0;background:var(--teal)}
.part span:last-child{font-family:var(--f-px);font-size:11px;text-align:right}
.card{max-width:100%;width:300px;image-rendering:pixelated;border:2px solid var(--line);display:block}
.cardwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.cardwrap > div{min-width:0;flex:1 1 200px}
/* drawer */
.drawer{position:fixed;inset:0;background:rgba(5,8,23,.7);display:flex;justify-content:flex-end;z-index:20}
.drawer .in{width:min(420px,100%);height:100%;background:var(--bg2);border-left:2px solid var(--line);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-right:max(16px, env(safe-area-inset-right,0px));overflow:auto}
.drawer h3{font-family:var(--f-disp);margin:0 0 8px}
.drawer ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.drawer li{display:grid;grid-template-columns:44px 1fr;font-size:13.5px}
.drawer li b{font-family:var(--f-px);font-size:11px;color:var(--gold)}
.tree{display:flex;flex-direction:column;gap:8px}
.gen{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 10px;border:2px solid var(--line);background:#121a3a}
.gen .g{font-family:var(--f-px);font-size:11px;color:var(--gold)}
.gen .d{font-size:12.5px;color:var(--dim)}
.gen .sc{font-family:var(--f-disp);font-weight:700;font-size:18px;color:var(--gold2)}
.help{font-size:12px;color:var(--faint)}
/* สัญลักษณ์แทนตัวอักษร */
.ic{width:13px;height:13px;image-rendering:pixelated;vertical-align:-2px;margin:0 2px 0 0}
.ic.big{width:18px;height:18px;vertical-align:-4px}
.ic.huge{width:34px;height:34px}
.fx{white-space:nowrap;font-family:var(--f-px);font-size:11.5px;margin-right:4px}
.fx.up{color:var(--good)} .fx.dn{color:var(--bad)}
.chip{display:flex;align-items:center;gap:2px}
.chip .arw{font-size:9px;margin-left:3px}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lines li{color:var(--dim);padding-left:16px;position:relative}
.lines li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;background:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tile{background:#101836;border:2px solid var(--line);padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;min-width:0}
.tile .ic{grid-row:1/4}
.tile .lab{font-size:11.5px;color:var(--faint)}
.tile b{font-family:var(--f-disp);font-size:17px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.tile b.neg{color:var(--bad)} .tile b.pos{color:var(--good)}
.tile .note{font-size:11.5px;color:var(--gold2);grid-column:2}
.tile .meter{grid-column:1/3;height:4px;background:#0a0f24;margin-top:5px;position:relative}
.tile .meter i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;padding:10px 6px 4px;border:2px solid var(--line);background:#0e1532}
.rung{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;opacity:.55}
.rung.me{opacity:1}
.rung .pc{font-family:var(--f-px);font-size:10px;color:var(--dim)}
.rung .col{width:100%;max-width:34px;height:70px;position:relative;background:#0a0f24}
.rung .col i{position:absolute;left:0;right:0;bottom:0;background:#4b5a99}
.rung.me .col i{background:var(--gold);box-shadow:0 0 0 2px var(--gold2)}
.rung .cn{display:flex;flex-wrap:wrap;justify-content:center;max-width:42px;min-height:13px}
.rung .cn .ic{width:9px;height:9px;margin:0}
.rung .nm{font-size:10.5px;color:var(--faint);text-align:center;line-height:1.2}
.rung.me .nm{color:var(--gold2);font-weight:600}
.rung .you{position:absolute;top:-12px;font-family:var(--f-px);font-size:9px;background:var(--gold);color:#1a1205;padding:0 4px}
.money{display:flex;align-items:center;gap:12px;padding:8px 12px;border:2px solid #6b4f16;background:linear-gradient(90deg,#2a2210,#151f45)}
.money b{font-family:var(--f-disp);font-size:26px;color:var(--gold2);display:block;line-height:1.1}
.money span{font-size:12px;color:var(--dim)}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sb{display:flex;align-items:center;gap:5px;min-width:0}
.sb .bar{flex:1;height:6px;background:#0a0f24;border:1px solid var(--line);position:relative;min-width:20px}
.sb .bar i{position:absolute;inset:0 auto 0 0;background:var(--teal)}
.sb b{font-family:var(--f-px);font-size:11px}
.outcome{align-self:flex-start;font-family:var(--f-disp);font-weight:700;font-size:20px;padding:4px 14px;border:2px solid;display:flex;gap:8px;align-items:center}
.outcome.good{color:var(--good);background:rgba(56,224,123,.1)} .outcome.mid{color:var(--warn);background:rgba(255,207,77,.08)} .outcome.bad{color:var(--bad);background:rgba(255,77,109,.1)}
.legendgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 12px}
.legendgrid div{display:grid;grid-template-columns:auto 1fr;gap:0 6px;align-items:center}
.legendgrid .ic{grid-row:1/3}
.legendgrid b{font-family:var(--f-disp);font-size:14px}
.legendgrid span{font-size:11.5px;color:var(--faint)}
/* ---------- มือถือแนวตั้ง: HUD + จอเกมติดด้านบน แผงเลือกเลื่อนอยู่ข้างล่าง ---------- */
@media (max-width:640px){
  body{font-size:14.5px}
  #app{padding-block:0 18px;padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));gap:8px}
  .hud{padding:5px 8px;gap:2px 8px;box-shadow:none;border-width:0 0 2px;margin-inline:-8px;padding-top:max(5px, env(safe-area-inset-top, 0px))}
  .who{flex:1 1 100%;gap:8px}
  .who b{font-size:15px}
  .who .where{font-size:11.5px}
  .stats{gap:2px 9px;flex-wrap:nowrap;width:100%;justify-content:space-between}
  .stat{font-size:11px;gap:3px}
  .stat img{width:12px;height:12px}
  .stat .bar{width:22px;height:5px}
  .main{gap:10px}
  .main > section:first-child{background:var(--bg);padding-bottom:4px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center}
  .main > section:first-child .screen{grid-column:1 / -1}
  .timeline{margin-right:14px}
  .under{margin-top:6px!important}
  #sndTxt{display:none}
  .screen{box-shadow:none;border-width:2px}
  .timeline{margin-top:6px;height:16px}
  .under{margin-top:2px}
  .simnote{display:none}
  .under{justify-content:flex-end}
  .linkbtn{padding:2px 8px;font-size:12px}
  .panel{padding:12px 12px 14px;box-shadow:none;scroll-margin-top:calc(var(--stickH, 0px) + 6px)}
  .panel h2{font-size:19px;line-height:1.35}
  .ch{padding:9px 11px}
}
@media (max-width:640px) and (min-height:600px){
  .hud{position:sticky;top:0;z-index:20}
  .main > section:first-child{position:sticky;top:var(--hudH, 0px);z-index:10}
}
@media (hover:none) and (pointer:coarse){ .kbd{display:none} }
@media (prefers-reduced-motion: reduce){ .chip,.led{animation:none} .ch,.stat{transition:none} }

.tile,.gen{background:#121c34;border:1px solid #354d70;padding:10px}
.money{background:#252838;border:1px solid #957442}
.drawer .in{background:#121c34;border-color:#b8924f}
.ledger{gap:9px}.led{padding:9px 10px}.help{line-height:1.7}

let RNG = Math.random;
const rnd = () => RNG();
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const chance = pr => rnd() < pr;
const randi = (a,b) => a + Math.floor(rnd()*(b-a+1));

function wpick(items, wf){ const ws = items.map(it => Math.max(0, wf(it))); const tot = ws.reduce((s,w)=>s+w,0); if(tot<=0) return items[0]; let r = rnd()*tot; for(let i=0;i<items.length;i++){ r -= ws[i]; if(r<=0) return items[i]; } return items[items.length-1]; }
function gauss(){ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
const baht = n => (n<0?'−':'') + Math.round(Math.abs(n)).toLocaleString('en-US');
const bahtS = n => { const a=Math.abs(n); const s = n<0?'−':''; if(a>=1e6) return s+(a/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+' ล้าน'; if(a>=1e3) return s+Math.round(a/1e3)+'k'; return s+Math.round(a); };

function newPlayer(o = {}){

  const sex = o.sex || (chance(.487) ? 'M' : 'F');
  let qi = o.q !== undefined ? o.q : 0; if(o.q === undefined){ const r = rnd()*tier.q.reduce((s,v)=>s+v,0); let acc=0; qi=0; for(let i=0;i<6;i++){ acc+=tier.q[i]; if(r<=acc){ qi=i; break; } } }
  const religion = o.religion || (tier.id===6 ? (chance(.8)?'อิสลาม':'พุทธ') : (chance(tier.id===4?.06:.02)?'อิสลาม':'พุทธ'));

const STATNAME = { H:'สุขภาพ', J:'ความสุข', S:'ทักษะ', C:'เส้นสาย' };
function fx(p, d){
  const shown = [];
  for(const k of ['H','J','S','C']){ if(d[k]){ const before = p[k]; p[k] = clamp(p[k] + (k === 'H' ? d[k] : dimin(p[k], d[k])), 0, 100); const real = p[k]-before; if(real) shown.push([k, real]); } }
  if(d.K){ p.K = clamp(p.K + d.K, -100, 100); }
  if(d.m){ addMoney(p, d.m); shown.push(['฿', d.m]); }
  if(p.io && shown.length) p.io.chips(shown);
  return shown;
}
function fxText(d, hideK = true){
  const out = [];
  for(const k of ['H','J','S','C']) if(d[k]) out.push(k + (d[k]>0?'+':'−') + Math.abs(d[k]));
  if(d.K && !hideK) out.push('K' + (d.K>0?'+':'−') + Math.abs(d.K));
  if(d.m) out.push('฿' + (d.m>0?'+':'−') + baht(Math.abs(d.m)));
  return out.join(' ');
}
function totalDebt(p){ return p.debt.f + p.debt.k + p.debt.i; }
function formalLimit(p){ if(p.flags.bkRecord && p.age < p.flags.bkRecord) return 0; return p.q <= 1 ? 200000 : 50000000; }
const bkRec = p => (p.flags.bkRecord && p.age < p.flags.bkRecord) ? .15 : 1;
function addMoney(p, amt){
  p.money += amt;
  if(p.money < 0){
    const short = -p.money; p.money = 0;
    const room = Math.max(0, formalLimit(p) - p.debt.f);
    const f = Math.min(room, short); p.debt.f += f; p.debt.i += short - f;
  }
}
function canLoan(p, cost){ return p.debt.f + Math.max(0, cost - p.money) <= formalLimit(p); }
function hhIncome(p){ // รายได้ครัวเรือนต่อเดือน
  if(p.age < 22 && !p.career) return QS[p.q].inc;
  let m = p.career ? curIncome(p) : 0;
  if(p.spouse && !p.spouse.separated) m += p.spouse.income;
  if(p.age >= 60) m = p.retireIncome + (p.spouse && !p.spouse.separated ? p.spouse.income*0.3 : 0);
  return Math.max(m, 1);
}
function monthsOf(p, cost){ return Math.round(cost / Math.max(hhIncome(p), 1)); }
// เงินท้องถิ่น: ค่าแรงต่างตามพื้นที่ · กิจการครอบครัวต่างตามฐานะ
const LOC_F = [0, 1.35, 1.15, 1.0, .9, .8, .8];
const FAM_F = [.5, .75, 1, 1.4, 2.2, 6];
function lm(p, base, kind = 'work'){ const f = LOC_F[p.tier] * (kind === 'fam' ? FAM_F[p.qBirth] : 1); return Math.max(500, Math.round(base * f / 500) * 500); }
function note(p, text, d){ p.pend.push({ text, d }); log(p, text); }
function log(p, text){ p.log.push({ age: p.age, text }); }
function tagBad(p, type, label, amount = 0){ p.tagsBad.push({ type, label, amount, age: p.age }); }

function stOn(p, s){ p.status[s] = true; } function stOff(p, s){ delete p.status[s]; }

function M(p){ return 0.3*(p.S-50) + 0.2*(p.C-50) + 0.05*p.K; }
function roll3(p, [g, m, b], adj = {}){
  const mm = M(p);
  let G = clamp(g + mm + (adj.g||0), 5, 85), B = clamp(b - 0.5*mm + (adj.b||0), 5, 85);
  let Mi = clamp(100 - G - B, 5, 85); const s = G + B + Mi; const r = rnd()*s;
  return r < G ? 'good' : r < G + Mi ? 'mid' : 'bad';
}

// ===== ตัวช่วยการตัดสินใจ =====
// choice: { label, sub, cost, cond, condText, loan('bank'|'kys'|false), run }
function prepChoices(p, list){
  return list.map(c => {
    const cost = c.cost || 0; const r = { ...c, cost, disabled: false, lock: null, loanNote: null };
    if(c.cond === false){ r.disabled = true; r.lock = c.condText || 'ไม่ผ่านเงื่อนไข'; return r; }
    if(cost > p.money){
      const short = cost - p.money;
      if(c.loan === 'kys'){ r.loanNote = `กู้ กยศ. ${baht(short)} (1%/ปี)`; }
      else if(c.loan !== false && canLoan(p, cost)){ r.loanNote = `กู้ ${baht(short)} (7%/ปี)`; }
      else { r.disabled = true; r.lock = `= ${monthsOf(p,cost).toLocaleString()} เดือนของรายได้บ้านคุณ`; }
    }
    return r;
  });
}
function spend(p, cost, kind){
  if(cost <= 0) return;
  if(cost > p.money && kind === 'kys'){ const short = cost - p.money; p.debt.k += short; p.money += short; }
  addMoney(p, -cost);
}
async function choose(p, io, opt){
  const choices = prepChoices(p, opt.choices);
  if(!choices.some(c => !c.disabled)) choices[choices.length-1].disabled = false; // กันเกมค้าง
  const head = p.evHead; p.evHead = null;
  const idx = await io.ask({ ...opt, choices, pend: p.pend.splice(0), head });
  const c = choices[idx];
  const at = p.pend.length;
  if(!c.defer) spend(p, c.cost, c.loan);
  if(c.run) await c.run();
  if(!opt.noStory){ const s = storyFor(p, opt, c); if(s) p.pend.splice(Math.min(at, p.pend.length), 0, { text: s, story: true }); }
  return c;
}
async function yesno(p, io, opt){ // opt: {title, text, cost, sub, yes, no, cond, condText, loan}
  const c = await choose(p, io, { ...opt, kind: opt.kind || 'minor', choices: [
    { label: opt.yes || 'ทำ', sub: opt.sub, cost: opt.cost || 0, cond: opt.cond, condText: opt.condText, loan: opt.loan === undefined ? false : opt.loan, yes: true },
    { label: opt.no || 'ไม่ทำ', sub: opt.noSub || '', cost: 0, yes: false },
  ]});
  return c.yes;
}
async function say(p, io, opt){ await io.say({ ...opt, pend: p.pend.splice(0) }); }

// ===== กระโดดเวลา =====
function curIncome(p){ // รายได้ส่วนตัวต่อเดือนก่อนตัวคูณ
  if(!p.career || p.unemployed > 0) return 0;
  if(p.career === 'pol') return polPay(p) * (1 - p.incomeCut);
  const C = CAREERS[p.career];
  const cap = p.cOut ? C.caps[p.cOut] : C.caps.mid;
  let base = C.start * Math.pow(1 + C.grow, p.cYears);
  if(p.career === 'biz' && p.cOut === 'mid') base = 60000;
  if(p.career === 'influ' && p.cOut === 'mid') base = 35000;
  return Math.min(base, cap) * p.incomeBoost * (p.eduBoost || 1) * (1 - p.incomeCut);
}
// ทักษะและเส้นสายช่วยให้รายได้นิ่ง: C,S 80 → ผันผวนราว 0.6 เท่า · C,S 20 → ราว 1.4 เท่า
function volF(p){ return clamp(1 - .006*(p.C - 50) - .006*(p.S - 50), .35, 1.5); }
function skillMult(p){ return clamp(1 + 0.01*(p.S - 50), 0.7, 1.4); }
function saveRate(p){
  let s = p.age >= 22 ? .15 : QS[p.q].save;
  if(!p.spouse || p.spouse.separated) s += .05;
  s -= .05 * p.kids.filter(k => !k.left).length;
  if(p.house && p.house.years < (p.house.term || 25)) s -= (p.house.saveCut ?? .10);
  if(p.flags.noKids) s += .10;
  if(p.flags.spousePays) s += .15;
  s += [ .10, 0, -.15 ][p.lifestyle];
  return clamp(s, -.3, .6);
}
async function years(p, io, n, opts = {}){
  const bars = []; const startAge = p.age; const notes = [];
  for(let y = 0; y < n; y++){
    p.age++;
    // สุขภาพตามวัย
    if(p.age > 70) p.H -= 2; else if(p.age > 50) p.H -= 1; else if(p.age > 40 && p.age % 2) p.H -= 1;
    if(p.status.chronic){ p.H -= 1; addMoney(p, -6000); }
    const newDz = habitYear(p);
    crimeYear(p, notes);
    statYear(p, notes); worldYear(p, notes); polYear(p, notes);
    // ความเครียดจากหนี้และเงินขาดมือ
    if(p.age >= 22){ const td = totalDebt(p), inc = Math.max(1, hhIncome(p)); if(td > inc * 36) p.J -= 3; else if(td > inc * 12) p.J -= 1.5; if(p.money < 5000 && p.age < 60 && !td) p.J -= .5; if(td > inc * 36 && p.age > 40) p.H -= .5; }
    if(p.status.bullied && p.age <= 18) p.J -= 3;
    if(p.status.depressed){ p.J -= 3; }
    if(p.status.dementia){ p.J -= 3; }
    if(p.status.grief){ p.J -= 2; p.status.grief--; if(p.status.grief <= 0) delete p.status.grief; }
    if(p.status.druggedKid){ p.J -= 5; addMoney(p, -30000); }
    if(p.status.prison > 0){ p.status.prison--; if(p.status.prison <= 0) stOff(p,'prison'); }
    p.H = clamp(p.H, 0, 100); p.J = clamp(p.J, 0, 100);
    let income = 0, net = 0, rec = false;
    if(p.age <= 18){ // วัยเรียน เงินครอบครัว
      if(p.q === 0) net += 4000;
      if(p.school === 'rural') net -= 2500;
      addMoney(p, net);
    } else if(p.age <= 22 && !p.career){
      net = p.flags.uniIncome || 0; addMoney(p, net);
    } else if(p.age < 60){
      rec = chance(.10);
      if(p.status.prison) { income = 0; }
      else if(p.career){
        const C = CAREERS[p.career];
        const vf = volF(p);
        let m = curIncome(p) * skillMult(p) * Math.max(0, 1 + C.sig*vf*gauss()) * (rec ? 1 - .3*C.sens*vf : 1) * statWorkF(p) * worldIncomeF(p);
        if(p.career === 'farm' && chance(.12*vf)){ m *= .3; if(!opts.quiet) notes.push(pickOne(['ปีนี้ฝนทิ้งช่วง ผลผลิตเสียหายเกือบทั้งหมด','น้ำท่วมสวนจนต้นไม้ยืนตาย','ราคาพืชผลดิ่งจนขายไม่คุ้มค่าเก็บเกี่ยว'])); }
        if((p.career === 'biz' || p.career === 'influ') && p.cOut === 'good' && chance(.04*vf)){ p.cOut = 'mid'; if(!opts.quiet) notes.push(p.career === 'biz' ? 'คู่แข่งรายใหญ่เข้ามาตัดราคา กิจการหดเหลือขนาดกลาง' : 'กระแสเปลี่ยน แพลตฟอร์มเปลี่ยนอัลกอริทึม ยอดวิวหายไปครึ่งหนึ่ง'); }
        else if((p.career === 'biz' || p.career === 'influ') && p.cOut === 'mid' && p.cYears > 5 && chance(.025*vf)) p._bizCrash = true;
        if((p.career === 'biz' || p.career === 'influ') && p.cOut !== 'bad' && chance(.10*vf)){ m = -curIncome(p) * .5; if(!opts.quiet) notes.push(p.career === 'biz' ? 'ปีนี้ธุรกิจขาดทุน ต้องควักเงินเก็บมาหมุน' : 'ปีนี้โดนแบนช่องและสปอนเซอร์ถอนตัว'); }
        if(p.career === 'farm' && p.cOut === 'bad' && chance(1/3)) m = -0.2*C.start;
        if(p.career === 'farm' && p.flags.rentLand) m *= .8;
        income = m * 12;
        if(p.unemployed > 0){ p.unemployed--; income = 0; }
        p.cYears++;
        if(income > 0) p.lastSalary = income/12;
      }
      const spouse = (p.spouse && !p.spouse.separated) ? p.spouse.income * 12 * (rec ? .9 : 1) : 0;
      if(p.spouse && !p.spouse.separated) p.spouse.income *= 1.02;
      const hh = income + spouse;
      net = hh - Math.max(hh * (1 - saveRate(p)), livingFloor(p)) * worldCostF(p);
      if(hh > 0 && hh/12 < 10000) net += 4000; // บัตรสวัสดิการแห่งรัฐ
    } else { // เกษียณ
      const costM = 9000 * (p.flags.homeTown ? .8 : 1) + (p.flags.residenceCost || 0);
      const inc = p.retireIncome + (p.flags.shopIncome || 0) + p.kidMoney;
      income = inc * 12; net = (inc - costM * worldCostF(p)) * 12;
    }
    // ค่าใช้จ่ายประจำ
    for(const a of p.annual){ if(p.age > a.from && p.age <= a.to) net -= a.amt; }
    if(p.age >= 18) net += worldCashYear(p);
    if(p.lottery && p.age < 60) net -= 1920;
    if(p.age > 18){
      // ดอกเบี้ย
      // ระหว่างล้มละลาย หนี้อยู่ในมือเจ้าพนักงานพิทักษ์ทรัพย์ ดอกเบี้ยหยุดเดิน
      const bk = !!p.status.bankrupt;
      const interest = bk ? 0 : p.debt.f*.07*(p.flags.restructured?3/7:1) + p.debt.k*.01 + p.debt.i*.20;
      if(!bk){ p.debt.f *= 1 + (p.flags.restructured ? .03 : .07); p.debt.k *= 1.01; p.debt.i *= 1.20; }
      if(p.age >= 22) {
        if(p.age >= 60 && p.money + net < 0){ net = -p.money; p.J = clamp(p.J - 10, 0, 100); if(!p.flags.broke){ p.flags.broke = true; note(p, 'เงินเก็บหมดแล้ว ต้องอยู่ด้วยเบี้ยยังชีพ ความสุขลดลงทุกปีที่ขาด'); } }
        if(bk){ p.J = clamp(p.J - 4, 0, 100); p.H = clamp(p.H - 1, 0, 100); }
        if(bk && p.money + net < 0){ net = -p.money; p.J = clamp(p.J - 3, 0, 100); } // ล้มละลาย: กู้เพิ่มไม่ได้ ต้องอยู่อย่างประหยัด
        addMoney(p, net);
        investYear(p, notes);
        // ใช้หนี้ด้วยเงินที่มี (เก็บสำรองไว้ 6 เดือนของรายจ่าย)
        const reserve = Math.max(0, hhIncome(p) * 6 * (1 - saveRate(p)));
        let avail = Math.max(0, p.money - reserve);
        for(const k of ['i','f','k']){ const pay = Math.min(avail, p.debt[k]); p.debt[k] -= pay; p.money -= pay; avail -= pay; }
        // หนี้ล้นตัว
        if(!bk && p.age >= (p.flags.spiralCool || 0) && interest > Math.max(net,0) && totalDebt(p) > 50000){ p.flags.spiral = (p.flags.spiral||0) + 1; } else p.flags.spiral = 0;
      }
    }
    if(p.house) { p.house.years++; p.house.value *= 1.02; }
    if(p.status.bankrupt){ p.status.bankrupt--; if(p.status.bankrupt <= 0){ stOff(p,'bankrupt'); p.debt = { f:0, k:0, i:0 }; note(p,'ครบ 3 ปี ศาลปลดคุณจากการล้มละลาย หนี้เก่าถูกล้าง'); } }
    bars.push({ age: p.age, net, income, rec });
    // บัญชีกรรม: ลางร้าย
    if(p.K < -30 && chance(.15) && !opts.quiet) notes.push(pickOne(OMENS));
    if(p.H <= 0){ p.bars = bars; await showSkip(p, io, startAge, bars, notes, opts); throw new Death(healthDeathCause(p)); }
    if(newDz){ await showSkip(p, io, startAge, bars.splice(0), notes.splice(0), opts); await diseaseOnset(p, io, newDz); }
    if(p._bizCrash){ p._bizCrash = false; await showSkip(p, io, startAge, bars.splice(0), notes.splice(0), opts); p.cOut = 'bad'; if(p.career === 'biz'){ await say(p, io, { kind:'event', bg:'shop', title:'กิจการล้ม', text:'หนี้การค้าค้างจ่าย ลูกค้าหายไปพร้อมกัน ธนาคารเรียกคืนวงเงิน' }); await bizFail(p, io); } else await layoffFork(p, io, false, true); }
    if(p._crimeBust){ p._crimeBust = false; await showSkip(p, io, startAge, bars.splice(0), notes.splice(0), opts); await crimeBust(p, io); }
    if(p._secCase){ p._secCase = false; await showSkip(p, io, startAge, bars.splice(0), notes.splice(0), opts); await secCase(p, io); }
    if(p._world){ const ev = p._world; p._world = null; await showSkip(p, io, startAge, bars.splice(0), notes.splice(0), opts); await runEvent(p, io, ev); }
    if(p._elec){ p._elec = false; await showSkip(p, io, startAge, bars.splice(0), notes.splice(0), opts); await election(p, io); }
    if(p._polScandal){ p._polScandal = false; await showSkip(p, io, startAge, bars.splice(0), notes.splice(0), opts); await polScandal(p, io); }
    if(p.lifespan && p.age >= p.lifespan){ p.bars = bars; await showSkip(p, io, startAge, bars, notes, opts); throw new Death('จากไปอย่างสงบตามอายุขัย'); }
    // เหตุการณ์ตามกำหนด (พ่อแม่เสียชีวิต)
    if(p.parentDeath && !p.parentDeath.done && p.age >= p.parentDeath.age){
      await showSkip(p, io, startAge, bars.splice(0), notes.splice(0), opts);
      p.parentDeath.done = true; await parentDies(p, io);
    }
    if(p.flags.otherParentDieAt && p.age >= p.flags.otherParentDieAt){ const pd = p.parentDeath; p.flags.otherParentDieAt = null; p.flags.otherParentGone = true; fx(p,{J:-8}); note(p, `${pd.other === 'F' ? 'แม่' : 'พ่อ'}${pd.otherName ? ` (${pd.otherName})` : ''}จากไปอย่างสงบ ตามไปอยู่กับ${pd.name}`); }
    if(p.flags.spiral >= 2){ p.flags.spiral = 0; await showSkip(p, io, startAge, bars.splice(0), notes.splice(0), opts); await debtSpiral(p, io); }
  }
  // J ค่อย ๆ กลับเข้าหาค่าฐาน
  p.J = clamp(Math.round(p.J + (p.Jbase - p.J) * 0.3 * Math.min(1, n/5)), 0, 100);
  // ร่างกายวัยหนุ่มสาวฟื้นตัวได้บ้าง (ยกเว้นโรคเรื้อรัง)
  if(p.age < 55 && !p.status.chronic){ const base = TIERS[p.tier].H; if(p.H < base) p.H += (base - p.H) * 0.2 * Math.min(1, n/5); }
  p.H = Math.round(p.H);
  await showSkip(p, io, startAge, bars, notes, opts);
}
async function showSkip(p, io, startAge, bars, notes, opts){
  if(!bars.length) return;
  p.samples.J.push(p.J); p.samples.H.push(p.H);
  if(opts.silent || (bars.length < 3 && !notes.length)) { io.update(p); return; }
  await io.skip({ from: bars[0].age - 1, to: p.age, bars, notes, p, pend: p.pend.splice(0) });
}
async function runBeats(p, io, beats, endAge, opts = {}){
  beats.sort((a,b) => a.age - b.age);
  for(const b of beats){
    if(b.age > endAge) continue;
    if(b.age > p.age) await years(p, io, b.age - p.age, opts);
    await b.run();
  }
  if(endAge > p.age) await years(p, io, endAge - p.age, opts);
}

function drawEvents(p, pool, n = 2){
  const avail = pool.filter(e => e.w(p) !== null);
  const out = [];
  while(out.length < n && avail.length){
    const e = wpick(avail, x => Math.max(1, x.w(p)));
    out.push(e); avail.splice(avail.indexOf(e), 1);
  }
  return out;
}
function evBeat(p, io, e, age){ return { age, run: async () => { await runEvent(p, io, e); } }; }
async function runEvent(p, io, e){
  if(e.w && e.w(p) === null) return;
  p.evHead = { title: typeof e.title === 'function' ? e.title(p) : e.title, text: e.text ? e.text(p) : '', bg: typeof e.bg === 'function' ? e.bg(p) : e.bg };
  log(p, p.evHead.title);
  await e.run(p, io);
  if(p.evHead){ const h = p.evHead; p.evHead = null; await say(p, io, { kind:'event', bg:h.bg, title:h.title, text:h.text }); }
}

  const pool = S1_MINORS[p.school].slice(); const minors = []; while(minors.length < 3 && pool.length) minors.push(pool.splice(Math.floor(rnd()*pool.length), 1)[0]);
  const mAges = [9, 11, 14];
  minors.forEach((m, i) => beats.push({ age: mAges[i], run: async () => {
    const yes = await yesno(p, io, { title: m.title, sub: typeof m.sub === 'function' ? m.sub(p) : m.sub, cost: m.cost||0, cond: m.cond ? m.cond(p) : undefined, condText: m.condText });
    if(yes) m.run(p);
  }}));
  if(p.sex === 'M') beats.push({ age:15, run: async () => {
    if(await yesno(p, io, { title:'เรียน รด. (นักศึกษาวิชาทหาร) ไหม', sub:'H+3 · ไม่ต้องเกณฑ์ทหาร', cost:15000 })){ p.rd = true; fx(p,{H:3}); if(chance(.1)){ fx(p,{H:-5}); note(p,'บาดเจ็บเล็กน้อยระหว่างฝึก'); } }
  }});
  depthStage1(p, io, beats);
  const evs = drawEvents(p, S1_EVENTS, 2); const eAges = distinctAges(evs.length, 7, 17);
  evs.forEach((e, i) => beats.push(evBeat(p, io, e, eAges[i])));
  beats.push({ age: randi(9, 16), run: () => offerDeed(p, io) });
  beats.push({ age: 18, run: async () => {
    const F = SCHOOL_FX[p.school]; const o = roll3(p, F.odds); fx(p, F[o]);
    let t = { good:'เรียนได้ดีกว่าที่ใครคาด', mid:'เรียนจบตามปกติ', bad:'ช่วงมัธยมเป็นช่วงที่ยากลำบาก' }[o];
    if(p.school==='rural' && o==='bad' && chance(.1)){ p.dropout = true; t = 'คุณออกจากโรงเรียนกลางคันหลังจบ ม.3'; }
    if(p.status.bullied){ stOff(p,'bullied'); }
    await say(p, io, { kind:'result', bg:'school', title:`จบชีวิตวัยเรียน: ผลลัพธ์${OUT_TH[o]}`, text: t, outcome:o });
    log(p, `จบโรงเรียน ผล${OUT_TH[o]}`);
  }});
  await runBeats(p, io, beats, 18);
}

async function arrested(p, io, why, sev = 1){
  await say(p, io, { kind:'event', bg:'court', title:'ถูกจับ', text: why });
  const c = await choose(p, io, { kind:'fork', bg:'court', title:'จะสู้คดียังไง', choices:[

    { label:'รับสารภาพ', sub:`ติดคุก ${sev} ปี J−20 C−10`, k:'confess' },
    { label:'ใช้เส้นช่วย', sub:'ต้องมี C 60 ขึ้นไป · หลุด 70%', cost:100000, cond:p.C>=60, condText:'C ต้องถึง 60', k:'line' } ]});
  let jailed = 0;
  const jail = (y, d) => { jailed = y; p.flags.restricted = true; p.status.prison = y; p.unemployed = Math.max(p.unemployed, y); fx(p, d); p.Jbase = Math.max(0,p.Jbase-10); if(['gov','police'].includes(p.career)){ p.flags.noPension = true; p.career = 'factory'; p.cOut='mid'; p.cYears=0; } if(p.career==='office'){ p.career = 'factory'; p.cOut='mid'; p.cYears=0; note(p,'บริษัทเลิกจ้างเพราะมีคดีติดตัว'); } if(p.career==='pol'){ p.flags.polOut = true; note(p,'คุณหลุดจากตำแหน่งทางการเมือง'); } note(p, `ติดคุก ${y} ปี`); };
  if(c.k==='fight'){ if(chance(clamp(40+0.3*(p.C-50),5,95)/100)) note(p,'ศาลยกฟ้อง คุณกลับไปทำงานเดิมได้'); else jail(3*sev, {J:-30,C:-20}); }
  if(c.k==='confess'){ jail(sev, {J:-20,C:-10}); if(['gov','office'].includes(p.career)){ p.career='factory'; p.cOut='mid'; p.cYears=0; } }
  if(c.k==='line'){ fx(p,{K:-10}); tagBad(p,'corrupt','ใช้เส้นช่วยคดี',100000); if(chance(.7)) note(p,'คดีเงียบหายไป'); else jail(5*sev, {J:-30,C:-20}); }
  if(jailed){ log(p, `ติดคุก ${jailed} ปี`); await say(p, io, { kind:'event', bg:'prison', title:`ติดคุก ${jailed} ปี`, text:'ชุดสีฟ้า เลขประจำตัว และห้องขังรวมกับอีก 40 คน\nหลังพ้นโทษ งานราชการ บริษัท และงานต่างประเทศจะปิดประตูใส่คุณ' }); }
}

function careerChoices(p, exclude = []){
  const land = p.q >= 3 || p.tier === 4 || p.tier === 5;
  return Object.entries(CAREERS).map(([k, C]) => {
    let cond = !exclude.includes(k), condText = 'เพิ่งออกจากอาชีพนี้';
    if(k==='police' && !(p.degree==='cadet' && p.flags.policeQualified)){cond=false;condText='ต้องจบโรงเรียนนายร้อยตำรวจ';}
    if(k==='athlete' && !(p.flags.athleteQualified && p.H>=45)){cond=false;condText='ต้องจบเส้นทางกีฬา และมี H อย่างน้อย 45';}
    if(k==='coach' && !(p.degree==='sports' || p.flags.coachQualified)){cond=false;condText='ต้องจบสายกีฬา หรือผ่านหลักสูตรผู้ฝึกสอน';}
    if(C.needDegree && !p.degree){ cond = false; condText = 'ต้องจบปริญญา'; }
    if(C.maxAge && p.age > C.maxAge){ cond = false; condText = `อายุเกิน ${C.maxAge}`; }
    if(p.flags.restricted && ['gov','police','office','abroad','pol'].includes(k)){ cond = false; condText = 'มีประวัติติดคุก'; } if(p.flags.bkRecord && p.age < p.flags.bkRecord && ['gov','police','abroad'].includes(k)){ cond = false; condText = 'มีประวัติล้มละลาย'; }
    if(p.status.bankrupt && k==='abroad'){ cond = false; condText = 'ล้มละลาย ไปต่างประเทศไม่ได้'; }
    if(k==='crime' && cond && !crimeEntry(p)){ cond = false; condText = 'ไม่มีคนพาเข้าวงการ'; }
    if(k==='pol' && cond && !polEntry(p)){ cond = false; condText = 'ต้องมีเส้นสาย C 50 ขึ้นไป หรือมีคนหนุนหลัง'; }
    let cost = C.cost; if(k==='biz' && p.flags.bizFree) cost = 0;
    const inc = `฿${bahtS(C.start)}→${bahtS(C.caps.good)}/เดือน`;
    let sub = k==='pol' ? `฿${bahtS(25000)}→${bahtS(220000)}/เดือนตามตำแหน่ง · ต้องชนะเลือกตั้งทุก 4 ปี · ค่าสมัครและหาเสียง` : k==='crime' ? `${inc} · ทุกปีเสี่ยงติดคุกหรือถูกเก็บ · บาปสะสมทุกปี` : inc + (k==='gov' ? ` · สอบติด ${clamp(Math.round(20+0.5*(p.S-50)+0.3*(p.C-50)+(p.degree==='top'?10:0)),3,95)}%` : '') + (k==='farm' && !land ? ' · ต้องเช่าที่ (−20%)' : '');
    return { label:C.name, sub, cost, cond, condText, k };
  });
}
async function enterCareer(p, io, opts = {}){
  let exclude = opts.exclude || [];
  while(true){
    const c = await choose(p, io, { kind:'main', bg:'city', title: opts.title || 'เลือกอาชีพ', text: opts.text || 'อาชีพกำหนดรายได้ทั้งชีวิตและสิทธิหลังเกษียณ · ทักษะและเส้นสายช่วยให้รายได้นิ่งขึ้น', choices: careerChoices(p, exclude) });
    if(c.k === 'gov'){
      const pr = clamp(20+0.5*(p.S-50)+0.3*(p.C-50)+(p.degree==='top'?10:0)-(p.flags.juvenile?20:0), 3, 95)/100;
      if(!chance(pr)){ note(p, p.flags.juvenile ? 'สอบ ก.พ. ไม่ติด ประวัติสถานพินิจตอนเด็กทำให้ผ่านสัมภาษณ์ยาก' : 'สอบ ก.พ. ไม่ติด'); exclude = [...exclude, 'gov']; continue; }
    }
    p.career = c.k; p.cYears = 0; p.cOut = null; p.cStartAge = p.age; p.flags.outAt = p.age + 4; p.unemployed = 0; p.incomeBoost = 1; p.flags.cAdj = 0; p.flags.cBad = 0;
    const C = CAREERS[c.k]; fx(p, C.fx);
    const sd = seedFor(p, c.k); if(sd){ p.flags.cAdj = sd.adj; p.flags.seedWhy = sd.why; note(p, `${sd.why}ช่วยให้คุณเริ่มต้นได้ดีกว่าคนอื่น (โอกาสผลดี +${sd.adj}%)`); } else p.flags.seedWhy = null;
    if(c.k === 'farm' && !(p.q >= 3 || p.tier === 4 || p.tier === 5)) p.flags.rentLand = true;
    if(c.k === 'abroad') p.flags.abroadEnd = p.age + 5;
    if(p.flags.stayAbroad){
      if(['office','biz','influ'].includes(c.k)){ p.incomeBoost *= 2; p.flags.livesAbroad=true; note(p,'คุณจัดการสิทธิพำนักและสิทธิทำงานเรียบร้อย ก่อนเริ่มอาชีพในต่างแดน'); }
      else { p.flags.livesAbroad=c.k === 'abroad'; note(p,c.k === 'abroad' ? 'คุณเปลี่ยนไปทำงานต่างประเทศตามสัญญาจ้าง รายได้เป็นไปตามสายงานนี้' : 'อาชีพนี้เริ่มต้นในไทย คุณจึงย้ายกลับก่อนเริ่มงาน'); }
      p.flags.stayAbroad=false;
    }
    if(c.k === 'abroad') p.flags.livesAbroad=true;
    if(['police','athlete','coach'].includes(c.k)) p.flags.livesAbroad=false;
    if(c.k === 'biz' && opts.capital !== undefined && opts.capital < 500000) p.flags.cBad = (p.flags.cBad||0) + 10;
    log(p, `เริ่มอาชีพ${C.name}`);
    if(c.k === 'crime'){ p.flags.crimeRank = p.flags.crimeRank || 0; addHeat(p, 10); crimeBeats(p, io); }
    if(c.k === 'pol') await polStart(p, io);
    return c.k;
  }
}
async function careerOutcome(p, io){
  if(!p.career || p.cOut || p.age >= 60) return;
  const C = CAREERS[p.career];
  const o = roll3(p, C.odds, { g: p.flags.cAdj||0, b: p.flags.cBad||0 }); p.cOut = o;
  await say(p, io, { kind:'result', bg:C.bg, title:`${C.name}: ผลลัพธ์${OUT_TH[o]}`, text:C.outText[o] + (o==='good' && p.flags.seedWhy ? `\n${p.flags.seedWhy}ที่สะสมมาช่วยได้มาก` : ''), outcome:o });
  log(p, `${C.name} ผล${OUT_TH[o]}`);
  if(p.career==='farm' && o==='good') fx(p,{J:5});
  if(p.career==='factory' && o==='bad') p.unemployed = 2;
  if(p.career==='office' && o==='bad') p.flags.layoff45 = true;
  if(p.career==='biz' && o==='good' && p.flags.branch) p.incomeBoost *= 1.8;
  if(p.career==='biz' && o==='bad') await bizFail(p, io);
  if(p.career==='influ' && o==='good'){ fx(p,{C:30}); p.flags.polLink = true; }
  if(p.career==='influ' && o==='bad') await layoffFork(p, io, false, true);
  if(p.career==='crime' && o==='good') p.flags.crimeRank = Math.max(1, p.flags.crimeRank || 0);
  if(p.career==='crime' && o==='bad'){ p.cOut = 'mid'; await crimeBust(p, io); }
}
async function bizFail(p, io){
  const c = await choose(p, io, { kind:'fork', bg:'shop', title:'ธุรกิจเจ๊ง จะไปต่อยังไง', choices:[

async function layoffFork(p, io, comp = true, influ = false){
  p.unemployed = Math.max(p.unemployed, 1); fx(p,{J:-15});
  const sev = comp ? Math.round(curIncome(p) * (p.flags.union ? 10 : Math.min(13, 1 + p.cYears/3))) : 0;
  if(sev) { addMoney(p, sev); note(p, `ได้เงินชดเชย ฿${baht(sev)}`); }
  const land = p.q >= 2 || p.tier === 4 || p.tier === 5;
  const job = clamp(40+0.3*(p.S-50)+0.3*(p.C-50), 5, 95);
  const c = await choose(p, io, { kind:'fork', bg:'city', title: influ ? '3 ปีไม่มีคนดู ต้องเปลี่ยนทาง' : 'ตกงาน จะไปต่อยังไง', choices:[
    influ ? { label:'ลองช่องใหม่', sub:'สุ่มผลลัพธ์ใหม่ (โอกาสดี −3%)', cost:50000, k:'retry' } : { label:'หางานสายเดิม', sub:`ได้งาน ${Math.round(job)}% · รายได้ −10%`, k:'same' },
    { label:'เปลี่ยนอาชีพ', sub:'จ่ายต้นทุนเข้าอาชีพใหม่', k:'switch' },
    { label: sev ? 'เอาเงินชดเชยเปิดธุรกิจ' : 'เปิดธุรกิจเล็ก ๆ', sub:'กลายเป็นธุรกิจส่วนตัว', k:'biz' },
    { label:'กลับบ้านทำเกษตร', sub:'J+5', cond:land, condText:'ครอบครัวไม่มีที่ดิน', k:'farm' } ]});
  if(c.k==='retry'){ p.flags.cAdj=(p.flags.cAdj||0)-3; p.cOut=null; await careerOutcome(p, io); }
  if(c.k==='same'){ if(chance(job/100)){ p.incomeBoost *= .9; note(p,'ได้งานใหม่ในสายเดิม รายได้ลดลงเล็กน้อย'); } else { p.unemployed += 1; fx(p,{J:-10}); note(p,'หางานไม่ได้อีกหนึ่งปี'); await enterCareer(p, io, { title:'ต้องเลือกทางใหม่', exclude:[] }); } }
  if(c.k==='switch'){ await enterCareer(p, io, { title:'เปลี่ยนอาชีพ', exclude:[p.career] }); }
  if(c.k==='biz'){ p.career='biz'; p.cYears=0; p.cOut=null; p.flags.outAt = p.age + 4; if(sev < 500000) p.flags.cBad=(p.flags.cBad||0)+10; note(p,'เริ่มธุรกิจของตัวเอง'); }
  if(c.k==='farm'){ p.career='farm'; p.cYears=0; p.cOut=null; p.flags.outAt = p.age + 4; fx(p,{J:5}); note(p,'กลับบ้านไปทำเกษตร'); }
}

async function runBeatsWithLater(p, io, beats, endAge){
  while(true){

    if(p.flags.outAt){ const a = p.flags.outAt; p.flags.outAt = null; if(a < 60) beats.push({ age:a, run: () => careerOutcome(p, io) }); }
    if(p.flags.cutBack){ const a = p.flags.cutBack; p.flags.cutBack = null; beats.push({ age:a, run: async () => { p.incomeCut = Math.max(0, p.incomeCut - .2); } }); }
    beats.sort((a, b) => a.age - b.age);
    const b = beats.shift(); if(!b || b.age > endAge) break;

}

  MIN.forEach((m, i) => beats.push({ age: 61 + i, run: async () => { if(await yesno(p, io, { title:m.t, sub:m.s, cost:m.cost||0 })) m.r(); } }));

// ---------- ชีวิตทั้งชีวิต ----------
async function live(p, io){
  Object.defineProperty(p, 'io', { value: io, enumerable:false, writable:true });
  try {
    await birth(p, io); await stage1(p, io); await stage2(p, io); await stage3(p, io); await stage6(p, io);
  } catch(e){ if(!(e instanceof Death)) throw e; p.dead = true; p.cause = e.cause; }
  p.dead = true;
  return await stage7(p, io);
}

// ===== Sim IO สำหรับจำลองชีวิตเปรียบเทียบ =====
const SimIO = {
  ask: async o => { const ok = o.choices.map((c,i)=>c.disabled?-1:i).filter(i=>i>=0); return ok[Math.floor(rnd()*ok.length)]; },
  say: async () => {}, skip: async () => {}, chips: () => {}, update: () => {},
  multi: async o => o.items.map((c,i)=>(!c.disabled && rnd()<.35)?i:-1).filter(i=>i>=0),
};
async function simulateLives(n, onDone){
  const scores = [];
  for(let i = 0; i < n; i++){
    try { const r = await live(newPlayer(), SimIO); scores.push(r.score); } catch(e){ /* ข้ามชีวิตที่พัง */ }
    if(i % 5 === 4) await new Promise(r => setTimeout(r, 0));
  }
  scores.sort((a,b)=>a-b);
  if(onDone) onDone(scores);
  return scores;
}
function percentile(scores, s){ if(!scores || scores.length < 20){ const z = (s - 48)/10; return clamp(Math.round(100/(1+Math.exp(-1.7*z))), 1, 99); } let c = 0; for(const v of scores) if(v < s) c++; return clamp(Math.round(c/scores.length*100), 1, 99); }
// ===== ความลึกของชีวิต: นิสัยสุขภาพ · ผลย้อนหลังจากวัยเด็ก · คุก · รวยมหาศาล =====

// ---------- นิสัยสุขภาพ ----------
function hab(p){ if(!p.hab) p.hab = { smoke:0, smokeFrom:0, smokeYrs:0, drink:0, drinkYrs:0, ex:0, exYrs:0, hFrac:0 }; return p.hab; }
const DISEASES = {
  hyper:   { name:'ความดันโลหิตสูง', chronic:true },
  diabetes:{ name:'เบาหวาน', chronic:true },
  lung:    { name:'มะเร็งปอด', chronic:false, lost:30 },
  liver:   { name:'ตับแข็ง', chronic:false, lost:25 },
  kidney:  { name:'ไตวายเรื้อรัง', chronic:true, lost:15 },
  heart:   { name:'หัวใจขาดเลือดเฉียบพลัน', chronic:false, lost:30 },
};
function hasDz(p, k){ return !!(p.dz && p.dz[k]); }
// เรียกทุกปีจาก years(): ผลสะสมของนิสัย + สุ่มโรค (คืนชื่อโรคที่เพิ่งเป็น)
function habitYear(p){
  const h = hab(p);
  if(h.smoke) h.smokeYrs++;
  if(h.drink === 2) h.drinkYrs++; else if(h.drink === 1) h.drinkYrs += .3;
  if(h.ex) h.exYrs++;
  let d = 0;
  if(h.smoke && p.age > 30) d -= .3;
  if(h.drink === 2 && p.age > 30) d -= .3;
  if(p.flags.ot && p.age > 30 && p.age < 60) d -= .3;
  if(h.ex && p.age > 25 && p.H < TIERS[p.tier].H + 10) d += .6;
  for(const k in (p.dz || {})){ const z = p.dz[k]; if(DISEASES[k].chronic) d -= z.care === 'ignore' ? 1.2 : z.care === 'diet' ? .3 : .6; }
  h.hFrac += d; const whole = h.hFrac > 0 ? Math.floor(h.hFrac) : Math.ceil(h.hFrac); p.H += whole; h.hFrac -= whole;
  for(const k in (p.dz || {})) if(DISEASES[k].chronic) addMoney(p, p.dz[k].care === 'ignore' ? 0 : -3000);
  if(p.age < 38) return null;
  const lux = p.lifestyle === 2 ? 1 : 0;
  const risk = {
    hyper:    .004 + .004*(p.flags.ot?1:0) + .003*(h.drink===2?1:0) + .002*h.smoke + .002*lux - .003*h.ex,
    diabetes: .0025 + .004*lux + .003*(h.ex?0:1) + .002*(h.drink>=1?1:0),
    lung:     h.smokeYrs >= 10 && p.age >= 45 ? .0003*h.smokeYrs : 0,
    liver:    h.drinkYrs >= 8 && p.age >= 40 ? .00025*h.drinkYrs : 0,
    kidney:   ((hasDz(p,'diabetes') && p.age - p.dz.diabetes.age >= 6) || (hasDz(p,'hyper') && p.age - p.dz.hyper.age >= 8)) ? .008 * (Object.values(p.dz).some(z=>z.care==='ignore') ? 2 : 1) : 0,
    heart:    p.age >= 45 ? .001 + .003*h.smoke + .003*(hasDz(p,'hyper')?1:0) + .002*(hasDz(p,'diabetes')?1:0) - .001*h.ex : 0,
  };
  for(const k of Object.keys(risk)){ if(hasDz(p, k)) continue; if(chance(Math.max(0, risk[k]))) return k; }
  return null;
}
function dzCause(p, k){

const val = (v, p) => typeof v === 'function' ? v(p) : v;
async function offerTempt(p, io, d){
  p._tempt = d;
  const yes = await yesno(p, io, { kind:'tempt', bg: p.age < 18 ? 'school' : 'city', title:'ทางลัดที่ไม่มีใครเห็น', text: val(d.label, p), sub: p.age >= 18 ? val(d.gain, p).replace(`${Math.round(d.risk*100)}%`, pctR(p, d.risk)) : val(d.gain, p), noSub: d.refuseK ? `K+${d.refuseK}` : '', yes: d.yes || 'ทำ', no: d.no || 'ไม่ทำ' });
  if(!yes){
    if(d.refuseRun) d.refuseRun(p);
    if(d.refuseK){ fx(p,{K:d.refuseK}); tagGood(p,'honest',`ปฏิเสธ: ${val(d.label,p)}`); }
    note(p, d.refuseNote || 'คุณเลือกไม่ทำ');
    return;
  }
  if(d.fx) fx(p, d.fx);
  if(d.m) fx(p, { m: val(d.m, p) });
  fx(p, { K: d.K }); tagBad(p, d.tag, val(d.label, p), val(d.amount, p) || val(d.m, p) || 0);
  let txt = d.run ? d.run(p) : '';
  if(chance(p.age >= 18 ? connRisk(p, d.risk) : d.risk)){ const t = await d.caught(p, io); if(t) note(p, t); }
  else note(p, txt || 'ไม่มีใครรู้ อย่างน้อยก็ในตอนนี้');
}

const CAREER_BANK = { gov:1, office:.95, factory:.9, biz:.8, farm:.75, influ:.7, abroad:.7 };
function loanOdds(p, price){
  const hh = Math.max(1, hhIncome(p)); const pay = price * .9 * .0065; const r = pay / hh;
  const base = r <= .3 ? .95 : r <= .45 ? .7 : r <= .6 ? .35 : r <= .8 ? .1 : .02;
  return clamp(base * (CAREER_BANK[p.career] || .6) * (p.status.bankrupt ? 0 : 1) * bkRec(p) * (p.flags.fled ? .3 : 1), 0, .97);
}
function setHouse(p, h, price, loan){
  const hh = Math.max(1, hhIncome(p));
  p.house = { value: price, years: 0, q: h.q, id: h.id, name: h.name, term: 30, loan: loan || 0, saveCut: loan > 0 ? clamp(loan * .0065 / hh, .03, .5) : 0 };
  fx(p, { J: h.J, C: h.C }); log(p, `ได้${h.name}`);
}
async function houseChoice(p, io, upgrade = false, title = null){
  if(p.flags.livesAbroad){
    if(upgrade || p.status.prison || !p.career) return;
    await say(p, io, { kind:'life', bg:'abroad', title:'บ้านของคุณในต่างแดน', text:'คุณต่อสัญญาเช่าห้องใกล้ที่ทำงาน ค่าที่พักรวมอยู่ในค่าใช้จ่ายปกติแล้ว ส่วนบ้านของครอบครัวยังอยู่ที่ไทย' });
    return;
  }
  if(!p.career || p.status.prison) return;
  if(!upgrade && p.house) return;
  if(upgrade && (!p.house || p.house.q >= 5)) return;
  const sell = upgrade ? Math.round(p.house.value * .9) : 0;
  const cash = Math.max(0, p.money) + sell;
  const opts = HOMES.filter(h => !upgrade || h.q > p.house.q).map(h => {
    const down = Math.round(h.price * .1);
    const payCash = cash >= h.price;
    const odds = payCash ? 1 : loanOdds(p, h.price);
    const pay = Math.round(h.price * .9 * .0065 / 100) * 100;
    const cond = (h.cond ? h.cond(p) : true) && cash >= down;
    return { label:h.name, sub: payCash ? `ราคา ฿${baht(h.price)} · จ่ายสดได้ · J+${h.J}` : `ราคา ฿${baht(h.price)} · ผ่อน ~${baht(pay)}/เดือน · กู้ผ่าน ${Math.round(odds*100)}%`, cost: upgrade ? 0 : (payCash ? h.price : down), loan:false,
      cond, condText: h.cond && !h.cond(p) ? h.condText : `ต้องมีเงินดาวน์ ฿${baht(down)}`, k:h.id, h, odds, payCash, down };
  });
  const famHome = !p.flags.livesAbroad && (p.q>=2 || p.tier===4 || p.tier===5);
  opts.push({ label: upgrade ? 'อยู่บ้านเดิมต่อ' : famHome ? (parentsWord(p) ? 'อยู่บ้านพ่อแม่ไปก่อน' : 'อยู่บ้านเก่าของครอบครัวไปก่อน') : 'เช่าอยู่ไปก่อน', sub: upgrade ? 'ไม่มีผล' : 'ค่าที่พักอยู่ในค่าใช้จ่ายปกติ', k:'none' });
  const c = await choose(p, io, { kind:'minor', bg:'home', title: title || (upgrade ? `ขายบ้านเดิม (ได้ ฿${baht(sell)}) แล้วขยับขึ้นไหม` : 'จะมีบ้านเป็นของตัวเองไหม'), text:`รายได้ครัวเรือนราว ฿${baht(hhIncome(p))}/เดือน · เงินเก็บ ฿${baht(p.money)}`, choices: opts.map(o => ({ ...o, defer: upgrade })) });
  if(c.k === 'none') return;
  if(!c.payCash && !chance(c.odds)){ if(!upgrade) addMoney(p, c.cost); note(p, 'ธนาคารไม่อนุมัติสินเชื่อ ได้เงินดาวน์คืน'); return; }
  if(upgrade){ addMoney(p, sell); const pay = c.payCash ? c.h.price : c.down; addMoney(p, -pay); note(p, `ขาย${p.house.name || 'บ้านเดิม'}ได้ ฿${baht(sell)}`); }
  setHouse(p, c.h, c.h.price, c.payCash ? 0 : c.h.price - c.down);
  note(p, c.payCash ? `ซื้อ${c.h.name}ด้วยเงินสด` : `กู้ผ่าน ได้${c.h.name} ผ่อน 30 ปี`);
}

async function carChoice(p, io){
  if(!p.career || p.status.prison) return;
  const hh = Math.max(1, hhIncome(p));
  const opts = CARS.map(c => {
    const down = Math.round(c.price * .15), pay = Math.round(c.price * .85 * 1.21 / 84 / 100) * 100;
    const payCash = p.money >= c.price;
    const r = pay / hh; const odds = payCash ? 1 : clamp((r <= .15 ? .95 : r <= .25 ? .75 : r <= .4 ? .35 : .05) * (CAREER_BANK[p.career] || .6) * (p.status.bankrupt ? 0 : 1) * bkRec(p), 0, .97);
    return { label:c.name, sub: payCash ? `฿${baht(c.price)} · จ่ายสดได้` : `฿${baht(c.price)} · ผ่อน ~${baht(pay)}/เดือน 7 ปี · ไฟแนนซ์ผ่าน ${Math.round(odds*100)}%`, cost: payCash ? c.price : down, loan:false,
      cond: p.money >= down, condText:`ต้องมีเงินดาวน์ ฿${baht(down)}`, k:c.id, car:c, payCash, pay, odds };
  });
  opts.push({ label:'ยังไม่ซื้อ ใช้รถสาธารณะ', sub:'ประหยัด', k:'none' });
  const c = await choose(p, io, { kind:'minor', bg:'road', title:'จะซื้อรถไหม', text:`รายได้ครัวเรือนราว ฿${baht(hh)}/เดือน · เงินเก็บ ฿${baht(p.money)}`, choices: opts });
  if(c.k === 'none') return;
  if(!c.payCash && !chance(c.odds)){ addMoney(p, c.cost); note(p,'ไฟแนนซ์ไม่อนุมัติ ได้เงินดาวน์คืน'); return; }
  const C = c.car; p.car = { id:C.id, name:C.name, price:C.price };
  fx(p, { J:C.J, C:C.C, H:C.H });
  if(!c.payCash) p.annual.push({ from:p.age, to:p.age+7, amt: c.pay * 12 });
  if(C.repair) p.annual.push({ from:p.age, to:p.age+8, amt:C.repair });
  log(p, `ได้${C.name}`);
  note(p, c.payCash ? `ซื้อ${C.name}ด้วยเงินสด` : `ไฟแนนซ์ผ่าน ได้${C.name}`);
}

function s0(p){ return p.tier === 1 ? 'ในซอยย่านชานเมืองกรุงเทพฯ' : `ในตัวเมือง${p.prov}`; }

const SKIP_KIND = /^(funeral|mourn|death)$/;
function actionOf(o, c){
  const generic = /^(ทำ|ไม่ทำ)$/.test(c.label || '');
  if(!generic) return { pick: true, text: c.label };
  let t = (o.title || '').replace(/\s*\(.*?\)\s*/g, ' ').replace(/\s*(ไหม|หรือเปล่า|\?)\s*$/, '').trim();
  return { pick: false, text: t };
}
function placeNow(p, X){
  if(p.status.prison) return pk(['ในห้องขังที่มีคนอีกสี่สิบคน', 'ระหว่างเข้าแถวรับข้าวในเรือนจำ'], p);
  if(p.age >= 60) return pk([`ระหว่างนั่งเล่นหน้า${X.homeNow}`, 'หลังสวดมนต์ก่อนนอน', 'ตอนหลานโทรมาหา'], p);
  if(p.age < 22 && !p.career) return pk(['ในห้องพักหอที่มีพัดลมตัวเดียว', 'หลังเลิกเรียน', `ระหว่างนั่งรถกลับ${X.prov}ช่วงปิดเทอม`], p);
  if(!p.career || p.unemployed) return pk([`ระหว่างนอนมองเพดาน${X.homeNow}`, 'ระหว่างนั่งรอสัมภาษณ์งาน'], p);
  const work = { farm:'หลังกลับจากนา', factory:'หลังเลิกกะ', gov:'หลังเลิกราชการ', office:'ระหว่างนั่งรถกลับจากออฟฟิศ', biz:'หลังปิดร้าน', abroad:'ในห้องพักคนงานที่ต่างประเทศ', influ:'หลังไลฟ์จบ', crime:'หลังเก็บเงินรอบดึก', pol:'หลังลงพื้นที่มาทั้งวัน' }[p.career] || 'หลังเลิกงาน';
  const callee = p.skipGen ? (p.age < 40 ? (p.sex==='M'?'ยาย':'ย่า') : null) : X.mom;
  return pk([work, `คืนนั้นใน${X.homeNow}`, ...(callee ? [`ระหว่างโทรคุยกับ${callee}ที่${X.prov}`] : [])], p);
}
// เลี่ยงประโยคซ้ำ: แต่ละประโยคประกอบใช้ได้ไม่เกิน 2 ครั้งต่อชีวิต และไม่ติดกัน
function fresh(p, line){ if(!line) return ''; const key = line.replace(/฿?[\d.,]+\s*(ล้าน|k)?/g, '#'); p._lines = p._lines || {}; const n = p._lines[key] || 0; if(n >= 2 || p._lastLine === key) return ''; p._lines[key] = n + 1; p._lastLine = key; return line; }
function storyFor(p, o, c){
  try {
    if(!o || !c || SKIP_KIND.test(o.kind || '')) return '';
    const X = ctxOf(p);
    let s = '';
    for(const S of STORIES){ if(S.t(o, c)){ s = S.f(X, p, o, c) || ''; break; } }
    if(!s) s = genericStory(p, X, o, c);
    p._recent = p._recent || [];
    if(p._recent.includes(s)) s = genericStory(p, X, o, c);
    p._recent.push(s); if(p._recent.length > 8) p._recent.shift();
    return s;
  } catch(e){ return ''; }
}
function genericStory(p, X, o, c){
  const kid = p.age < 18, A = actionOf(o, c), costly = (c.cost || 0) > 0;
  const did = A.pick ? `คุณเลือก${A.text}` : isYes(c) ? `คุณตัดสินใจ${A.text}` : `คุณตัดสินใจไม่${A.text}`;
  if(kid){
    const react = costly ? (X.poor ? `${X.carer}นับเงินในกระป๋องอยู่นานก่อนจะพยักหน้า` : `${X.carer}จ่ายให้โดยไม่ถามสักคำ`)
      : pk([`${X.carer}ฟังแล้วไม่ได้ว่าอะไร`, `${X.carer}ลูบหัวคุณเบา ๆ`, `${X.carer}บอกว่าโตแล้วก็คิดเองได้`], p);
    return pk([`${did} คืนนั้นที่${X.home} ${react}`, `${did} เรื่องนี้กลายเป็นหัวข้อคุยในวงข้าวเย็นระหว่างกิน${X.food}`, `${did} ระหว่าง${X.go}กลับบ้าน คุณฟัง${X.sound}แล้วคิดเรื่องนี้ไปตลอดทาง`], p);
  }
  let money = '';
  if(costly && p.money < c.cost * 2 && p.money >= 0) money = 'เงินเก็บที่มีอยู่น้อยนิดหายไปอีกก้อน';
  else if(costly && p.money > c.cost * 50) money = 'เงินก้อนนี้แทบไม่ทำให้บัญชีของคุณขยับ';
  const tail = fresh(p, money) || fresh(p, mood(p)) || (rnd() < .6 ? fresh(p, memory(p)) : '');
  return `${placeNow(p, X)} ${did}${tail ? ' · ' + tail : ''}`;
}

function connRisk(p, base){ return clamp(base * clamp(1.75 - p.C / 40, .4, 1.6) * worldRiskF(p), .01, .95); }

function investYear(p, notes){
  if(p.age < 22 || p.money <= 0) return;
  const k = p.invest || 'bank';
  const crash = chance(.06); // ปีวิกฤตของทั้งตลาด
  let r;
  if(k === 'bank') r = .015;
  else if(k === 'fund') r = crash ? -.30 + .05*gauss() : .065 + .11*gauss();
  else if(k === 'spec') r = crash ? -.6 + .1*gauss() : .07 + .38*gauss();
  else { r = .10 + .07*gauss(); if(chance(connRisk(p, .06))) p._secCase = true; }
  r = clamp(r, -.75, 1.5);
  const amt = Math.round(p.money * r);
  p.money += amt;
  p.invRet = (p.invRet || 0) + amt;
  if(crash && (k === 'fund' || k === 'spec')) notes.push(`ปีวิกฤต ตลาดหุ้นดิ่ง พอร์ต${INVEST[k].short}ของคุณหายไป ฿${bahtS(-amt)}`);
  else if(k === 'spec' && r > .6) notes.push(`หุ้นที่คุณถือพุ่งแรง พอร์ตโตขึ้น ฿${bahtS(amt)}`);
  else if(k === 'spec' && r < -.3) notes.push(`หุ้นซิ่งในพอร์ตร่วงหนัก หายไป ฿${bahtS(-amt)}`);
}

    text:`เงินเก็บตอนนี้ ฿${baht(Math.max(0, p.money))}${p.invRet ? ` · กำไรขาดทุนสะสม ฿${baht(p.invRet)}` : ''}`, choices: opts });

  log(p, `เก็บเงินแบบ${INVEST[c.k].short}`);
}
function investBeats(p, io, beats){
  [25, 40].forEach(age => beats.push({ age, run: () => investChoice(p, io) }));
  beats.push({ age: 58, run: () => investChoice(p, io, true) });
}

function tag(p, t, l){ tagGood(p, t, l); }
function pickThai(p, pool, n){ return drawEvents(p, pool, n); }
function thaiBeats(stage, p, io, beats){
  if(stage === 1){ pickThai(p, THAI_KID, 2).forEach((e, i) => beats.push({ age: [8, 13][i], run: () => e.run(p, io) })); }
  if(stage === 2){ pickThai(p, THAI_YOUNG, 1).forEach(e => beats.push({ age: 19, run: () => e.run(p, io) })); }
  if(stage === 3){
    const evs = pickThai(p, THAI_ADULT, 3); const ages = distinctAges(evs.length, 26, 57);
    evs.forEach((e, i) => beats.push({ age: ages[i], run: () => { if(p.status.prison) return; return e.run(p, io); } }));
    beats.push({ age: 55, run: async () => { const k = pickThai(p, THAI_KIDS, 1)[0]; if(k && !p.status.prison) await k.run(p, io); } });
  }
  if(stage === 6){ pickThai(p, THAI_OLD, 1).forEach(e => beats.push({ age: randi(66, 74), run: () => e.run(p, io) })); }
}

async function freeTime(p, io){
  if(p.status.prison || !p.career) return;
  const items = freeOpts(p);
  let picks = await io.multi({ kind:'life', bg: CAREERS[p.career].bg || 'city', title:'ช่วงนี้ใช้เวลาว่างกับอะไร', text:'เลือกได้ไม่เกิน 2 อย่าง (เวลามีจำกัด) หรือไม่เลือกก็ได้', items: prepChoices(p, items), max:2, p, pend:p.pend.splice(0) });
  picks = picks.slice(0, 2);
  if(!picks.length){ tell(p, 'เวลาว่างทั้งหมดหมดไปกับงานและการนอน'); return; }
  const lines = [];
  for(const i of picks){ const it = items[i]; spend(p, it.cost); it.run(); lines.push(it.st); log(p, it.label); }
  tell(p, lines.join(' · '));
}
// ===== ความสมดุล: ค่าครองชีพขั้นต่ำ · ผลตอบแทนลดหลั่นเมื่อค่าสูง · ฉายาชีวิตตอนจบ =====
// ค่าครองชีพขั้นต่ำต่อผู้ใหญ่ 1 คนต่อเดือน ตามพื้นที่ (ไม่รวมค่าเลี้ยงลูกที่คิดแยก)
const LIV = [0, 12000, 10000, 9000, 7500, 6500, 6500];
function livingFloor(p){
  const adults = 1 + ((p.spouse && !p.spouse.separated) ? 1 : 0);
  return LIV[p.tier] * adults * [0.85, 1, 1.4][p.lifestyle] * (p.house && p.house.q >= 4 ? 1.2 : 1);
}
// ค่ายิ่งสูง ยิ่งเพิ่มยาก: 50 → เต็ม · 70 → ราว 0.7 · 85 → ราว 0.45 · 95 → 0.3
function dimin(cur, d){ if(d <= 0) return d; const f = clamp((115 - cur) / 65, .3, 1); return Math.max(1, Math.round(d * f)); }

// ฉายาชีวิต: บอกว่าชีวิตนี้ไปสุดทางไหน
function archetype(r, p){
  const W = r.Pw, J = r.Jbar, H = r.Hbar, C = p.C, S = p.S, K = r.K, E = r.estate;
  const hi = { W: W >= 80, J: J >= 62, H: H >= 68, C: C >= 70, S: S >= 75 };
  const n = Object.values(hi).filter(Boolean).length;
  if(hi.W && hi.J && hi.H && (hi.C || hi.S) && K > -20) return { t:'ชีวิตครบสูตร', d:'รวย มีความสุข สุขภาพดี และคนรอบตัวนับถือ ชีวิตแบบนี้มีไม่กี่คนในหกสิบห้าล้าน', rare:true };
  // ---- นักการเมือง ----
  const pr = p.flags.polRank ?? -1;
  if(pr >= 3 && !p.flags.restricted) return { t:`รัฐมนตรีจาก${p.prov}`, d:'จากเด็กต่างจังหวัด สู่โต๊ะประชุมคณะรัฐมนตรี', rare:true };
  if(pr >= 2 && p.flags.restricted) return { t:'นักการเมืองหลังลูกกรง', d:'ป้ายหาเสียงเคยติดทุกเสาไฟฟ้า ตอนนี้เหลือแต่ภาพในข่าวเก่า' };
  if(pr >= 2) return { t:'ผู้แทนราษฎร', d:`ชาวบ้านใน${p.prov}จำหน้าคุณได้จากป้ายหาเสียงทุกเสาไฟฟ้า` };
  if(pr >= 0 && (p.flags.polTerms || 0) >= 2) return { t:'นักการเมืองท้องถิ่นตัวจริง', d:'ถนน ประปา และงานศพในตำบล ไม่มีงานไหนขาดชื่อคุณ' };
  if((p.career === 'pol' || p.flags.polEx) && pr < 0) return { t:'ผู้สมัครที่ไม่เคยชนะ', d:'ลงสมัครด้วยความหวังทุกครั้ง แต่ชื่อคุณไม่เคยขึ้นกระดานผู้ชนะ' };
  // ---- สายมืด ----
  if(p.flags.crimeRank >= 2 && !p.status.prison && E > 10000000) return { t:`เจ้าพ่อแห่ง${p.prov}`, d:'คนทั้งจังหวัดรู้จักชื่อคุณ แต่ไม่มีใครกล้าพูดถึงมันดัง ๆ' };
  if(p.career === 'crime' && /ยิง|เก็บ/.test(r.cause || '')) return { t:'ตายตามทางที่เลือก', d:'ในวงการนี้ ไม่ค่อยมีใครได้แก่ตาย' };
  if(p.flags.exCrime && K > -20) return { t:'คนกลับใจ', d:'เคยเดินในทางมืด แต่หันหลังกลับมาได้ก่อนสายเกินไป' };
  if((p.flags.crimeJailed || 0) >= 2) return { t:'เข้าออกคุกจนชิน', d:'ชีวิตครึ่งหนึ่งอยู่หลังกำแพง อีกครึ่งรอวันกลับเข้าไป' };
  // ---- ทางที่ขาดหรือพัง ----
  const debtBig = E < -1500000, sad = J < 45, broken = H < 45 || (r.age < 60 && /โรค|ป่วย|สุขภาพ|ไต|ตับ|มะเร็ง|หัวใจ|เส้นเลือด/.test(r.cause || ''));
  const jailed = !!p.flags.restricted, bk = p.log.some(l => /ล้มละลาย|ศาลปลดคุณ/.test(l.text));
  if([E < 0, sad, broken].filter(Boolean).length >= 3 || (debtBig && (sad || broken))) return { t:'พังทุกด้าน', d:'หนี้ ความทุกข์ และร่างกายที่ทรุดลง มาพร้อมกันจนไม่มีช่วงให้หายใจ' };

// เรียกทุกปีจาก years() · ผลที่เกิดขึ้นแสดงเป็นบรรทัดในหน้ากระโดดเวลา
function statWorkF(p){
  let f = 1;
  if(p.H < 35) f *= .75 + p.H / 140;      // H 0 → −25% · H 35 → ปกติ
  else if(p.H >= 75) f *= 1.05;
  if(p.J < 25) f *= .9;
  return f;
}
function statNote(p, notes, key, k, t){
  p.flags.sn = p.flags.sn || {};
  if((p.flags.sn[key] ?? -99) > p.age - 5) return;
  p.flags.sn[key] = p.age; notes.push({ k, t });
}
function statYear(p, notes){
  if(p.age < 15) return;
  const working = p.age >= 22 && p.age < 60 && !!p.career && !p.status.prison;
  if(p.H < 35){ addMoney(p, -lm(p, (35 - p.H) * 600)); statNote(p, notes, 'lowH', 'H', working ? 'สุขภาพไม่ดี ลาป่วยบ่อยจนรายได้หาย และค่ารักษาเพิ่มขึ้นทุกปี' : 'สุขภาพไม่ดี ค่ายาและค่าหมอเพิ่มขึ้นทุกปี'); }
  else if(p.H >= 75 && working) statNote(p, notes, 'hiH', 'H', 'ร่างกายแข็งแรง ทำงานได้เต็มที่ ไม่ค่อยต้องลาป่วย');
  if(p.J < 25){
    if(!p.status.depressed && chance(.08)){ stOn(p, 'depressed'); notes.push({ k:'J', t:'ความทุกข์สะสมจนกลายเป็นภาวะซึมเศร้า' }); }
    else statNote(p, notes, 'lowJ', 'J', working ? 'ใจไม่อยู่กับงาน ผลงานตกจนรายได้หายไปบ้าง' : 'วันส่วนใหญ่ผ่านไปอย่างไม่มีแรง');
    if(chance(.3)) p.H -= 1;
  } else if(p.J >= 75){ p.H += .5; if(chance(.25)) p.C = Math.min(100, p.C + 1); statNote(p, notes, 'hiJ', 'J', 'อารมณ์ดีจนคนรอบตัวอยากอยู่ใกล้ สุขภาพก็ดีตามไปด้วย'); }
  if(p.status.depressed && p.J >= 55 && chance(.25)){ stOff(p, 'depressed'); notes.push({ k:'J', t:'ภาวะซึมเศร้าค่อย ๆ หายไป' }); }
  if(!working) return;
  if(p.S >= 70 && !['farm', 'crime', 'pol'].includes(p.career) && chance(.03 + (p.S - 70) * .003)){ p.incomeBoost *= 1.06; statNote(p, notes, 'hiS', 'S', 'ฝีมือของคุณเป็นที่รู้กันในวงการ ได้งานใหญ่และขึ้นค่าตัว'); }
  else if(p.S < 30 && ['office', 'factory', 'biz', 'influ'].includes(p.career) && chance(.05)){ p.incomeBoost *= .95; statNote(p, notes, 'lowS', 'S', 'ทักษะตามงานไม่ทัน ถูกลดบทบาทลง'); }
  if(p.unemployed > 0 && p.C >= 65 && chance(.5)){ p.unemployed = 0; notes.push({ k:'C', t:'คนรู้จักฝากงานให้ ได้งานใหม่เร็วกว่าที่คิด' }); }
  if(p.C < 20){ p.J -= 1; statNote(p, notes, 'lowC', 'C', 'ไม่ค่อยมีใครให้พึ่ง เวลามีปัญหาต้องแบกไว้คนเดียว'); }
}

const PARTY_W = { imt:[0,.22,.27,.30,.33,.38,.30], ngs:[0,.30,.30,.25,.22,.18,.15], kjs:[0,.32,.24,.23,.22,.22,.25], rrb:[0,.16,.19,.22,.23,.22,.30] };

    lines:['ปราบโกงจริงจัง คนรับเงินใต้โต๊ะเสี่ยงโดนจับมากขึ้น','เบี้ยสวัสดิการเพิ่มให้ครัวเรือนรายได้น้อยและผู้สูงอายุ','งบลงท้องถิ่นมากขึ้น','ข้าราชการถูกรัดเข็มขัด'] },

};
function wld(p){ if(!p.world) p.world = { party:null, junta:0, nextElec: 18 + randi(0, 3), mods:[], seen:{}, last:-9 }; return p.world; }
function addMod(p, m){ const w = wld(p); w.mods = w.mods.filter(x => x.id !== m.id); w.mods.push({ ...m, until: p.age + (m.years || 2) }); return w.mods[w.mods.length - 1]; }
function worldIncomeF(p){ if(!p.world) return 1; let f = 1; for(const m of p.world.mods){ if(m.inc){ const v = m.inc[p.career] ?? m.inc.all; if(v) f *= v; } if(m.tier && m.tier[p.tier]) f *= m.tier[p.tier]; } return f; }
function worldCostF(p){ return p.world ? p.world.mods.reduce((f, m) => f * (m.cost || 1), 1) : 1; }
function worldRiskF(p){ return p.world ? p.world.mods.reduce((f, m) => f * (m.risk || 1), 1) : 1; }
function worldCashYear(p){ return p.world ? p.world.mods.reduce((s, m) => s + (m.cash ? m.cash(p) : 0), 0) : 0; }
function modText(p, m){
  const out = [];
  const f = (m.inc ? (m.inc[p.career] ?? m.inc.all ?? 1) : 1) * (m.tier ? (m.tier[p.tier] ?? 1) : 1);
  if(p.career && p.age < 60 && Math.abs(f - 1) > .004) out.push(`รายได้คุณ ${f > 1 ? '+' : '−'}${Math.round(Math.abs(f - 1) * 100)}%`);
  if(m.cost && m.cost !== 1) out.push(`ค่าครองชีพ ${m.cost > 1 ? '+' : '−'}${Math.round(Math.abs(m.cost - 1) * 100)}%`);
  const c = m.cash ? m.cash(p) : 0; if(c) out.push(`เงินช่วยเหลือ ฿+${baht(c)}/ปี`);
  if(m.risk && m.risk > 1 && (p.career === 'crime' || p.tagsBad.some(t => t.type === 'corrupt'))) out.push('เสี่ยงโดนจับมากขึ้น');
  return out.join(' · ');
}
function worldHTML(p){
  if(!p.world || !p.world.mods.length) return '';
  const parts = p.world.mods.map(m => { const t = modText(p, m); return m.label + (t ? ` (${t})` : ''); });
  return `<p class="help">${ic('pin')} บ้านเมืองตอนนี้: ${rich(parts.join(' · '))}</p>`;
}
const askW = (p, io, title, text, choices, bg = 'news', kind = 'world') => choose(p, io, { kind, bg, title, text, choices, noStory:true });

function worldYear(p, notes){
  if(p.age < 18) return;
  const w = wld(p);
  const keep = [];
  for(const m of w.mods){ if(p.age < m.until) keep.push(m); else if(m.endText) notes.push({ k:'pin', t:m.endText }); }
  w.mods = keep;
  if(w.junta){ if(p.age >= w.junta){ w.junta = 0; w.nextElec = p.age; } }
  else if(p.age >= 20 && chance(.02)){ p._world = WORLD_EVENTS[0]; return; }
  if(!w.junta && p.age >= w.nextElec){ w.nextElec = p.age + 4; p._elec = true; return; }
  if(p.age - w.last >= 3 && chance(.14)){
    const pool = WORLD_EVENTS.filter(e => e.id !== 'coup' && !w.seen[e.id] && e.w(p) !== null);
    if(pool.length){ const e = wpick(pool, x => Math.max(1, x.w(p))); w.seen[e.id] = true; w.last = p.age; p._world = e; }
  }
}

async function election(p, io){
  const w = wld(p);
  if(p.career === 'pol' && p.age < 60 && !p.status.prison) await polCampaign(p, io);
  const keys = Object.keys(PARTIES);
  let vote = null;
  w.elecN = (w.elecN || 0) + 1;
  const ask = p.age < 80 && !p.status.prison && (p.career === 'pol' || w.elecN === 1 || w.elecN % 2 === 0 || w.junta === 0 && w.party === null);
  if(!ask && w.lastVote && PARTIES[w.lastVote]) vote = w.lastVote;
  if(ask){
    const buy = p.career !== 'pol' && chance(p.tier >= 4 ? .45 : .25);
    const choices = keys.map(k => ({ label:PARTIES[k].name, sub:PARTIES[k].pitch, k, cond: p.career !== 'pol' || !p.flags.polParty || k === p.flags.polParty, condText:'คุณสังกัดพรรคอื่น' }));
    choices.push({ label:'ไม่ไปใช้สิทธิ์', sub:'อยู่บ้านพักผ่อน', k:'none' });
    if(buy) choices.push({ label:`รับเงินหัวคะแนน ฿${baht(lm(p, 500))} แล้วกาตามสั่ง`, sub:'ได้เงินทันที · ผิดกฎหมาย', k:'sell' });
    const c = await choose(p, io, { kind:'vote', bg:'vote', title:'วันเลือกตั้งทั่วไป', text:`คนไทยหลายสิบล้านคนออกไปเข้าคิวหน้าหน่วยเลือกตั้ง${buy ? ' หัวคะแนนเดินแจกเงินกันตั้งแต่เมื่อคืน' : ''}`, choices, noStory:true });
    if(c.k === 'sell'){ fx(p, { m:lm(p, 500), K:-3 }); tagBad(p, 'corrupt', 'ขายเสียงเลือกตั้ง', lm(p, 500)); }
    else if(PARTIES[c.k]){ vote = c.k; fx(p, { K:1 }); }
    w.lastVote = vote;
  }
  const win = wpick(keys, k => PARTY_W[k][p.tier] + (k === vote ? .05 : 0) - (k === w.party ? .03 : 0));
  w.party = win; w.mods = w.mods.filter(m => !m.party);
  const pol = PARTY_POLICY[win];
  const m = addMod(p, { id:'gov', label:`รัฐบาล${PARTIES[win].short}`, years:4, inc:pol.inc, tier:pol.tier, cost:pol.cost, risk:pol.risk, cash:pol.cash, party:true });
  log(p, `${PARTIES[win].name}ชนะเลือกตั้ง`);
  if(pol.onWin) pol.onWin(p);
  const mine = modText(p, m);
  const txt = `${PARTIES[win].name}ชนะเลือกตั้ง${vote ? (vote === win ? ' พรรคที่คุณเลือก' : '') : ''} · ${pol.lines.join(' · ')}${mine ? ` · ผลกับคุณ: ${mine}` : ''}`;
  if(p.career === 'pol'){ await say(p, io, { kind:'world', bg:'parliament', title:`${PARTIES[win].name}ชนะเลือกตั้ง`, text: pol.lines.join('\n') + (mine ? `\nผลกับคุณ: ${mine}` : '') }); await polAfterElection(p, io, win); }
  else note(p, txt);
}

function polBeats(p, io){
  const evs = drawEvents(p, POL_EVENTS.map(e => ({ ...e, w: () => 1 })), 3);
  const ages = distinctAges(evs.length, p.age + 2, Math.min(58, p.age + 16));
  evs.forEach((e, i) => beats_later(p, ages[i] - p.age, async () => { if(p.career !== 'pol' || p.status.prison) return; const real = POL_EVENTS.find(x => x.id === e.id); if(real.w(p) === null) return; await runEvent(p, io, real); }));
}

// ===== จุดพลิกผันในชีวิต =====
function twistBeats(p, io, beats, pool, n, a, b){
  const evs = drawEvents(p, pool, n); const ages = distinctAges(evs.length, a, Math.max(a + 1, b));
  evs.forEach((e, i) => beats.push({ age: ages[i], run: async () => { if(p.status.prison) return; await runEvent(p, io, e); } }));
}

function autoBg(o, p){

    [/เรียน|สอบ|คอร์ส|อบรม|การบ้าน/, p.age < 18 ? 'school' : p.age < 23 ? 'uni' : 'cafe'],
    [/ป่วย|สุขภาพ|ออกกำลัง|หมอ|โรงพยาบาล/, 'hospital'], [/เที่ยว|ต่างประเทศ|เครื่องบิน/, 'airport'],
    [/ทำงาน|ตำแหน่ง|OT|เจ้านาย|อาชีพ|เงินเดือน/, careerBg],
  ];
  for(const [re, bg] of rules) if(re.test(t)) return bg;
  const pool = p.age < 18 ? ['home', 'school', 'kitchen', 'village'] : p.age < 23 ? ['uni', 'dorm', 'cafe', 'city', 'home'] : p.age < 60 ? ['home', 'kitchen', 'cafe', 'market', 'city', careerBg] : ['home', 'kitchen', 'village', 'market', 'oldhome'];

const SKINS = [P8.s, P8.ss, P8.s3];
function outfitOf(st, ctx){
  const q = st.q ?? 2;
  let t = [P8.L, P8.d, P8.l][0], pnt = P8.d;
  if(q <= 1){ t = P8.L; pnt = P8.dd; } else if(q <= 3){ t = P8.B; pnt = P8.n; } else { t = P8.gold; pnt = P8.w; }
  if(ctx === 'school'){ t = P8.w; pnt = P8.n; }
  if(ctx === 'uni'){ t = P8.w; pnt = P8.k; }
  if(ctx === 'office' || ctx === 'gov'){ t = ctx==='gov' ? P8.mud : P8.B; pnt = P8.dd; }
  if(ctx === 'farm'){ t = P8.b; pnt = P8.n; }

  if(ctx === 'funeral' || ctx === 'black'){ t = P8.k; pnt = P8.k; }

  if(ctx === 'monk'){ t = P8.o; pnt = P8.o; }
  if(ctx === 'wedding'){ t = P8.w; pnt = P8.gold; }

}
function person(x, base, st, ctx, t = 0, opts = {}){

  const hair = age >= 62 ? P8.l : age >= 50 ? '#8a8a8a' : (opts.hair || P8.k);
  const skin = SKINS[(opts.skin ?? st.skin ?? 0) % 3];
  const bob = opts.still ? 0 : (Math.floor(t*2 + x) % 2);
  const muF = (st.religion === 'อิสลาม' && sex === 'F' && age >= 12 && !opts.noHijab);
  const col = { h: muF ? P8.w : hair, s: skin, e: P8.k, m: P8.s3, t: of.t, p: of.p, f: P8.dd, w: P8.w };
  if(ctx === 'monk' && age >= 12) col.h = skin;

const PROMO_COLOR_CACHE=new Map();
function promoColor(c){
 if(!/^#[0-9a-f]{6}$/i.test(c))return c;
 if(PROMO_COLOR_CACHE.has(c))return PROMO_COLOR_CACHE.get(c);
 const rgb=[1,3,5].map(i=>parseInt(c.slice(i,i+2),16)/255);
 const hi=Math.max(...rgb),lo=Math.min(...rgb),l=(hi+lo)/2;
 let h=0,s=hi===lo?0:(hi-lo)/(1-Math.abs(2*l-1));
 if(hi!==lo){h=hi===rgb[0]?(rgb[1]-rgb[2])/(hi-lo)%6:hi===rgb[1]?(rgb[2]-rgb[0])/(hi-lo)+2:(rgb[0]-rgb[1])/(hi-lo)+4;h=(h*60+360)%360}
 // Warm architectural neutrals, deep blue shadows and richer foliage.
 if(s<.18&&l<.48){h=222;s=.26}else if(s<.15&&l>.62){h=42;s=.25}
 s=Math.min(.88,s*1.32);const light=Math.max(.055,Math.min(.94,(l-.45)*1.08+.47));
 const chroma=(1-Math.abs(2*light-1))*s,x=chroma*(1-Math.abs(h/60%2-1)),m=light-chroma/2;
 const v=h<60?[chroma,x,0]:h<120?[x,chroma,0]:h<180?[0,chroma,x]:h<240?[0,x,chroma]:h<300?[x,0,chroma]:[chroma,0,x];
 const out='#'+v.map(a=>Math.round((a+m)*255).toString(16).padStart(2,'0')).join('');
 PROMO_COLOR_CACHE.set(c,out);return out;
}

// Scanline polygons keep roofs and silhouettes on the same half-unit pixel grid.
dp=function(points,c){
 const ys=points.map(p=>p[1]),top=Math.floor(Math.min(...ys)*2)/2,bottom=Math.ceil(Math.max(...ys)*2)/2;
 for(let y=top;y<bottom;y+=.5){const hits=[];for(let i=0,j=points.length-1;i<points.length;j=i++){
  const a=points[j],b=points[i],yy=y+.25;

};

function routeEligible(p,route){return !p.status.prison && (['cadet','sports'].includes(route) ? p.stage===2 && p.uni===route : p.career===route && p.age<60);}
async function playRouteChapter(p,io,route,event){
 if(!routeEligible(p,route))return;
 const [id,title,bg,intro,options]=event;
 const seen=p.flags.routeChapters||(p.flags.routeChapters=[]);if(seen.includes(id))return;
 const choices=options.map(([label,effect,result,cost=0,flag],k)=>({label,k,cost,loan:false,sub:Object.entries(effect).map(([key,value])=>`${key==='m'?'฿':key}${value>=0?'+':'−'}${baht(Math.abs(value))}`).join(' · ')}));
 const c=await choose(p,io,{kind:'life',bg,title,text:typeof intro==='function'?intro(p):intro,choices});
 const [,effect,result,,flag]=options[c.k];fx(p,effect);if(flag)p.flags[flag]=true;seen.push(id);log(p,title);note(p,result);
 // Previously established relationships and preparation add a small, explicit payoff.
 if(id==='police_partner'&&p.flags.cadetBuddy){fx(p,{C:3});note(p,'ความไว้ใจจากสมัยนายร้อยช่วยให้ทำงานเข้าขา: C+3');}
 if(id==='athlete_contract'&&p.flags.sportPortfolio){fx(p,{m:20000});note(p,'ผลงานในพอร์ตช่วยต่อรองเงินเซ็นสัญญาเพิ่ม ฿20,000');}
 if(id==='coach_first'&&p.flags.coachMaterials){fx(p,{S:3});note(p,'คลังวิดีโอที่เตรียมไว้ช่วยวางบทเรียน: S+3');}
 if(id==='police_promotion'&&p.flags.cadetIntegrity){fx(p,{C:3});note(p,'ประวัติความซื่อตรงตั้งแต่เรียนช่วยให้ทีมเชื่อมั่น: C+3');}
}
function extraStudyChapters(p,io,beats){
 if(!['cadet','sports'].includes(p.uni))return;
 const route=p.uni;
 ROUTE_CHAPTERS[route].forEach((e,i)=>beats.push({age:18+i,run:()=>playRouteChapter(p,io,route,e)}));
}
function extraCareerChapters(p,io,beats){
 // Choose at execution time: career switches never show the former job's events.
 [24,26,29,32,34,37,41,45,49,53,57].filter(age=>age>=p.age).forEach(age=>beats.push({age,run:async()=>{
   const route=p.career;if(!['police','athlete','coach'].includes(route)||!routeEligible(p,route))return;
   const pool=ROUTE_CHAPTERS[route].filter(e=>!(p.flags.routeChapters||[]).includes(e[0]));
   if(!pool.length)return;
   // Keep setup chapters before their payoffs; later chapters vary between lives.
   const e=pool.length===ROUTE_CHAPTERS[route].length?pool[0]:pickOne(pool);
   await playRouteChapter(p,io,route,e);
 }}));
}

const ic = (k, cls = 'ic') => `<img class="${cls}" src="${ICONS[k]}" alt="${ICON_ALT[k] || ''}" title="${ICON_ALT[k] || ''}">`;
const sgn = s => s === '+' ? '+' : '−';
const upd = s => s === '+' ? 'up' : 'dn';
// แปลงตัวย่อ H J S C ฿ ค่าลูก ให้เป็นสัญลักษณ์
function rich(s){
  // บุญ/บาป (K) ซ่อนไว้จนตาย ไม่แสดงในตัวเลือก
  s = String(s).replace(/(^|[\s·])K\s?[+−\-]\s?\d+/g, '$1').replace(/(\s*·\s*){2,}/g, ' · ').replace(/^\s*·\s*|\s*·\s*$/g, '').replace(/\s{2,}/g, ' ').trim();
  let h = esc(s); const tok = []; const put = html => { tok.push(html); return `\u0001${tok.length-1}\u0002`; };
  h = h.replace(/(^|[^A-Za-z])([HJSC])\s?([+−\-])\s?(\d+)/g, (m, pre, k, sg, n) => pre + put(`<span class="fx ${upd(sg)}">${ic(k)}${sgn(sg)}${n}</span>`));
  h = h.replace(/ค่าลูก\s?([+−\-])\s?(\d+)/g, (m, sg, n) => put(`<span class="fx ${upd(sg)}">${ic('kid')}${sgn(sg)}${n}</span>`));
  h = h.replace(/฿\s?([+−\-])\s?([\d,]+)/g, (m, sg, n) => put(`<span class="fx ${upd(sg)}">${ic('M')}${sgn(sg)}${n}</span>`));
  h = h.replace(/(^|[^A-Za-z])([HJSC])(?=[^A-Za-z]|$)/g, (m, pre, k) => pre + put(ic(k)));
  return h.replace(/\u0001(\d+)\u0002/g, (m, i) => tok[+i]);
}
