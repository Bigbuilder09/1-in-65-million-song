<style>
/* layout: จอเกมพิกเซลซ้าย + แผงตัดสินใจขวา (PC) / ซ้อนบนล่าง (มือถือ) · โลกเดียว: กลางคืนแบบตู้เกม ทองวัดไทยเป็นสีเน้น */
:root{
  --bg:#0b1026; --bg2:#121a3a; --panel:#151f45; --line:#2b3a72; --ink:#f3ecd9; --dim:#a9b0cf; --faint:#6e78a3;
  --gold:#e8b04a; --gold2:#ffd77a; --teal:#3fd1c4; --good:#38e07b; --bad:#ff4d6d; --karma:#b58cff; --warn:#ffcf4d;
  --f-disp:"Chakra Petch", "IBM Plex Sans Thai", system-ui, sans-serif; --f-body:"IBM Plex Sans Thai", "Chakra Petch", system-ui, sans-serif; --f-px:"Silkscreen", "Chakra Petch", monospace;
  color-scheme: dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0;
  background-image:radial-gradient(circle at 20% -10%, #1d2b5a 0, transparent 50%), radial-gradient(circle at 110% 120%, #2a1840 0, transparent 45%);}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
#app{max-width:1180px;margin:0 auto;padding-block:12px 28px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:12px;min-height:100%}
/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--bg2);border:2px solid var(--line);padding:8px 12px;box-shadow:0 4px 0 #050817}
.who{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1 1 220px}
.who b{font-family:var(--f-disp);font-size:18px;letter-spacing:.02em;white-space:nowrap}
.who .age{font-family:var(--f-px);font-size:12px;color:var(--gold2);white-space:nowrap}
.who .where{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.stat{display:flex;align-items:center;gap:5px;font-family:var(--f-px);font-size:12px;font-variant-numeric:tabular-nums;transition:transform .2s}
.stat img{width:14px;height:14px;image-rendering:pixelated}
.stat .bar{width:42px;height:6px;background:#0a0f24;border:1px solid var(--line);position:relative}
.stat .bar i{position:absolute;inset:0 auto 0 0;background:currentColor}
.stat.flash{transform:scale(1.15)}
.stat.H{color:#ff6b81}.stat.J{color:var(--warn)}.stat.S{color:#6cc6ff}.stat.C{color:var(--teal)}.stat.M{color:var(--gold2)}.stat.D{color:var(--bad)}
.stat .v{color:var(--ink);min-width:2ch}
/* main */
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:880px){ .main{grid-template-columns:minmax(0,1fr)} }
.screen{position:relative;border:3px solid #050817;outline:2px solid var(--line);background:#000;box-shadow:0 6px 0 #050817}
.screen canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%}
.scan{pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg, rgba(0,0,0,.14) 0 1px, transparent 1px 3px);mix-blend-mode:multiply}
.chips{position:absolute;left:8px;top:8px;display:flex;flex-direction:column;gap:4px;pointer-events:none}
.chip{font-family:var(--f-px);font-size:12px;padding:2px 6px;background:rgba(5,8,23,.85);border:1px solid var(--line);animation:rise 2.2s ease-out forwards}
.chip.up{color:var(--good)}.chip.down{color:var(--bad)}
@keyframes rise{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.timeline{margin-top:10px;position:relative;height:22px}
.timeline .track{position:absolute;left:0;right:0;top:9px;height:4px;background:#0a0f24;border:1px solid var(--line)}
.timeline .fill{position:absolute;left:0;top:9px;height:4px;background:var(--gold)}
.timeline .now{position:absolute;top:3px;width:10px;height:16px;margin-left:-5px;background:var(--gold2);box-shadow:0 0 0 2px #050817}
.timeline .tick{position:absolute;top:0;font-family:var(--f-px);font-size:9px;color:var(--faint);transform:translateX(-50%)}
.timeline .ev{position:absolute;top:8px;width:4px;height:6px;margin-left:-2px;background:var(--teal);opacity:.8}
.under{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:6px;flex-wrap:wrap}
.linkbtn{background:none;border:1px solid var(--line);color:var(--dim);padding:4px 10px;font-size:12.5px;cursor:pointer}
.ubtns{display:flex;gap:6px}
.linkbtn.snd b{color:var(--gold);font-weight:700}
.linkbtn.snd.off b{color:var(--faint);text-decoration:line-through}
.linkbtn.snd.off{color:var(--faint)}
.linkbtn:hover{color:var(--ink);border-color:var(--gold)}
.simnote{font-size:12px;color:var(--faint)}
/* panel */
.panel{background:var(--panel);border:2px solid var(--line);box-shadow:0 6px 0 #050817;padding:16px 16px 18px;min-width:0;display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--f-px);font-size:11px;letter-spacing:.08em;color:var(--gold);text-transform:uppercase;display:flex;gap:8px;flex-wrap:wrap}
.eyebrow span{color:var(--faint)}
.panel h2{font-family:var(--f-disp);font-weight:700;font-size:22px;line-height:1.3;margin:0;text-wrap:balance}
.panel .txt{white-space:pre-line;color:var(--dim);margin:0;max-width:62ch}
.head{border-left:4px solid var(--warn);background:rgba(255,207,77,.07);padding:8px 10px}
.head b{font-family:var(--f-disp);display:block;color:var(--warn)}
.head p{margin:2px 0 0;color:var(--dim);white-space:pre-line}
.pend{display:flex;flex-direction:column;gap:4px;border:1px dashed var(--line);padding:8px 10px;background:rgba(0,0,0,.18)}
.pend div{font-size:13.5px;color:var(--ink)}
.pend div::before{content:"▸ ";color:var(--gold)}
.choices{display:flex;flex-direction:column;gap:8px;margin-top:2px}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;background:#1b2757;border:2px solid #31438a;padding:9px 11px;cursor:pointer;box-shadow:0 3px 0 #0a0f24;transition:transform .08s, border-color .12s}
.ch:hover:not(:disabled),.ch:focus-visible{border-color:var(--gold);outline:none;transform:translateY(-1px)}
.ch:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0a0f24}
.ch .k{font-family:var(--f-px);font-size:11px;color:var(--faint);grid-row:1/3}
.ch .l{font-family:var(--f-disp);font-weight:600;font-size:15.5px;min-width:0}
.ch .s{grid-column:2;font-size:12.5px;color:var(--dim);min-width:0}
.ch .price{grid-row:1/3;grid-column:3;font-family:var(--f-px);font-size:11.5px;color:var(--gold2);text-align:right;white-space:nowrap}
.ch .price small{display:block;font-family:var(--f-body);font-size:10px;color:var(--faint);letter-spacing:0}
.ch .loan{grid-column:2;font-size:12px;color:var(--warn)}
.ch:disabled{opacity:.5;cursor:not-allowed;filter:saturate(.4)}
.ch .lock{grid-column:2;font-size:12px;color:var(--bad)}
.ch.on{border-color:var(--teal);background:#183a52}
.ch .box{grid-row:1/3;width:14px;height:14px;border:2px solid var(--faint)}
.ch.on .box{background:var(--teal);border-color:var(--teal)}
.go{align-self:flex-start;font-family:var(--f-disp);font-weight:700;font-size:16px;background:var(--gold);color:#1a1205;border:0;padding:10px 22px;cursor:pointer;box-shadow:0 4px 0 #8a5d12}
.go:hover,.go:focus-visible{background:var(--gold2);outline:none}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5d12}
.go.ghost{background:transparent;color:var(--ink);border:2px solid var(--line);box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap}
/* timeskip chart */
.chart{display:flex;align-items:center;gap:2px;height:96px;border-bottom:1px solid var(--line);border-top:1px solid var(--line);position:relative;overflow:hidden}
.chart .b{flex:1 1 0;min-width:2px;max-width:22px;position:relative;height:100%}
.chart .b i{position:absolute;left:0;right:0;background:var(--good)}
.chart .b.neg i{background:var(--bad)}
.chart .b.rec i{background:#8b93b8}
.chart .zero{position:absolute;left:0;right:0;top:50%;height:1px;background:var(--faint)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--faint)}
.legend i{display:inline-block;width:9px;height:9px;margin-right:4px;vertical-align:-1px}
.omen{color:var(--karma);font-style:italic}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;font-size:13.5px}
.kv dt{color:var(--faint)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
/* title */
.title-art{font-family:var(--f-disp);font-weight:700;font-size:clamp(34px,6vw,56px);line-height:1;margin:4px 0 0;color:var(--gold2);text-shadow:3px 3px 0 #7a3a22, 6px 6px 0 #050817;letter-spacing:.01em}
.title-art small{display:block;font-family:var(--f-px);font-size:12px;color:var(--teal);text-shadow:none;letter-spacing:.12em;margin-top:10px}
/* karma */
.ledger{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto;padding-right:4px}
.led{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 8px;padding:6px 8px;border-left:4px solid var(--karma);background:rgba(181,140,255,.08);animation:pop .4s both}
.led.good{border-color:var(--gold);background:rgba(232,176,74,.08)}
.led .a{font-family:var(--f-px);font-size:10px;color:var(--faint)}
.led .t{font-size:13.5px}
.led .st{font-family:var(--f-px);font-size:10px;text-align:right}
.led .st.y{color:var(--warn)} .led .st.n{color:var(--faint)}
.led .e{grid-column:2/4;font-size:12.5px;color:var(--dim)}
@keyframes pop{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.bigK{font-family:var(--f-px);font-size:26px}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .n{font-family:var(--f-disp);font-weight:700;font-size:44px;color:var(--gold2);line-height:1}
.score .p{font-family:var(--f-disp);font-size:18px}
.parts{display:flex;flex-direction:column;gap:5px}
.part{display:grid;grid-template-columns:96px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:12.5px}
.part .bar{height:8px;background:#0a0f24;border:1px solid var(--line);position:relative}
.part .bar i{position:absolute;inset:0 auto 0 0;background:var(--teal)}
.part span:last-child{font-family:var(--f-px);font-size:11px;text-align:right}
.card{max-width:100%;width:300px;image-rendering:pixelated;border:2px solid var(--line);display:block}
.cardwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.cardwrap > div{min-width:0;flex:1 1 200px}
/* drawer */
.drawer{position:fixed;inset:0;background:rgba(5,8,23,.7);display:flex;justify-content:flex-end;z-index:20}
.drawer .in{width:min(420px,100%);height:100%;background:var(--bg2);border-left:2px solid var(--line);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-right:max(16px, env(safe-area-inset-right,0px));overflow:auto}
.drawer h3{font-family:var(--f-disp);margin:0 0 8px}
.drawer ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.drawer li{display:grid;grid-template-columns:44px 1fr;font-size:13.5px}
.drawer li b{font-family:var(--f-px);font-size:11px;color:var(--gold)}
.tree{display:flex;flex-direction:column;gap:8px}
.gen{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:8px 10px;border:2px solid var(--line);background:#121a3a}
.gen .g{font-family:var(--f-px);font-size:11px;color:var(--gold)}
.gen .d{font-size:12.5px;color:var(--dim)}
.gen .sc{font-family:var(--f-disp);font-weight:700;font-size:18px;color:var(--gold2)}
.help{font-size:12px;color:var(--faint)}
/* สัญลักษณ์แทนตัวอักษร */
.ic{width:13px;height:13px;image-rendering:pixelated;vertical-align:-2px;margin:0 2px 0 0}
.ic.big{width:18px;height:18px;vertical-align:-4px}
.ic.huge{width:34px;height:34px}
.fx{white-space:nowrap;font-family:var(--f-px);font-size:11.5px;margin-right:4px}
.fx.up{color:var(--good)} .fx.dn{color:var(--bad)}
.chip{display:flex;align-items:center;gap:2px}
.chip .arw{font-size:9px;margin-left:3px}
.lines{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lines li{color:var(--dim);padding-left:16px;position:relative}
.lines li::before{content:"";position:absolute;left:2px;top:.6em;width:6px;height:6px;background:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.tile{background:#101836;border:2px solid var(--line);padding:8px 10px;display:grid;grid-template-columns:auto 1fr;gap:0 8px;align-items:center;min-width:0}
.tile .ic{grid-row:1/4}
.tile .lab{font-size:11.5px;color:var(--faint)}
.tile b{font-family:var(--f-disp);font-size:17px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.tile b.neg{color:var(--bad)} .tile b.pos{color:var(--good)}
.tile .note{font-size:11.5px;color:var(--gold2);grid-column:2}
.tile .meter{grid-column:1/3;height:4px;background:#0a0f24;margin-top:5px;position:relative}
.tile .meter i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;align-items:end;padding:10px 6px 4px;border:2px solid var(--line);background:#0e1532}
.rung{display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;opacity:.55}
.rung.me{opacity:1}
.rung .pc{font-family:var(--f-px);font-size:10px;color:var(--dim)}
.rung .col{width:100%;max-width:34px;height:70px;position:relative;background:#0a0f24}
.rung .col i{position:absolute;left:0;right:0;bottom:0;background:#4b5a99}
.rung.me .col i{background:var(--gold);box-shadow:0 0 0 2px var(--gold2)}
.rung .cn{display:flex;flex-wrap:wrap;justify-content:center;max-width:42px;min-height:13px}
.rung .cn .ic{width:9px;height:9px;margin:0}
.rung .nm{font-size:10.5px;color:var(--faint);text-align:center;line-height:1.2}
.rung.me .nm{color:var(--gold2);font-weight:600}
.rung .you{position:absolute;top:-12px;font-family:var(--f-px);font-size:9px;background:var(--gold);color:#1a1205;padding:0 4px}
.money{display:flex;align-items:center;gap:12px;padding:8px 12px;border:2px solid #6b4f16;background:linear-gradient(90deg,#2a2210,#151f45)}
.money b{font-family:var(--f-disp);font-size:26px;color:var(--gold2);display:block;line-height:1.1}
.money span{font-size:12px;color:var(--dim)}
.statrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sb{display:flex;align-items:center;gap:5px;min-width:0}
.sb .bar{flex:1;height:6px;background:#0a0f24;border:1px solid var(--line);position:relative;min-width:20px}
.sb .bar i{position:absolute;inset:0 auto 0 0;background:var(--teal)}
.sb b{font-family:var(--f-px);font-size:11px}
.outcome{align-self:flex-start;font-family:var(--f-disp);font-weight:700;font-size:20px;padding:4px 14px;border:2px solid;display:flex;gap:8px;align-items:center}
.outcome.good{color:var(--good);background:rgba(56,224,123,.1)} .outcome.mid{color:var(--warn);background:rgba(255,207,77,.08)} .outcome.bad{color:var(--bad);background:rgba(255,77,109,.1)}
.legendgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 12px}
.legendgrid div{display:grid;grid-template-columns:auto 1fr;gap:0 6px;align-items:center}
.legendgrid .ic{grid-row:1/3}
.legendgrid b{font-family:var(--f-disp);font-size:14px}
.legendgrid span{font-size:11.5px;color:var(--faint)}
/* ---------- มือถือแนวตั้ง: HUD + จอเกมติดด้านบน แผงเลือกเลื่อนอยู่ข้างล่าง ---------- */
@media (max-width:640px){
  body{font-size:14.5px}
  #app{padding-block:0 18px;padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));gap:8px}
  .hud{padding:5px 8px;gap:2px 8px;box-shadow:none;border-width:0 0 2px;margin-inline:-8px;padding-top:max(5px, env(safe-area-inset-top, 0px))}
  .who{flex:1 1 100%;gap:8px}
  .who b{font-size:15px}
  .who .where{font-size:11.5px}
  .stats{gap:2px 9px;flex-wrap:nowrap;width:100%;justify-content:space-between}
  .stat{font-size:11px;gap:3px}
  .stat img{width:12px;height:12px}
  .stat .bar{width:22px;height:5px}
  .main{gap:10px}
  .main > section:first-child{background:var(--bg);padding-bottom:4px;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:10px;align-items:center}
  .main > section:first-child .screen{grid-column:1 / -1}
  .timeline{margin-right:14px}
  .under{margin-top:6px!important}
  #sndTxt{display:none}
  .screen{box-shadow:none;border-width:2px}
  .timeline{margin-top:6px;height:16px}
  .under{margin-top:2px}
  .simnote{display:none}
  .under{justify-content:flex-end}
  .linkbtn{padding:2px 8px;font-size:12px}
  .panel{padding:12px 12px 14px;box-shadow:none;scroll-margin-top:calc(var(--stickH, 0px) + 6px)}
  .panel h2{font-size:19px;line-height:1.35}
  .ch{padding:9px 11px}
}
@media (max-width:640px) and (min-height:600px){
  .hud{position:sticky;top:0;z-index:20}
  .main > section:first-child{position:sticky;top:var(--hudH, 0px);z-index:10}
}
@media (hover:none) and (pointer:coarse){ .kbd{display:none} }
@media (prefers-reduced-motion: reduce){ .chip,.led{animation:none} .ch,.stat{transition:none} }
</style>
<div id="app">
  <header class="hud" id="hud" hidden>
    <div class="who"><b id="hName">—</b><span class="age" id="hAge"></span><span class="where" id="hWhere"></span></div>
    <div class="stats" id="hStats"></div>
  </header>
  <div class="main">
    <section>

function fx(p, d){
  const shown = [];
  for(const k of ['H','J','S','C']){ if(d[k]){ const before = p[k]; p[k] = clamp(p[k] + d[k], 0, 100); const real = p[k]-before; if(real) shown.push([k, real]); } }
  if(d.K){ p.K = clamp(p.K + d.K, -100, 100); }
  if(d.m){ addMoney(p, d.m); shown.push(['฿', d.m]); }
  if(p.io && shown.length) p.io.chips(shown);
  return shown;
}
function fxText(d, hideK = true){
  const out = [];
  for(const k of ['H','J','S','C']) if(d[k]) out.push(k + (d[k]>0?'+':'−') + Math.abs(d[k]));
  if(d.K && !hideK) out.push('K' + (d.K>0?'+':'−') + Math.abs(d.K));
  if(d.m) out.push('฿' + (d.m>0?'+':'−') + baht(Math.abs(d.m)));
  return out.join(' ');
}
function totalDebt(p){ return p.debt.f + p.debt.k + p.debt.i; }
function formalLimit(p){ return p.q <= 1 ? 200000 : 50000000; }
function addMoney(p, amt){
  p.money += amt;
  if(p.money < 0){
    const short = -p.money; p.money = 0;
    const room = Math.max(0, formalLimit(p) - p.debt.f);
    const f = Math.min(room, short); p.debt.f += f; p.debt.i += short - f;
  }
}
function canLoan(p, cost){ return p.debt.f + Math.max(0, cost - p.money) <= formalLimit(p); }
function hhIncome(p){ // รายได้ครัวเรือนต่อเดือน
  if(p.age < 22 && !p.career) return QS[p.q].inc;
  let m = p.career ? curIncome(p) : 0;
  if(p.spouse && !p.spouse.separated) m += p.spouse.income;
  if(p.age >= 60) m = p.retireIncome + (p.spouse && !p.spouse.separated ? p.spouse.income*0.3 : 0);
  return Math.max(m, 1);
}
function monthsOf(p, cost){ return Math.round(cost / Math.max(hhIncome(p), 1)); }
function note(p, text, d){ p.pend.push({ text, d }); log(p, text); }
function log(p, text){ p.log.push({ age: p.age, text }); }
function tagBad(p, type, label, amount = 0){ p.tagsBad.push({ type, label, amount, age: p.age }); }
function tagGood(p, type, label){ p.tagsGood.push({ type, label, age: p.age }); }
function stOn(p, s){ p.status[s] = true; } function stOff(p, s){ delete p.status[s]; }

function M(p){ return 0.3*(p.S-50) + 0.2*(p.C-50) + 0.05*p.K; }
function roll3(p, [g, m, b], adj = {}){
  const mm = M(p);
  let G = clamp(g + mm + (adj.g||0), 5, 85), B = clamp(b - 0.5*mm + (adj.b||0), 5, 85);
  let Mi = clamp(100 - G - B, 5, 85); const s = G + B + Mi; const r = rnd()*s;
  return r < G ? 'good' : r < G + Mi ? 'mid' : 'bad';
}
const OUT_TH = { good:'ดี', mid:'กลาง', bad:'แย่' };

// ===== ตัวช่วยการตัดสินใจ =====
// choice: { label, sub, cost, cond, condText, loan('bank'|'kys'|false), run }
function prepChoices(p, list){
  return list.map(c => {
    const cost = c.cost || 0; const r = { ...c, cost, disabled: false, lock: null, loanNote: null };
    if(c.cond === false){ r.disabled = true; r.lock = c.condText || 'ไม่ผ่านเงื่อนไข'; return r; }
    if(cost > p.money){
      const short = cost - p.money;
      if(c.loan === 'kys'){ r.loanNote = `กู้ กยศ. ${baht(short)} (1%/ปี)`; }
      else if(c.loan !== false && canLoan(p, cost)){ r.loanNote = `กู้ ${baht(short)} (7%/ปี)`; }
      else { r.disabled = true; r.lock = `= ${monthsOf(p,cost).toLocaleString()} เดือนของรายได้บ้านคุณ`; }
    }
    return r;
  });
}
function spend(p, cost, kind){
  if(cost <= 0) return;
  if(cost > p.money && kind === 'kys'){ const short = cost - p.money; p.debt.k += short; p.money += short; }
  addMoney(p, -cost);
}
async function choose(p, io, opt){
  const choices = prepChoices(p, opt.choices);
  if(!choices.some(c => !c.disabled)) choices[choices.length-1].disabled = false; // กันเกมค้าง
  const head = p.evHead; p.evHead = null;
  const idx = await io.ask({ ...opt, choices, pend: p.pend.splice(0), head });
  const c = choices[idx];
  if(!c.defer) spend(p, c.cost, c.loan);
  if(c.run) await c.run();
  return c;
}
async function yesno(p, io, opt){ // opt: {title, text, cost, sub, yes, no, cond, condText, loan}
  const c = await choose(p, io, { ...opt, kind: opt.kind || 'minor', choices: [
    { label: opt.yes || 'ทำ', sub: opt.sub, cost: opt.cost || 0, cond: opt.cond, condText: opt.condText, loan: opt.loan === undefined ? false : opt.loan, yes: true },
    { label: opt.no || 'ไม่ทำ', sub: opt.noSub || '', cost: 0, yes: false },
  ]});
  return c.yes;
}
async function say(p, io, opt){ await io.say({ ...opt, pend: p.pend.splice(0) }); }

// ===== กระโดดเวลา =====
function curIncome(p){ // รายได้ส่วนตัวต่อเดือนก่อนตัวคูณ
  if(!p.career || p.unemployed > 0) return 0;
  const C = CAREERS[p.career];
  const cap = p.cOut ? C.caps[p.cOut] : C.caps.mid;
  let base = C.start * Math.pow(1 + C.grow, p.cYears);
  if(p.career === 'biz' && p.cOut === 'mid') base = 35000;
  if(p.career === 'influ' && p.cOut === 'mid') base = 25000;
  return Math.min(base, cap) * p.incomeBoost * (p.eduBoost || 1) * (1 - p.incomeCut);
}
function skillMult(p){ return clamp(1 + 0.01*(p.S - 50), 0.7, 1.4); }
function saveRate(p){
  let s = p.age >= 22 ? .15 : QS[p.q].save;
  if(!p.spouse || p.spouse.separated) s += .05;
  s -= .05 * p.kids.filter(k => !k.left).length;
  if(p.house && p.house.years < 25) s -= .10;
  if(p.flags.noKids) s += .10;
  if(p.flags.spousePays) s += .15;
  s += [ .10, 0, -.15 ][p.lifestyle];
  return clamp(s, -.3, .6);
}
async function years(p, io, n, opts = {}){
  const bars = []; const startAge = p.age; const notes = [];
  for(let y = 0; y < n; y++){
    p.age++;
    // สุขภาพตามวัย
    if(p.age > 70) p.H -= 2; else if(p.age > 50) p.H -= 1; else if(p.age > 40 && p.age % 2) p.H -= 1;
    if(p.status.chronic){ p.H -= 1; addMoney(p, -6000); }
    const newDz = habitYear(p);
    if(p.status.bullied && p.age <= 18) p.J -= 3;
    if(p.status.depressed){ p.J -= 3; }
    if(p.status.dementia){ p.J -= 3; }
    if(p.status.grief){ p.J -= 2; p.status.grief--; if(p.status.grief <= 0) delete p.status.grief; }
    if(p.status.druggedKid){ p.J -= 5; addMoney(p, -30000); }
    if(p.status.prison > 0){ p.status.prison--; if(p.status.prison <= 0) stOff(p,'prison'); }
    p.H = clamp(p.H, 0, 100); p.J = clamp(p.J, 0, 100);
    let income = 0, net = 0, rec = false;
    if(p.age <= 18){ // วัยเรียน เงินครอบครัว
      if(p.q === 0) net += 4000;
      if(p.school === 'rural') net -= 2500;
      addMoney(p, net);
    } else if(p.age <= 22 && !p.career){
      net = p.flags.uniIncome || 0; addMoney(p, net);
    } else if(p.age < 60){
      rec = chance(.10);
      if(p.status.prison) { income = 0; }
      else if(p.career){
        const C = CAREERS[p.career];
        let m = curIncome(p) * skillMult(p) * Math.max(0, 1 + C.sig*gauss()) * (rec ? 1 - .3*C.sens : 1);
        if(p.career === 'farm' && p.cOut === 'bad' && chance(1/3)) m = -0.2*C.start;
        if(p.career === 'farm' && p.flags.rentLand) m *= .8;
        income = m * 12;
        if(p.unemployed > 0){ p.unemployed--; income = 0; }
        p.cYears++;
        if(income > 0) p.lastSalary = income/12;
      }
      const spouse = (p.spouse && !p.spouse.separated) ? p.spouse.income * 12 * (rec ? .9 : 1) : 0;
      if(p.spouse && !p.spouse.separated) p.spouse.income *= 1.02;
      const hh = income + spouse;
      net = hh * saveRate(p);
      if(hh > 0 && hh/12 < 10000) net += 4000; // บัตรสวัสดิการแห่งรัฐ
    } else { // เกษียณ
      const costM = 9000 * (p.flags.homeTown ? .8 : 1) + (p.flags.residenceCost || 0);
      const inc = p.retireIncome + (p.flags.shopIncome || 0) + p.kidMoney;
      income = inc * 12; net = (inc - costM) * 12;
    }
    // ค่าใช้จ่ายประจำ
    for(const a of p.annual){ if(p.age > a.from && p.age <= a.to) net -= a.amt; }
    if(p.lottery && p.age < 60) net -= 1920;
    if(p.age > 18){
      // ดอกเบี้ย
      const interest = p.debt.f*.07*(p.flags.restructured?3/7:1) + p.debt.k*.01 + p.debt.i*.20;
      p.debt.f *= 1 + (p.flags.restructured ? .03 : .07); p.debt.k *= 1.01; p.debt.i *= 1.20;
      if(p.age >= 22) {
        if(p.age >= 60 && p.money + net < 0){ net = -p.money; p.J = clamp(p.J - 10, 0, 100); if(!p.flags.broke){ p.flags.broke = true; note(p, 'เงินเก็บหมดแล้ว ต้องอยู่ด้วยเบี้ยยังชีพ ความสุขลดลงทุกปีที่ขาด'); } }
        addMoney(p, net);
        // ใช้หนี้ด้วยเงินที่มี (เก็บสำรองไว้ 6 เดือนของรายจ่าย)
        const reserve = Math.max(0, hhIncome(p) * 6 * (1 - saveRate(p)));
        let avail = Math.max(0, p.money - reserve);
        for(const k of ['i','f','k']){ const pay = Math.min(avail, p.debt[k]); p.debt[k] -= pay; p.money -= pay; avail -= pay; }
        // หนี้ล้นตัว
        if(interest > Math.max(net,0) && totalDebt(p) > 50000){ p.flags.spiral = (p.flags.spiral||0) + 1; } else p.flags.spiral = 0;
      }
    }
    if(p.house) { p.house.years++; p.house.value *= 1.02; }
    if(p.status.bankrupt){ p.status.bankrupt--; if(p.status.bankrupt <= 0){ stOff(p,'bankrupt'); p.debt = { f:0, k:0, i:0 }; note(p,'ครบ 3 ปี ศาลปลดคุณจากการล้มละลาย หนี้เก่าถูกล้าง'); } }
    bars.push({ age: p.age, net, income, rec });
    // บัญชีกรรม: ลางร้าย
    if(p.K < -30 && chance(.15) && !opts.quiet) notes.push(pickOne(OMENS));
    if(p.H <= 0){ p.bars = bars; await showSkip(p, io, startAge, bars, notes, opts); throw new Death(healthDeathCause(p)); }
    if(newDz){ await showSkip(p, io, startAge, bars.splice(0), notes.splice(0), opts); await diseaseOnset(p, io, newDz); }
    if(p.lifespan && p.age >= p.lifespan){ p.bars = bars; await showSkip(p, io, startAge, bars, notes, opts); throw new Death('จากไปอย่างสงบตามอายุขัย'); }
    // เหตุการณ์ตามกำหนด (พ่อแม่เสียชีวิต)
    if(p.parentDeath && !p.parentDeath.done && p.age >= p.parentDeath.age){
      await showSkip(p, io, startAge, bars.splice(0), notes.splice(0), opts);
      p.parentDeath.done = true; await parentDies(p, io);
    }
    if(p.flags.spiral >= 2){ p.flags.spiral = 0; await showSkip(p, io, startAge, bars.splice(0), notes.splice(0), opts); await debtSpiral(p, io); }
  }
  // J ค่อย ๆ กลับเข้าหาค่าฐาน
  p.J = clamp(Math.round(p.J + (p.Jbase - p.J) * 0.3 * Math.min(1, n/5)), 0, 100);
  // ร่างกายวัยหนุ่มสาวฟื้นตัวได้บ้าง (ยกเว้นโรคเรื้อรัง)
  if(p.age < 55 && !p.status.chronic){ const base = TIERS[p.tier].H; if(p.H < base) p.H += (base - p.H) * 0.2 * Math.min(1, n/5); }
  p.H = Math.round(p.H);
  await showSkip(p, io, startAge, bars, notes, opts);
}
async function showSkip(p, io, startAge, bars, notes, opts){
  if(!bars.length) return;
  p.samples.J.push(p.J); p.samples.H.push(p.H);
  if(opts.silent || (bars.length < 3 && !notes.length)) { io.update(p); return; }
  await io.skip({ from: bars[0].age - 1, to: p.age, bars, notes, p, pend: p.pend.splice(0) });
}
async function runBeats(p, io, beats, endAge, opts = {}){
  beats.sort((a,b) => a.age - b.age);
  for(const b of beats){
    if(b.age > endAge) continue;
    if(b.age > p.age) await years(p, io, b.age - p.age, opts);
    await b.run();
  }
  if(endAge > p.age) await years(p, io, endAge - p.age, opts);
}

// ===== event สุ่ม =====
function drawEvents(p, pool, n = 2){
  const avail = pool.filter(e => e.w(p) !== null);
  const out = [];
  while(out.length < n && avail.length){
    const e = wpick(avail, x => Math.max(1, x.w(p)));
    out.push(e); avail.splice(avail.indexOf(e), 1);
  }
  return out;
}
function evBeat(p, io, e, age){ return { age, run: async () => { await runEvent(p, io, e); } }; }
async function runEvent(p, io, e){
  if(e.w && e.w(p) === null) return;
  p.evHead = { title: typeof e.title === 'function' ? e.title(p) : e.title, text: e.text ? e.text(p) : '', bg: e.bg };
  log(p, p.evHead.title);
  await e.run(p, io);
  if(p.evHead){ const h = p.evHead; p.evHead = null; await say(p, io, { kind:'event', bg:h.bg, title:h.title, text:h.text }); }
}

// ===== ทางแยกร่วม =====
async function seriousIllness(p, io, lost, who = 'คุณ'){
  const isKid = who !== 'คุณ';
  const privCost = isKid ? 500000 : (p.age >= 60 ? 800000 : 500000);
  const ins = (isKid && p.flags.kidInsurance) ? .2 : (p.insurance ? .3 : (p.career === 'gov' && p.age >= 22 ? .2 : 1));
  const govBonus = (p.career === 'gov') ? 10 : 0; const far = (p.tier >= 5) ? -10 : 0;
  const c = await choose(p, io, { kind:'fork', bg:'hospital', title: isKid ? 'ลูกป่วยหนัก ต้องเลือกวิธีรักษา' : 'ป่วยหนัก ต้องเลือกวิธีรักษา',
    text: 'ผลการรักษาสุ่มตามโรงพยาบาลที่เลือก',
    choices: [
      { label:'รพ.รัฐตามสิทธิบัตรทอง', sub:'หายดี 45% · หายบางส่วน 40%', cost: 10000, loan:false, odds:[45+govBonus+far,40,15-govBonus-far] },
      { label:'รพ.เอกชน', sub: ins < 1 ? `ประกันจ่ายให้ ${Math.round((1-ins)*100)}% · หายดี 70%` : 'หายดี 70% · หายบางส่วน 25%', cost: Math.round(privCost*ins), odds:[70,25,5] },
      { label:'รักษาตามมีตามเกิด / ยาสมุนไพร', sub:'J−5 · หายดี 15%', cost: 0, odds:[15,45,40], j:-5 },
    ]});
  if(c.j) fx(p, { J: c.j });
  const r = rnd()*100; const [a,b] = c.odds;
  if(isKid){
    if(r < a){ note(p, 'ลูกหายดีกลับมาวิ่งเล่นได้'); }
    else if(r < a+b){ note(p, 'ลูกหายบางส่วน ต้องดูแลต่อเนื่อง ค่ายาปีละ 6,000'); p.annual.push({ from:p.age, to:p.age+10, amt:6000 }); }
    else { note(p, 'อาการลูกแย่ลง'); fx(p, { J:-10 }); }
    return;
  }
  if(r < a){ fx(p, { H: Math.round(lost/2) }); note(p, 'รักษาหายดี ได้สุขภาพคืนมาครึ่งหนึ่ง'); }
  else if(r < a+b){ stOn(p,'chronic'); p.Jbase = Math.max(0, p.Jbase-5); note(p, 'หายบางส่วน ติดสถานะโรคเรื้อรัง H−2 และค่ายา 6,000 ทุกปี'); }
  else { fx(p, { H:-10 }); note(p, 'อาการแย่ลง'); if(chance(p.age >= 60 ? .10 : .05) || p.H <= 0) throw new Death('เสียชีวิตจากอาการป่วยหนัก'); }
}
async function debtSpiral(p, io){
  const td = totalDebt(p);
  const c = await choose(p, io, { kind:'fork', bg:'bank', title:'หนี้ล้นตัว', text:`ดอกเบี้ยแต่ละปีมากกว่าเงินที่เก็บได้ 2 ปีติดกัน หนี้ตอนนี้ ฿${baht(td)}`, choices: [
    { label:'เข้าคลินิกแก้หนี้ / ปรับโครงสร้างหนี้', sub:'หนี้ในระบบเหลือดอก 3% · C−3', cost:0, k:'clinic' },
    { label:'ขายทรัพย์สิน', sub: p.house ? `ได้ 60% ของมูลค่าบ้าน · J−10` : 'ไม่มีทรัพย์สินให้ขาย', cost:0, cond: !!(p.house || p.car), condText:'ไม่มีบ้านหรือรถ', k:'sell' },
    { label:'ยื่นล้มละลาย', sub:'หนี้ถูกล้างหลัง 3 ปี · C−15 J−15', cost:0, cond: td > 1000000, condText:'ต้องมีหนี้เกิน 1 ล้านบาท', k:'bk' },
    { label:'หนีหนี้', sub:'ไม่เสียอะไรทันที', cost:0, k:'flee' },
  ]});
  if(c.k === 'clinic'){ p.flags.restructured = true; fx(p,{ C:-3 }); note(p,'เข้าคลินิกแก้หนี้ ดอกเบี้ยลดเหลือ 3% ต่อปี'); }
  if(c.k === 'sell'){ let got = 0; if(p.house){ got += p.house.value*.6; p.house = null; } if(p.car){ got += 150000; p.car = false; } addMoney(p, got); for(const k of ['i','f','k']){ const pay=Math.min(p.money,p.debt[k]); p.debt[k]-=pay; p.money-=pay; } fx(p,{ J:-10 }); note(p,`ขายทรัพย์สินได้ ฿${baht(got)} นำไปใช้หนี้`); }
  if(c.k === 'bk'){ p.status.bankrupt = 3; fx(p,{ C:-15, J:-15 }); if(p.career==='gov'){ p.career='factory'; p.cOut='mid'; p.cYears=0; note(p,'ข้าราชการที่ล้มละลายต้องออกจากราชการ'); } note(p,'ยื่นล้มละลาย อีก 3 ปีหนี้จะถูกล้าง'); }
  if(c.k === 'flee'){ fx(p,{ K:-10 }); tagBad(p,'debtflee','หนีหนี้', td); p.flags.fled = true; note(p,'คุณเลือกหนีหนี้ หนี้ยังโตต่อเงียบ ๆ'); }
}
async function offerDeed(p, io){
  if(p.status.prison) return;
  const opts = DEEDS.filter(d => p.age >= d.min && p.age <= d.max && !p.deeds[d.id] && (!d.careers || d.careers.includes(p.career)) && (!d.needIncome || p.career));
  if(!opts.length) return;
  const d = pickOne(opts);
  const yes = await yesno(p, io, { kind:'deed', bg: p.age < 18 ? 'school' : 'home', title:'โอกาสทำความดี', text: d.label, sub: d.costText, cost: d.cost || 0, yes: d.yes || 'ทำ', no: d.no || 'ผ่านไป' });
  if(!yes) return;
  p.deeds[d.id] = true;
  const ctx = {};
  if(d.fx) fx(p, d.fx);
  if(d.incomeCut) p.incomeCut += d.incomeCut;
  fx(p, { K: d.K }); tagGood(p, d.tag, d.label);
  if(d.run) d.run(p, ctx);
  if(d.risk && chance(d.risk)){ note(p, 'คุณบาดเจ็บระหว่างช่วยเหลือผู้ประสบภัย'); fx(p,{ H:-20 }); await seriousIllness(p, io, 20); }
  note(p, ctx.note || 'คุณเลือกทำ แม้จะไม่ได้อะไรกลับมาในตอนนี้');
}
async function lifestyleChoice(p, io){
  if(p.status.prison) return;
  const hh = hhIncome(p);
  const c = await choose(p, io, { kind:'life', bg:'home', title:'ช่วงนี้ใช้ชีวิตแบบไหน', text:`รายได้ครัวเรือนราว ฿${baht(hh)}/เดือน`, choices: [
    { label:'ประหยัด', sub:'ออมเพิ่ม 10%', v:0 },
    { label:'ปกติ', sub:'ออมตามปกติ', v:1 },
    { label:'หรูหรา', sub:'ออมลด 15% · ความสุขเพิ่มแบบลดหลั่น', v:2 },
  ]});
  p.lifestyle = c.v;
  const spendM = hh * (1 - saveRate(p));
  const dj = Math.round(4 * Math.log(Math.max(spendM, 1000) / 10400));
  if(dj) fx(p, { J: dj });
}

function famDebtTick(p){ if(p.famDebt > 0){ const eat = Math.min(p.famDebt, p.start*.05); p.money = Math.max(0, p.money - eat); p.famDebt -= eat; } }
function distinctAges(n, a, b){ const s = new Set(); let guard = 0; while(s.size < n && guard++ < 50) s.add(randi(a, b)); return [...s]; }
function refundSchool(p){ const yrsLeft = Math.max(0, 18 - p.age); const r = Math.round(p.schoolPaid * yrsLeft / 12); p.schoolPaid = 0; p.school = 'rural'; return r; }

async function birth(p, io){
  const T = TIERS[p.tier], Q = QS[p.q];
  const provPct = T.prov.find(x => x[0] === p.prov)[1];
  const lines = [];
  if(p.gen > 1 && p.family){
    lines.push(`คุณเกิดเป็นลูกของ${p.family.parentName} (รุ่นที่ ${p.gen - 1}) ที่${p.prov}`);
  } else {
    lines.push(`คุณเกิดที่${p.prov} โอกาสเกิดที่นี่ ${provPct.toFixed(2)}%`);
  }
  lines.push(`${p.sex==='M'?'เพศชาย':'เพศหญิง'} · ศาสนา${p.religion}`);
  lines.push(`ครอบครัว${Q.name} (${Q.code}) รายได้บ้านราว ฿${baht(Q.inc)}/เดือน${p.gen===1 ? ` · ในกลุ่ม${T.name} มีโอกาสเกิดฐานะนี้ ${T.q[p.q]}%` : ''}`);
  lines.push(p.skipGen ? 'พ่อแม่ไปทำงานต่างถิ่น คุณโตมากับปู่ย่า' : 'พ่อแม่เลี้ยงคุณเอง');
  lines.push(`เงินที่ครอบครัวพร้อมทุ่มให้คุณตลอดวัยเรียน ฿${baht(p.money)}`);
  await say(p, io, { kind:'birth', bg:'birth', title: p.gen === 1 ? `คุณคือ 1 ใน ${POP_TOTAL.toLocaleString('en-US')} คน` : `รุ่นที่ ${p.gen}: ${p.name}`, text: lines.join('\n'), name: p.name,
    birth: { prov:p.prov, provPct, sex:p.sex, religion:p.religion, tierName:T.name, tierQ:T.q, q:p.q, inc:Q.inc, skip:p.skipGen, money:p.money, stats:{ H:p.H, J:p.J, S:p.S, C:p.C }, gen:p.gen, parent: p.family && p.family.parentName } });
  log(p, `เกิดที่${p.prov} ครอบครัว${Q.name}`);
  await years(p, io, 6, { silent: true });
}

  }});

  const c = await choose(p, io, { kind:'fork', bg:'court', title:'จะสู้คดียังไง', choices:[

    { label:'รับสารภาพ', sub:`ติดคุก ${sev} ปี J−20 C−10`, k:'confess' },
    { label:'ใช้เส้นช่วย', sub:'ต้องมี C 60 ขึ้นไป · หลุด 70%', cost:100000, cond:p.C>=60, condText:'C ต้องถึง 60', k:'line' } ]});
  let jailed = 0;
  const jail = (y, d) => { jailed = y; p.flags.restricted = true; p.status.prison = y; p.unemployed = Math.max(p.unemployed, y); fx(p, d); p.Jbase = Math.max(0,p.Jbase-10); if(p.career==='gov'){ p.flags.noPension = true; p.career = 'factory'; p.cOut='mid'; p.cYears=0; } note(p, `ติดคุก ${y} ปี`); };
  if(c.k==='fight'){ if(chance(clamp(40+0.3*(p.C-50),5,95)/100)) note(p,'ศาลยกฟ้อง คุณกลับไปทำงานเดิมได้'); else jail(3*sev, {J:-30,C:-20}); }
  if(c.k==='confess'){ jail(sev, {J:-20,C:-10}); if(['gov','office'].includes(p.career)){ p.career='factory'; p.cOut='mid'; p.cYears=0; } }
  if(c.k==='line'){ fx(p,{K:-10}); tagBad(p,'corrupt','ใช้เส้นช่วยคดี',100000); if(chance(.7)) note(p,'คดีเงียบหายไป'); else jail(5*sev, {J:-30,C:-20}); }
  if(jailed){ log(p, `ติดคุก ${jailed} ปี`); await say(p, io, { kind:'event', bg:'prison', title:`ติดคุก ${jailed} ปี`, text:'ชุดสีฟ้า เลขประจำตัว และห้องขังรวมกับอีก 40 คน\nหลังพ้นโทษ งานราชการ บริษัท และงานต่างประเทศจะปิดประตูใส่คุณ' }); }
}

function careerChoices(p, exclude = []){
  const land = p.q >= 3 || p.tier === 4 || p.tier === 5;
  return Object.entries(CAREERS).map(([k, C]) => {
    let cond = !exclude.includes(k), condText = 'เพิ่งออกจากอาชีพนี้';
    if(C.needDegree && !p.degree){ cond = false; condText = 'ต้องจบปริญญา'; }
    if(C.maxAge && p.age > C.maxAge){ cond = false; condText = 'อายุเกิน 40'; }
    if(p.flags.restricted && ['gov','office','abroad'].includes(k)){ cond = false; condText = 'มีประวัติติดคุก'; }
    if(p.status.bankrupt && k==='abroad'){ cond = false; condText = 'ล้มละลาย ไปต่างประเทศไม่ได้'; }
    let cost = C.cost; if(k==='biz' && p.flags.bizFree) cost = 0;
    const inc = `฿${bahtS(C.start)}→${bahtS(C.caps.good)}/เดือน`;
    let sub = inc + (k==='gov' ? ` · สอบติด ${clamp(Math.round(20+0.5*(p.S-50)+0.3*(p.C-50)+(p.degree==='top'?10:0)),3,95)}%` : '') + (k==='farm' && !land ? ' · ต้องเช่าที่ (−20%)' : '');
    return { label:C.name, sub, cost, cond, condText, k };
  });
}
async function enterCareer(p, io, opts = {}){
  let exclude = opts.exclude || [];
  while(true){
    const c = await choose(p, io, { kind:'main', bg:'city', title: opts.title || 'เลือกอาชีพ', text: opts.text || 'อาชีพกำหนดรายได้ทั้งชีวิตและสิทธิหลังเกษียณ', choices: careerChoices(p, exclude) });
    if(c.k === 'gov'){
      const pr = clamp(20+0.5*(p.S-50)+0.3*(p.C-50)+(p.degree==='top'?10:0)-(p.flags.juvenile?20:0), 3, 95)/100;
      if(!chance(pr)){ note(p, p.flags.juvenile ? 'สอบ ก.พ. ไม่ติด ประวัติสถานพินิจตอนเด็กทำให้ผ่านสัมภาษณ์ยาก' : 'สอบ ก.พ. ไม่ติด'); exclude = [...exclude, 'gov']; continue; }
    }
    p.career = c.k; p.cYears = 0; p.cOut = null; p.cStartAge = p.age; p.unemployed = 0; p.incomeBoost = 1; p.flags.cAdj = 0; p.flags.cBad = 0;
    const C = CAREERS[c.k]; fx(p, C.fx);
    const sd = seedFor(p, c.k); if(sd){ p.flags.cAdj = sd.adj; p.flags.seedWhy = sd.why; note(p, `${sd.why}ช่วยให้คุณเริ่มต้นได้ดีกว่าคนอื่น (โอกาสผลดี +${sd.adj}%)`); } else p.flags.seedWhy = null;
    if(c.k === 'farm' && !(p.q >= 3 || p.tier === 4 || p.tier === 5)) p.flags.rentLand = true;
    if(c.k === 'abroad') p.flags.abroadEnd = p.age + 5;
    if(p.flags.stayAbroad && c.k !== 'abroad') p.incomeBoost *= 2, p.flags.stayAbroad = false;
    if(c.k === 'biz' && opts.capital !== undefined && opts.capital < 500000) p.flags.cBad = (p.flags.cBad||0) + 10;
    log(p, `เริ่มอาชีพ${C.name}`);
    return c.k;
  }
}
async function careerOutcome(p, io){
  if(!p.career || p.cOut) return;
  const C = CAREERS[p.career];
  const o = roll3(p, C.odds, { g: p.flags.cAdj||0, b: p.flags.cBad||0 }); p.cOut = o;
  await say(p, io, { kind:'result', bg:C.bg, title:`${C.name}: ผลลัพธ์${OUT_TH[o]}`, text:C.outText[o] + (o==='good' && p.flags.seedWhy ? `\n${p.flags.seedWhy}ที่สะสมมาช่วยได้มาก` : ''), outcome:o });
  log(p, `${C.name} ผล${OUT_TH[o]}`);
  if(p.career==='farm' && o==='good') fx(p,{J:5});
  if(p.career==='factory' && o==='bad') p.unemployed = 2;
  if(p.career==='office' && o==='bad') p.flags.layoff45 = true;
  if(p.career==='biz' && o==='good' && p.flags.branch) p.incomeBoost *= 1.8;
  if(p.career==='biz' && o==='bad') await bizFail(p, io);
  if(p.career==='influ' && o==='good') fx(p,{C:30});
  if(p.career==='influ' && o==='bad') await layoffFork(p, io, false, true);
}

async function runBeatsWithLater(p, io, beats, endAge){

    beats.sort((a, b) => a.age - b.age);
    const b = beats.shift(); if(!b || b.age > endAge) break;
    if(b.age > p.age) await years(p, io, b.age - p.age);

      if(t.type==='selfillegal') eff = 'กลายเป็นเรื่องเล่าในครอบครัวที่ไม่มีใครอยากพูดถึง';
      if(t.type==='debtflee') eff = 'เจ้าหนี้ตามทวงจากกองมรดก';

  const Jbar = p.samples.J.length ? p.samples.J.reduce((s,v)=>s+v,0)/p.samples.J.length : p.J;
  const Hbar = p.samples.H.length ? p.samples.H.reduce((s,v)=>s+v,0)/p.samples.H.length : p.H;

  const result = { name:p.name, sex:p.sex, gen:p.gen, prov:p.prov, tier:p.tier, q:p.qBirth, qEnd: incomeToQ(Math.max(1, p.lastSalary + (p.spouse?p.spouse.income:0))), religion:p.religion,

    Jbar, Hbar, Pw, score, kvPenalty, epilogueJ, funeral:F.label, kids:p.kids.map(k=>({...k})), anyFruit: goodTypesFruited.size>0, tagsBad:p.tagsBad.length, tagsGood:p.tagsGood.length };
  result.qEnd = Math.max(result.qEnd, incomeToQ(heirsEstate/216/.12));
  if(io.funeral) await io.funeral(result, p);
  return result;
}

// ---------- ชีวิตทั้งชีวิต ----------
async function live(p, io){
  Object.defineProperty(p, 'io', { value: io, enumerable:false, writable:true });
  try {
    await birth(p, io); await stage1(p, io); await stage2(p, io); await stage3(p, io); await stage6(p, io);
  } catch(e){ if(!(e instanceof Death)) throw e; p.dead = true; p.cause = e.cause; }
  p.dead = true;
  return await stage7(p, io);
}

// สร้างรุ่นถัดไป
function makeChild(p, res, kidIdx){
  const kid = p.kids[kidIdx];
  const q = incomeToQ(kid.hhInc);
  const nKids = p.kids.length;
  const share = Math.round(res.heirsEstate / (nKids + (p.spouse ? 1 : 0)));
  const anc = { name:p.name, gen:p.gen, prov:p.prov, q:p.qBirth, career:res.career, age:p.age, score:Math.round(res.score), pct:res.pct, fruits:Object.keys(res.fruits), erupted:res.ledger.filter(l=>!l.good&&l.erupt).length, ssTier:p.flags.ssTier||0 };
  return newPlayer({ tier:p.tier, prov:p.prov, q, religion:p.religion, sex:kid.sex, name:kid.name, gen:p.gen+1,
    money: QS[q].start + (p.flags.kidInsurance ? 300000 : 0), famDebt: Math.min(kid.debtAt, 2000000), skipGen: !!p.flags.grandRaise,
    Jbonus: Math.round((clamp(kid.kv - res.kvPenalty,0,100) - 50)/5), Sbonus: res.fruits.edu ? 10 : 0, Cbonus: (res.fruits.honest ? 10 : 0) - (res.kvPenalty ? 10 : 0),
    family: { parentName: p.name }, ancestors: [...p.ancestors],
    parentDeath: { age: p.age - kid.born, name: p.name, ageAtDeath: p.age, share, anc, familyFruit: !!res.fruits.family },
    extra: { flags: { ssTier: p.flags.ssTier || 0 } } });
}

// ===== Sim IO สำหรับจำลองชีวิตเปรียบเทียบ =====
const SimIO = {
  ask: async o => { const ok = o.choices.map((c,i)=>c.disabled?-1:i).filter(i=>i>=0); return ok[Math.floor(rnd()*ok.length)]; },
  say: async () => {}, skip: async () => {}, chips: () => {}, update: () => {},
  multi: async o => o.items.map((c,i)=>(!c.disabled && rnd()<.35)?i:-1).filter(i=>i>=0),
};
async function simulateLives(n, onDone){
  const scores = [];
  for(let i = 0; i < n; i++){
    try { const r = await live(newPlayer(), SimIO); scores.push(r.score); } catch(e){ /* ข้ามชีวิตที่พัง */ }
    if(i % 5 === 4) await new Promise(r => setTimeout(r, 0));
  }
  scores.sort((a,b)=>a-b);
  if(onDone) onDone(scores);
  return scores;
}
function percentile(scores, s){ if(!scores || scores.length < 20){ const z = (s - 48)/10; return clamp(Math.round(100/(1+Math.exp(-1.7*z))), 1, 99); } let c = 0; for(const v of scores) if(v < s) c++; return clamp(Math.round(c/scores.length*100), 1, 99); }
// ===== ความลึกของชีวิต: นิสัยสุขภาพ · ผลย้อนหลังจากวัยเด็ก · คุก · รวยมหาศาล =====

// ---------- นิสัยสุขภาพ ----------
function hab(p){ if(!p.hab) p.hab = { smoke:0, smokeFrom:0, smokeYrs:0, drink:0, drinkYrs:0, ex:0, exYrs:0, hFrac:0 }; return p.hab; }
const DISEASES = {
  hyper:   { name:'ความดันโลหิตสูง', chronic:true },
  diabetes:{ name:'เบาหวาน', chronic:true },
  lung:    { name:'มะเร็งปอด', chronic:false, lost:30 },
  liver:   { name:'ตับแข็ง', chronic:false, lost:25 },
  kidney:  { name:'ไตวายเรื้อรัง', chronic:true, lost:15 },
  heart:   { name:'หัวใจขาดเลือดเฉียบพลัน', chronic:false, lost:30 },
};
function hasDz(p, k){ return !!(p.dz && p.dz[k]); }
// เรียกทุกปีจาก years(): ผลสะสมของนิสัย + สุ่มโรค (คืนชื่อโรคที่เพิ่งเป็น)
function habitYear(p){
  const h = hab(p);
  if(h.smoke) h.smokeYrs++;
  if(h.drink === 2) h.drinkYrs++; else if(h.drink === 1) h.drinkYrs += .3;
  if(h.ex) h.exYrs++;
  let d = 0;
  if(h.smoke && p.age > 30) d -= .3;
  if(h.drink === 2 && p.age > 30) d -= .3;
  if(p.flags.ot && p.age > 30 && p.age < 60) d -= .3;
  if(h.ex && p.age > 25 && p.H < TIERS[p.tier].H + 10) d += .6;
  for(const k in (p.dz || {})){ const z = p.dz[k]; if(DISEASES[k].chronic) d -= z.care === 'ignore' ? 1.2 : z.care === 'diet' ? .3 : .6; }
  h.hFrac += d; const whole = h.hFrac > 0 ? Math.floor(h.hFrac) : Math.ceil(h.hFrac); p.H += whole; h.hFrac -= whole;
  for(const k in (p.dz || {})) if(DISEASES[k].chronic) addMoney(p, p.dz[k].care === 'ignore' ? 0 : -3000);
  if(p.age < 38) return null;
  const lux = p.lifestyle === 2 ? 1 : 0;
  const risk = {
    hyper:    .004 + .004*(p.flags.ot?1:0) + .003*(h.drink===2?1:0) + .002*h.smoke + .002*lux - .003*h.ex,
    diabetes: .0025 + .004*lux + .003*(h.ex?0:1) + .002*(h.drink>=1?1:0),
    lung:     h.smokeYrs >= 10 && p.age >= 45 ? .0003*h.smokeYrs : 0,
    liver:    h.drinkYrs >= 8 && p.age >= 40 ? .00025*h.drinkYrs : 0,
    kidney:   ((hasDz(p,'diabetes') && p.age - p.dz.diabetes.age >= 6) || (hasDz(p,'hyper') && p.age - p.dz.hyper.age >= 8)) ? .008 * (Object.values(p.dz).some(z=>z.care==='ignore') ? 2 : 1) : 0,
    heart:    p.age >= 45 ? .001 + .003*h.smoke + .003*(hasDz(p,'hyper')?1:0) + .002*(hasDz(p,'diabetes')?1:0) - .001*h.ex : 0,
  };
  for(const k of Object.keys(risk)){ if(hasDz(p, k)) continue; if(chance(Math.max(0, risk[k]))) return k; }
  return null;
}
function dzCause(p, k){
  const h = hab(p), bits = [];
  if(k==='lung' || (k==='heart' && h.smokeYrs >= 5)) bits.push(`บุหรี่ที่สูบมาตั้งแต่อายุ ${h.smokeFrom} รวม ${h.smokeYrs} ปี`);
  if(k==='liver' || (k==='hyper' && h.drink===2)) bits.push(`เหล้าที่ดื่มหนักมาราว ${Math.round(h.drinkYrs)} ปี`);
  if((k==='hyper' || k==='heart') && p.flags.ot) bits.push('การทำงานหนักและนอนน้อยมาหลายปี');
  if(k==='diabetes' && p.lifestyle===2) bits.push('การกินอยู่แบบหรูหรา');
  if(k==='diabetes' && !h.ex) bits.push('การแทบไม่ได้ออกกำลังกาย');
  if(k==='kidney') bits.push(`${hasDz(p,'diabetes')?'เบาหวาน':'ความดัน'}ที่เป็นมาหลายปี`);
  return bits.length ? `ผลจาก${bits.join(' และ')}` : 'หมอบอกว่าเป็นไปตามวัยและกรรมพันธุ์';
}
async function diseaseOnset(p, io, k){
  const D = DISEASES[k]; p.dz = p.dz || {}; p.dz[k] = { age: p.age, care:'med' };
  log(p, `ตรวจพบ${D.name}`);
  const cause = dzCause(p, k);
  if(D.chronic && k !== 'kidney'){
    const c = await choose(p, io, { kind:'fork', bg:'hospital', title:`ตรวจพบ${D.name}`, text:`${cause}\nโรคนี้อยู่กับคุณไปตลอดชีวิต`, choices:[
      { label:'คุมอาหาร ออกกำลังกาย กินยาตามหมอ', sub:'J−3 · H ลดช้าที่สุด · เริ่มออกกำลังกาย', k:'diet' },
      { label:'กินยาอย่างเดียว', sub:'ค่ายาปีละ 3,000', k:'med' },
      { label:'ไม่สนใจ ใช้ชีวิตเหมือนเดิม', sub:'H ลดเร็ว · เสี่ยงไตวายสูง', k:'ignore' } ]});
    p.dz[k].care = c.k;
    if(c.k==='diet'){ fx(p,{J:-3}); hab(p).ex = 1; note(p,'คุณเริ่มเดินเร็วทุกเช้าและลดของหวาน'); }
    if(c.k==='ignore') note(p,'คุณใช้ชีวิตเหมือนเดิม อาการยังไม่แสดงให้เห็นในตอนนี้');
    return;
  }
  if(k === 'kidney'){
    fx(p,{H:-D.lost});
    const c = await choose(p, io, { kind:'fork', bg:'hospital', title:'ไตวายเรื้อรัง', text:`${cause}\nหมอบอกว่าต้องฟอกไตหรือหาไตใหม่`, choices:[
      { label:'ฟอกไตทางช่องท้องตามสิทธิ์', sub:'J−10 · ต้องทำทุกวันไปตลอด', k:'dialysis' },
      { label:'ผ่าตัดปลูกถ่ายไต รพ.เอกชน', sub:'สำเร็จ 70% · หายแล้วกลับมาใช้ชีวิตได้', cost:1500000, loan:false, k:'transplant' },
      { label:'ไม่รักษา', sub:'J−5', k:'none' } ]});
    if(c.k==='dialysis'){ fx(p,{J:-10}); p.Jbase = Math.max(0, p.Jbase - 5); }
    if(c.k==='transplant'){ if(chance(.7)){ delete p.dz.kidney; fx(p,{H:15}); note(p,'ผ่าตัดสำเร็จ ไตใหม่ทำงานได้ดี'); } else { note(p,'ร่างกายไม่รับไตใหม่ ต้องกลับไปฟอกไต'); fx(p,{J:-10}); } }
    if(c.k==='none'){ fx(p,{J:-5,H:-15}); p.dz.kidney.care = 'ignore'; }
    if(p.H <= 0) throw new Death('ไตวายเรื้อรัง');
    return;
  }
  fx(p,{H:-D.lost});
  await say(p, io, { kind:'event', bg:'hospital', title: k==='heart' ? 'เจ็บหน้าอกจนล้มลง' : `ตรวจพบ${D.name}`, text:`${D.name} · ${cause}` });
  if(p.H <= 0) throw new Death(D.name);
  await seriousIllness(p, io, D.lost);
  if(k==='lung' || k==='heart'){ const h = hab(p); if(h.smoke && await yesno(p, io, { title:'หมอสั่งให้เลิกบุหรี่ทันที', sub:'สำเร็จ 70% เพราะกลัวตาย', yes:'เลิก', no:'สูบต่อ' })){ if(chance(.7)){ h.smoke = 0; note(p,'คุณเลิกบุหรี่ได้สำเร็จ'); } else note(p,'เลิกได้ 3 เดือนแล้วกลับไปสูบอีก'); } }
  if(k==='liver'){ const h = hab(p); if(h.drink){ h.drink = 0; note(p,'คุณต้องเลิกเหล้าตามคำสั่งหมอ'); } }
}
function healthDeathCause(p){
  const dz = Object.keys(p.dz || {});
  if(!dz.length) return 'สุขภาพทรุดลงจนร่างกายไปต่อไม่ไหว';
  const k = dz.includes('kidney') ? 'kidney' : dz[dz.length-1];
  return `โรคแทรกซ้อนจาก${DISEASES[k].name}`;
}
function habitLifespanAdj(p){ const h = hab(p); return -Math.round(h.smokeYrs/6) - Math.round(h.drinkYrs/8) + (h.exYrs >= 15 ? 3 : h.exYrs >= 5 ? 1 : 0); }

// ---------- ตัวเลือกวัยเด็กที่ส่งผลภายหลัง ----------
const SEED_TH = { reader:'นิสัยรักการอ่าน', athlete:'การเล่นกีฬามาตั้งแต่เด็ก', trader:'การช่วยค้าขายที่บ้านตั้งแต่เด็ก', creator:'การหัดทำคลิปมาตั้งแต่เด็ก' };
function seedFor(p, career){
  const s = p.seeds || {};
  if(career==='biz' && s.trader) return { adj:12, why:SEED_TH.trader };
  if(career==='influ' && s.creator) return { adj:12, why:SEED_TH.creator };
  if(['office','gov'].includes(career) && s.reader) return { adj:6, why:SEED_TH.reader };
  if(career==='factory' && s.athlete) return { adj:5, why:SEED_TH.athlete };
  return null;
}
function addSeed(p, k){ p.seeds = p.seeds || {}; p.seeds[k] = true; }

function depthStage3(p, io, beats){
  // ดูแลสุขภาพ 2 ครั้ง
  [31, 44].forEach(age => beats.push({ age, run: async () => {
    if(p.status.prison) return;
    const h = hab(p); const was = h.ex;
    const c = await choose(p, io, { kind:'life', bg:'city', title:`อายุ ${p.age} แล้ว ดูแลสุขภาพยังไง`, text: was ? 'คุณออกกำลังกายเป็นประจำมาตลอด' : 'งานยุ่งจนแทบไม่ได้ขยับตัว', choices:[
      { label:'ออกกำลังกายสม่ำเสมอ', sub: was ? 'ทำต่อเหมือนเดิม · J+2' : 'J−3 · ฿6,000/ปี ค่าฟิตเนส', k:'ex' },
      { label:'ตามสะดวก เดินบ้างไม่เดินบ้าง', sub:'ไม่มีผลทันที', k:'meh' },
      { label:'ไม่มีเวลาเลย', sub:'J+2', k:'no' } ]});
    if(c.k==='ex'){ if(was) fx(p,{J:2}); else { fx(p,{J:-3}); p.annual.push({ from:p.age, to:p.age+10, amt:6000 }); } h.ex = 1; }
    else { h.ex = 0; if(c.k==='no') fx(p,{J:2}); }
    if(h.smoke && await yesno(p, io, { title:'อยากเลิกบุหรี่ไหม', sub:'สำเร็จ 35% · J−5 ช่วงเลิก', yes:'ลองเลิก', no:'สูบต่อ' })){ fx(p,{J:-5}); if(chance(.35)){ h.smoke = 0; note(p,`เลิกบุหรี่ได้หลังสูบมา ${h.smokeYrs} ปี`); } else note(p,'เลิกได้ไม่ถึงเดือนก็กลับไปสูบ'); }
    if(h.drink===2 && await yesno(p, io, { title:'ลดเหล้าลงไหม', sub:'สำเร็จ 50% · C−3', yes:'ลด', no:'ดื่มต่อ' })){ if(chance(.5)){ h.drink = 1; fx(p,{C:-3}); note(p,'ดื่มน้อยลงเหลือแค่งานสังคม'); } else note(p,'ลดได้ไม่นานก็กลับไปเหมือนเดิม'); }
  }}));
  // เพื่อนวัยเด็กกลับมา
  if(p.friend) beats.push({ age: randi(32, 46), run: () => friendReturns(p, io) });
  // ธุรกิจโตระดับประเทศ
  beats.push({ age:43, run: () => bizScale(p, io) });
  beats.push({ age:37, run: () => influBrand(p, io) });
}
async function friendReturns(p, io){
  const f = p.friend; if(!f || p.status.prison) return;
  const past = f.bond === 2 ? `\nเพราะวันที่คุณเข้าไปช่วยตอน ป.6 ${f.name}ไม่เคยลืม` : '';
  if(f.fate === 'rich'){
    if(f.bond >= 1){
      const c = await choose(p, io, { kind:'event', bg:'office', title:`${f.name} เพื่อนสมัยเด็กโทรมา`, text:`${f.name}เป็นเจ้าของบริษัทแล้ว และอยากชวนคุณมาร่วมงาน${past}`, choices:[
        { label:'ไปทำงานกับเพื่อน', sub:'รายได้ +40% C+10 · เปลี่ยนเป็นพนักงานออฟฟิศ', cond: p.age < 55, condText:'อายุมากเกินไป', k:'job' },
        { label:'ร่วมลงทุนกับเพื่อน', sub:'50% ได้คืน ×3', cost:300000, k:'invest' },
        { label:'ขอบคุณ แต่ทำงานที่เดิม', sub:'C+5', k:'no' } ]});
      if(c.k==='job'){ p.career = 'office'; p.cOut = 'good'; p.cYears = 0; p.unemployed = 0; p.incomeBoost *= 1.4; fx(p,{C:10,J:5}); log(p,`ไปทำงานกับ${f.name}`); }
      if(c.k==='invest'){ if(chance(.5)){ fx(p,{m:900000}); note(p,'ธุรกิจของเพื่อนไปได้สวย คุณได้เงินคืน 3 เท่า'); } else note(p,'ธุรกิจเพื่อนไม่รุ่ง เงินลงทุนหายไป แต่ยังเป็นเพื่อนกัน'); }
      if(c.k==='no') fx(p,{C:5});
    } else { fx(p,{J:-3}); await say(p, io, { kind:'event', bg:'city', title:`เจอ${f.name}ในข่าว`, text:`เพื่อนสมัยเด็กที่คุณเคยทำเป็นไม่เห็นตอนเขาโดนรังแก ตอนนี้เป็นเจ้าของบริษัทใหญ่\nคุณส่งข้อความไปทัก แต่เขาแค่กดอ่าน` }); }
    return;
  }
  if(f.fate === 'poor'){
    const c = await choose(p, io, { kind:'event', bg:'city', title:`${f.name} เพื่อนสมัยเด็กมาขอยืมเงิน`, text:`${f.name}ตกงานและลูกป่วย ขอยืม 100,000 บาท${past}`, choices:[
      { label:'ให้ยืม', sub: f.bond===2 ? '80% ได้คืน · K+5' : '40% ได้คืน · K+5', cost:100000, k:'lend' },
      { label:'ให้เปล่า 30,000', sub:'K+8', cost:30000, k:'give' },
      { label:'ปฏิเสธ', sub:'J−3', k:'no' } ]});
    if(c.k==='lend'){ fx(p,{K:5}); tagGood(p,'community',`ช่วยเหลือ${f.name}ตอนลำบาก`); if(chance(f.bond===2?.8:.4)){ fx(p,{m:100000}); note(p,`${f.name}ทยอยใช้คืนจนครบ`); } else note(p,`${f.name}ไม่เคยใช้คืน และหายไปจากชีวิตคุณ`); }
    if(c.k==='give'){ fx(p,{K:8}); tagGood(p,'community',`ช่วยเหลือ${f.name}ตอนลำบาก`); if(f.bond===2) p.guestsMult *= 1.05; }
    if(c.k==='no') fx(p,{J:-3});
    return;
  }
  if(f.bond >= 1){ fx(p,{J:5,C:3}); await say(p, io, { kind:'event', bg:'city', title:'งานเลี้ยงรุ่น', text:`${f.name}เป็นคนจัดงาน และลากคุณไปนั่งโต๊ะเดียวกัน คุยกันจนร้านปิด` }); }
}

async function bizScale(p, io){
  if(p.career !== 'biz' || p.cOut !== 'good' || p.status.prison || p.flags.scaled) return;
  p.flags.scaled = true;
  const ipo = clamp(Math.round(25 + 0.3*(p.S-50) + 0.3*(p.C-50) + (p.flags.branch?10:0) + (p.seeds?.trader?5:0)), 8, 70);
  const c = await choose(p, io, { kind:'fork', bg:'office', title:'บริษัทของคุณโตจนนักลงทุนรายใหญ่เริ่มสนใจ', text:'ทางเลือกนี้อาจเปลี่ยนคุณเป็นเศรษฐีระดับประเทศ', choices:[
    { label:'เข้าตลาดหลักทรัพย์ (IPO)', sub:`สำเร็จ ${ipo}% · ถ้าสำเร็จ หุ้นที่ถือมีมูลค่าหลายร้อยล้านถึงหลักพันล้าน`, cost:5000000, k:'ipo' },
    { label:'ขายกิจการให้ทุนใหญ่', sub:'ได้เงินก้อน 40–120 ล้าน · หยุดทำธุรกิจ', k:'sell' },
    { label:'ทำต่อแบบเดิม', sub:'ไม่เสี่ยง', k:'keep' } ]});
  if(c.k==='ipo'){
    if(chance(ipo/100)){ const v = randi(30, 300) * 10000000 * .6; addMoney(p, Math.round(v)); p.incomeBoost *= 3; fx(p,{J:10,C:30}); p.flags.tycoon = true; log(p,'บริษัทเข้าตลาดหลักทรัพย์');
      await say(p, io, { kind:'result', bg:'office', outcome:'good', title:'เคาะระฆังเปิดซื้อขายวันแรก', text:`หุ้นที่คุณถือมีมูลค่า ฿${baht(Math.round(v))}\nชื่อคุณขึ้นทำเนียบคนรวยของนิตยสารธุรกิจ` }); }
    else { fx(p,{J:-10}); note(p,'ก.ล.ต. ไม่อนุมัติ นักลงทุนถอนตัว เงินเตรียมการ 5 ล้านหายไป'); }
  }
  if(c.k==='sell'){ const v = randi(40, 120) * 1000000; addMoney(p, v); p.incomeBoost *= .05; fx(p,{J:5}); p.flags.soldBiz = true; log(p,'ขายกิจการ'); note(p, `ขายกิจการได้ ฿${baht(v)} คุณไม่ต้องทำงานอีกเลยถ้าไม่อยากทำ`); }
}
async function influBrand(p, io){
  if(p.career !== 'influ' || p.cOut !== 'good' || p.status.prison || p.flags.brand) return;
  p.flags.brand = true;
  if(!await yesno(p, io, { kind:'fork', bg:'stream', title:'แฟนคลับเรียกร้องให้ออกแบรนด์ของตัวเอง', sub:'สำเร็จ 35% · ถ้าปัง ได้ 50–200 ล้าน', cost:2000000, yes:'ออกแบรนด์', no:'รับรีวิวต่อไป' })) return;
  if(chance(.35)){ const v = randi(50, 200) * 1000000; addMoney(p, v); fx(p,{J:10,C:10}); p.flags.tycoon = true; note(p, `สินค้าขายหมดทุกล็อต แบรนด์ทำเงินให้คุณ ฿${baht(v)}`); }
  else { fx(p,{J:-8}); note(p,'สินค้าค้างสต็อก แฟนคลับบ่นว่าแพงเกินไป'); }
}

  const st = SCENE.st || snap(CUR.p);
  drawScene(gx, SCENE.bg, t, st, SCENE.kind, SCENE.outcome);
  setTimeout(() => requestAnimationFrame(frame), 90);
}
requestAnimationFrame(frame);
function setScene(bg, kind, outcome, st){ SCENE.bg = bg || 'home'; SCENE.kind = kind; SCENE.outcome = outcome; SCENE.st = st || null;  Music.pick(SCENE.bg); }

// ---------- เพลงประกอบ (Pixabay) · เลือกตามช่วงชีวิต + ค่อย ๆ เฟดเปลี่ยน ----------
const Music = (() => {
  const SRC = { arcade:'music/arcade.mp3', quest:'music/quest.mp3', guitar:'music/guitar.mp3', piano:'music/piano.mp3' };
  const VOL = { arcade:.42, quest:.40, guitar:.55, piano:.55 };
  const els = {}; let cur = null, want = 'arcade', unlocked = false, on = true, raf = 0;
  try { on = localStorage.getItem('o65m_music') !== 'off'; } catch(e) {}
  function el(k){ if(!els[k]){ const a = new Audio(SRC[k]); a.loop = true; a.preload = 'auto'; a.volume = 0; els[k] = a; } return els[k]; }
  function trackFor(bg){
    const st = CUR.p ? CUR.p.stage : 0;
    if(['funeral','karma','death','end'].includes(bg) || st >= 7) return 'piano';
    if(bg === 'timeskip') return cur || want;
    if(st >= 6 || bg === 'hospital' || bg === 'oldhome') return 'guitar';
    if(st >= 3) return 'quest';
    return 'arcade';
  }
  function fade(){
    cancelAnimationFrame(raf); let last = performance.now();
    const step = now => {
      const dt = Math.min(.1, (now - last)/1000); last = now; let busy = false;
      for(const k in els){ const a = els[k]; const target = (on && unlocked && k === cur) ? VOL[k] : 0;
        const d = target - a.volume; if(Math.abs(d) > .005){ busy = true; a.volume = clamp(a.volume + Math.sign(d)*Math.min(Math.abs(d), dt*.45), 0, 1); } else a.volume = target;
        if(a.volume === 0 && target === 0 && !a.paused) a.pause(); }
      if(busy) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  function apply(){
    if(!unlocked || !on){ fade(); return; }
    const a = el(cur); if(a.paused){ a.play().catch(()=>{}); }
    fade();
  }
  function pick(bg){ want = trackFor(bg); if(want === cur) return; const prev = cur; cur = want;
    // เพลงใหม่เริ่มต้นเพลง ยกเว้นกลับมาเพลงเดิมเร็ว ๆ ให้เล่นต่อจากเดิม
    if(prev && els[cur] && els[cur].paused) { try { els[cur].currentTime = 0; } catch(e) {} }
    apply(); }
  function ui(){ const b = $('#sndBtn'); if(!b) return; b.classList.toggle('off', !on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); $('#sndTxt').textContent = on ? 'เพลง' : 'ปิดเพลง'; }
  function toggle(){ if(!unlocked && on){ unlock(); return; } on = !on; try { localStorage.setItem('o65m_music', on ? 'on' : 'off'); } catch(e) {} unlocked = true; ui(); apply(); }
  function unlock(){ if(unlocked) return; unlocked = true; apply(); }
  addEventListener('pointerdown', e => { if(!(e.target.closest && e.target.closest('#sndBtn'))) unlock(); }, { capture:true }); addEventListener('keydown', e => { if(e.key === 'm' || e.key === 'M'){ if(!e.target.closest || !e.target.closest('input,textarea')) toggle(); } else unlock(); }, { capture:true });
  document.addEventListener('visibilitychange', () => { const a = cur && els[cur]; if(!a) return; if(document.hidden) a.pause(); else if(on && unlocked) a.play().catch(()=>{}); });
  $('#sndBtn').addEventListener('click', e => { e.stopPropagation(); toggle(); });
  ui();
  return { pick, toggle, state: () => ({ cur, on, unlocked, playing: Object.keys(els).filter(k => !els[k].paused) }) };
})();


// ---------- HUD ----------
const STAGE_TH = ['แรกเกิด','วัยเรียน','หลังจบ ม.6','วัยทำงาน','ชีวิตคู่','ลูก','วัยเกษียณ','ตอนจบ'];
function hud(p){
  if(!p) return; $('#hud').hidden = false; $('#tl').hidden = false; $('#logBtn').hidden = false;
  $('#hName').textContent = p.name + (p.gen > 1 ? ` · รุ่นที่ ${p.gen}` : '');
  $('#hAge').innerHTML = `${ic('clock')}${p.age}`;
  $('#hWhere').textContent = `${p.prov} · ${QS[p.qBirth].name}${p.career && p.age < 60 ? ' · ' + CAREERS[p.career].name : ''}`;
  const bar = v => `<span class="bar"><i style="width:${clamp(v,0,100)}%"></i></span>`;
  const debt = totalDebt(p);
  $('#hStats').innerHTML = [
    ['H','สุขภาพ',p.H], ['J','ความสุข',p.J], ['S','ทักษะ',p.S], ['C','เส้นสาย',p.C],
  ].map(([k,n,v]) => `<span class="stat ${k}" id="st${k}" title="${n}"><img src="${ICONS[k]}" alt="${n}">${bar(v)}<span class="v">${Math.round(v)}</span></span>`).join('')
  + `<span class="stat M" id="stM" title="เงิน"><img src="${ICONS.M}" alt="เงิน"><span class="v">฿${bahtS(p.money)}</span></span>`
  + (debt > 0 ? `<span class="stat D" id="stD" title="หนี้"><img src="${ICONS.D}" alt="หนี้"><span class="v">฿${bahtS(debt)}</span></span>` : '');
  const tl = $('#tl'); const pct = a => `${clamp(a,0,100)}%`;
  tl.innerHTML = `<div class="track"></div><div class="fill" style="width:${pct(p.age)}"></div>` + [0,20,40,60,80,100].map(a => `<span class="tick" style="left:${a}%">${a}</span>`).join('')
    + p.log.filter((l,i,arr) => arr.findIndex(x=>x.age===l.age)===i).map(l => `<span class="ev" style="left:${pct(l.age)}"></span>`).join('')
    + `<span class="now" style="left:${pct(p.age)}"></span>`;
}
const chipQ = [];
function flushChips(){
  const box = $('#chips'); const agg = {}; for(const [k, v] of chipQ.splice(0)) agg[k] = (agg[k] || 0) + v;
  box.innerHTML = '';
  const list = Object.entries(agg).filter(([k, v]) => Math.round(v) !== 0).map(([k, v]) => [k, Math.round(v)]);
  list.forEach(([k, v], i) => setTimeout(() => {
    const d = document.createElement('div'); d.className = 'chip ' + (v > 0 ? 'up' : 'down');
    d.innerHTML = (k === '฿' ? ic('M', 'ic big') + `${v>0?'+':'−'}${bahtS(Math.abs(v))}` : ic(k, 'ic big') + `${v>0?'+':'−'}${Math.abs(v)}`) + `<span class="arw">${v>0?'▲':'▼'}</span>`;
    box.appendChild(d); setTimeout(() => d.remove(), 2300);
    const el = $('#st' + (k === '฿' ? 'M' : k)); if(el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 220); }
  }, i * 140));
}

// ---------- แผงตัดสินใจ ----------
const KIND_TH = { main:'ตัดสินใจหลัก', minor:'ทางเลือกย่อย', fork:'ทางแยกบังคับ', event:'เหตุการณ์ไม่คาดคิด', deed:'โอกาสทำความดี', life:'ระดับการใช้ชีวิต', result:'ผลลัพธ์', birth:'เกิด', stage:'ช่วงชีวิต', cut:'ฉากพิเศษ', death:'ลาจาก', mourn:'ไว้อาลัย', funeral:'งานศพ' };
function eyebrow(o){ const p = CUR.p; const st = p ? STAGE_TH[p.stage] : ''; return `<div class="eyebrow">${esc(KIND_TH[o.kind] || 'ชีวิต')}<span>${esc(st)}${p ? ' · อายุ ' + p.age : ''}</span></div>`; }
function pendHTML(pend){ if(!pend || !pend.length) return ''; return `<div class="pend">${pend.map(x => `<div>${rich(typeof x === 'string' ? x : x.text)}</div>`).join('')}</div>`; }
function headHTML(h){ return h ? `<div class="head"><b>⚡ ${esc(h.title)}</b>${h.text ? `<p>${rich(h.text)}</p>` : ''}</div>` : ''; }
// ป้ายราคา = เงินที่ต้องจ่ายทันทีตอนเลือก (ไม่ต้องจ่ายก็ไม่แสดง)
function priceHTML(c){ if(!c.cost) return ''; return `<span class="price"><small>จ่าย</small>${ic('M')}${bahtS(c.cost)}</span>`; }
const cleanTitle = t => String(t || '').replace(/\s?\((ไม่)?ทำ\)/g, '');
function choiceHTML(c, i, multi){
  return `<button class="ch" data-i="${i}" ${c.disabled ? 'disabled' : ''}>${multi ? '<span class="box"></span>' : `<span class="k">${i+1}</span>`}<span class="l">${esc(c.label)}</span>${priceHTML(c)}${c.sub ? `<span class="s">${rich(c.sub)}</span>` : ''}${c.loanNote ? `<span class="loan">${ic('D')} ${rich(c.loanNote)}</span>` : ''}${c.lock ? `<span class="lock">🔒 ${rich(c.lock)}</span>` : ''}</button>`;
}
// ข้อความหลายบรรทัด → รายการพร้อมสัญลักษณ์
function textHTML(t){ if(!t) return ''; const lines = String(t).split('\n').filter(Boolean); if(lines.length < 2) return `<p class="txt">${rich(t)}</p>`; return `<ul class="lines">${lines.map(l => `<li>${rich(l)}</li>`).join('')}</ul>`; }
const OUT_ICON = { good:['▲','ดี'], mid:['■','กลาง'], bad:['▼','แย่'] };
function outcomeHTML(o){ return o ? `<div class="outcome ${o}"><span>${OUT_ICON[o][0]}</span>${OUT_ICON[o][1]}</div>` : ''; }
const Q_SHORT = ['จน','ค่อนข้างจน','ปานกลาง','กลางบน','มีอันจะกิน','เศรษฐี'];
function coins(n){ return n >= 5 ? ic('crown') : Array.from({ length: n+1 }, () => ic('M')).join(''); }
function birthHTML(b){
  const max = Math.max(...b.tierQ);
  const ladder = b.tierQ.map((v, i) => `<div class="rung ${i===b.q?'me':''}"><span class="pc">${v}%</span><span class="col"><i style="height:${Math.max(4, v/max*100)}%"></i></span><span class="cn">${coins(i)}</span><span class="nm">${Q_SHORT[i]}</span>${i===b.q?'<span class="you">คุณ</span>':''}</div>`).join('');
  const stat = (k, v) => `<div class="sb">${ic(k,'ic big')}<span class="bar"><i style="width:${v}%"></i></span><b>${Math.round(v)}</b></div>`;
  return `<div class="tiles">
    <div class="tile">${ic('pin','ic big')}<span class="lab">จังหวัดเกิด</span><b>${esc(b.prov)}</b>${b.gen===1?`<span class="note">โอกาส ${b.provPct.toFixed(2)}%</span><span class="meter"><i style="width:${Math.min(100,b.provPct*10)}%"></i></span>`:`<span class="note">ลูกของ${esc(b.parent||'')}</span>`}</div>
    <div class="tile">${ic(b.sex==='M'?'male':'female','ic big')}<span class="lab">${b.sex==='M'?'ชาย':'หญิง'}</span><b>${esc(b.religion)}</b></div>
    <div class="tile">${ic(b.skip?'home':'fam','ic big')}<span class="lab">ผู้เลี้ยงดู</span><b>${b.skip?'ปู่ย่า':'พ่อแม่'}</b>${b.skip?'<span class="note">พ่อแม่ทำงานต่างถิ่น</span>':''}</div>
  </div>
  <div class="ladder" aria-label="โอกาสเกิดในแต่ละฐานะ">${ladder}</div>
  <p class="help">${b.gen===1?`ความน่าจะเป็นของแต่ละฐานะใน${esc(b.tierName)}`:'ฐานะคิดจากรายได้ครอบครัวตอนคุณเกิด'} · รายได้บ้านคุณ ${ic('M')}${bahtS(b.inc)}/เดือน</p>
  <div class="money">${ic('M','ic huge')}<div><b>${baht(b.money)}</b><span>เงินที่ครอบครัวทุ่มให้ตลอดวัยเรียน</span></div></div>
  <div class="statrow">${stat('H',b.stats.H)}${stat('J',b.stats.J)}${stat('S',b.stats.S)}${stat('C',b.stats.C)}</div>`;
}
function panel(html){ const el = $('#panel'); el.innerHTML = html; return el; }
function focusFirst(el){ const b = el.querySelector('.ch:not(:disabled), .go'); if(b && !('ontouchstart' in window)) b.focus({ preventScroll:true }); }
function stickyH(){ if(innerWidth > 640 || innerHeight < 600) return 0; const h = $('#hud'); const s = $('.main > section'); return (h.hidden ? 0 : h.offsetHeight) + s.offsetHeight; }
function measureSticky(){ const h = $('#hud'); document.documentElement.style.setProperty('--hudH', (h.hidden ? 0 : h.offsetHeight) + 'px'); document.documentElement.style.setProperty('--stickH', stickyH() + 'px'); }
try { new ResizeObserver(measureSticky).observe($('#hud')); new ResizeObserver(measureSticky).observe($('.main > section')); } catch(e) {}
addEventListener('resize', measureSticky);
function scrollPanelIntoView(){ if(innerWidth < 880){ measureSticky(); const top = stickyH(); const r = $('#panel').getBoundingClientRect(); if(r.top < top - 2 || r.top > Math.max(top + 40, innerHeight*.7)) window.scrollTo({ top: scrollY + r.top - top - 6, behavior: REDUCED ? 'auto' : 'smooth' }); } }
function setKeys(fn){ CUR.keys = fn; }
document.addEventListener('keydown', e => { if(!CUR.keys || $('#drawer').hidden === false) return; if(e.target && e.target.tagName === 'INPUT') return; CUR.keys(e); });

const UI = {
  update(p){ hud(p || CUR.p); },
  chips(list){ chipQ.push(...list); },
  ask(o){
    return new Promise(res => {
      const p = CUR.p; setScene(o.head ? o.head.bg || o.bg : o.bg, o.head ? 'event' : o.kind, null);
      hud(p);
      const el = panel(eyebrow(o) + headHTML(o.head) + pendHTML(o.pend) + `<h2>${esc(cleanTitle(o.title))}</h2>` + textHTML(o.text) + `<div class="choices">${o.choices.map((c,i)=>choiceHTML(c,i)).join('')}</div>`);
      flushChips();
      const pick = i => { if(o.choices[i] && !o.choices[i].disabled){ setKeys(null); res(i); } };
      el.querySelectorAll('.ch').forEach(b => b.addEventListener('click', () => pick(+b.dataset.i)));
      setKeys(e => { const n = parseInt(e.key, 10); if(n >= 1 && n <= o.choices.length){ e.preventDefault(); pick(n-1); } });
      focusFirst(el); scrollPanelIntoView();
    });
  },
  say(o){
    return new Promise(res => {
      setScene(o.bg, o.kind, o.outcome, o.kind === 'cut' && o.bg === 'sharesouls' ? { ...snap(CUR.p), ssTier:o.tier } : null);
      hud(CUR.p);
      const body = o.birth ? birthHTML(o.birth) : textHTML(o.text);
      const title = o.kind === 'result' ? esc(o.title.replace(/: ผลลัพธ์.*$/, '')) : esc(o.title);
      const el = panel(eyebrow(o) + pendHTML(o.pend) + outcomeHTML(o.outcome) + `<h2>${title}</h2>` + body + `<button class="go" id="goBtn">ต่อไป</button>`);
      flushChips();
      const done = () => { setKeys(null); res(); };
      $('#goBtn').addEventListener('click', done);
      setKeys(e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); done(); } });
      focusFirst(el); scrollPanelIntoView();
    });
  },
  skip(o){
    return new Promise(res => {
      const p = o.p; setScene('timeskip', null, null); hud(p);
      const max = Math.max(1, ...o.bars.map(b => Math.abs(b.net)));
      const bars = o.bars.map(b => { const h = Math.abs(b.net)/max*48; const neg = b.net < 0; return `<div class="b ${neg?'neg':''} ${b.rec?'rec':''}" title="อายุ ${b.age}: ฿${baht(b.net)}"><i style="${neg ? `top:50%;height:${h}%` : `bottom:50%;height:${h}%`}"></i></div>`; }).join('');
      const working = o.bars.some(b => b.income);
      const total = o.bars.reduce((s,b)=>s+b.net,0);
      const debt = totalDebt(p);
      const el = panel(`<div class="eyebrow">กระโดดเวลา<span>${esc(STAGE_TH[p.stage])}</span></div>` + pendHTML(o.pend) +
        `<h2>ผ่านไป ${o.to - o.from} ปี · อายุ ${o.from} → ${o.to}</h2>` +
        `<div class="chart"><div class="zero"></div>${bars}</div>` +
        `<div class="legend"><span><i style="background:var(--good)"></i>${working ? 'เงินที่เก็บได้ต่อปี' : 'เงินเข้า'}</span><span><i style="background:var(--bad)"></i>ติดลบ</span>${o.bars.some(b=>b.rec)?'<span><i style="background:#8b93b8"></i>ปีเศรษฐกิจถดถอย</span>':''}</div>` +
        `<div class="tiles">` +
          `<div class="tile">${ic('clock','ic big')}<span class="lab">ช่วงนี้</span><b class="${total<0?'neg':'pos'}">${total<0?'▼':'▲'} ${bahtS(Math.abs(total))}</b></div>` +
          `<div class="tile">${ic('M','ic big')}<span class="lab">เงินเก็บ</span><b>${bahtS(p.money)}</b></div>` +
          (debt ? `<div class="tile">${ic('D','ic big')}<span class="lab">หนี้</span><b class="neg">${bahtS(debt)}</b></div>` : '') +
          (p.age >= 22 && p.age < 60 ? `<div class="tile">${ic('home','ic big')}<span class="lab">รายได้บ้าน/เดือน</span><b>${bahtS(hhIncome(p))}</b></div>` : '') +
        `</div>` +
        (o.notes.length ? o.notes.map(n => `<p class="txt omen">${ic('K')} ${esc(n)}</p>`).join('') : '') +
        `<button class="go" id="goBtn">ต่อไป</button>`);
      flushChips();
      const done = () => { setKeys(null); res(); };
      $('#goBtn').addEventListener('click', done); setKeys(e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); done(); } });
      focusFirst(el); scrollPanelIntoView();
    });
  },
  multi(o){
    return new Promise(res => {
      setScene(o.bg, o.kind, null); hud(CUR.p);
      const sel = new Set();
      const el = panel(eyebrow(o) + pendHTML(o.pend) + `<h2>${esc(cleanTitle(o.title))}</h2>` + textHTML(o.text) + `<div class="choices">${o.items.map((c,i)=>choiceHTML(c,i,true)).join('')}</div><p class="help" id="mTotal">ยังไม่ได้เลือก</p><button class="go" id="goBtn">ยืนยัน</button>`);
      flushChips();
      const upd = () => { const tot = [...sel].reduce((s,i)=>s+(o.items[i].cost||0),0); $('#mTotal').textContent = sel.size ? `เลือก ${sel.size} อย่าง · รวม ฿${baht(tot)}` : 'ยังไม่ได้เลือก'; };
      el.querySelectorAll('.ch').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.i; if(sel.has(i)) sel.delete(i); else { const tot = [...sel].reduce((s,j)=>s+(o.items[j].cost||0),0) + (o.items[i].cost||0); if(tot > Math.max(0, CUR.p.money) && o.items[i].cost) return; sel.add(i); } b.classList.toggle('on', sel.has(i)); upd(); }));
      const done = () => { setKeys(null); res([...sel]); };
      $('#goBtn').addEventListener('click', done); setKeys(e => { if(e.key === 'Enter'){ e.preventDefault(); done(); } });
      focusFirst(el); scrollPanelIntoView();
    });
  },
  async funeral(r, p){
    // 1) งานศพ
    await new Promise(res => {
      setScene('funeral', null, null, { ...snap(p), age: 40, ctx:'funeral' });
      const el = panel(`<div class="eyebrow">งานศพ<span>${esc(r.funeral)}</span></div><h2>มีคน ${r.guests.toLocaleString()} คนมาส่งคุณ</h2><p class="txt">เงินซองที่คืนมา ฿${baht(r.envelopes)}${r.kidDebt ? `\nค่างานส่วนที่ขาด ฿${baht(r.kidDebt)} กลายเป็นหนี้ของลูก` : ''}</p><button class="go" id="goBtn">เปิดบัญชีกรรม</button>`);
      const done = () => { setKeys(null); res(); }; $('#goBtn').addEventListener('click', done); setKeys(e => { if(e.key==='Enter'){ e.preventDefault(); done(); } }); focusFirst(el);
    });
    // 2) บัญชีกรรม
    await new Promise(res => {
      const goods = r.ledger.filter(l=>l.good).length, all = r.ledger.length || 1;
      setScene('karma', null, null, { goodRatio: goods/all });
      const rows = r.ledger.map((l, i) => `<div class="led ${l.good?'good':''}" style="animation-delay:${REDUCED?0:i*0.25}s"><span class="a">อายุ ${l.age}</span><span class="t">${esc(l.label)}</span><span class="st ${l.erupt?'y':'n'}">${l.good ? (l.erupt?'ออกผล':'เงียบ') : (l.erupt?'ปะทุ':'รอด')}</span>${l.eff ? `<span class="e">${esc(l.eff)}</span>` : ''}</div>`).join('');
      const kTxt = `${r.K > 0 ? '+' : ''}${Math.round(r.K)}`;
      const el = panel(`<div class="eyebrow">บัญชีกรรม<span>เฉลยหลังตาย</span></div><h2>ค่าบุญ/บาปที่ซ่อนไว้ทั้งชีวิต <span class="bigK" style="color:${r.K>=0?'var(--gold2)':'var(--karma)'}">${kTxt}</span></h2>` +
        `<p class="txt">${r.ledger.length ? 'ทุกการกระทำถูกจดไว้ตามลำดับเวลา บางเรื่องออกผลหลังคุณจากไป' : 'ชีวิตนี้ไม่มีอะไรถูกจดไว้ในบัญชีกรรมเลย'}</p><div class="ledger">${rows}</div>` +
        (!r.anyFruit && r.K > 40 ? `<p class="txt">มีคนพูดถึงคุณในทางดีที่งานศพ</p>` : '') +
        `<button class="go" id="goBtn">สรุปชีวิต</button>`);
      const done = () => { setKeys(null); res(); }; $('#goBtn').addEventListener('click', done); setKeys(e => { if(e.key==='Enter'){ e.preventDefault(); done(); } }); focusFirst(el);
    });
    r.pct = percentile(SIM_SCORES, r.score);
  },
};
