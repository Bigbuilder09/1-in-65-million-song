async function makeCard(r, p, family){
  try { await document.fonts.load('700 18px "Chakra Petch"'); await document.fonts.load('12px "Silkscreen"'); } catch(e){}
  const c = document.createElement('canvas'); c.width = 600; c.height = 750; const x = c.getContext('2d');
  const grd = ['#0b1026','#121a3a','#1d2b53','#2a1840'];
  grd.forEach((col, i) => { x.fillStyle = col; x.fillRect(0, i*750/4, 600, 750/4+1); });
  const rr = mulberry(r.age*7 + r.guests);
  for(let i=0;i<140;i++){ x.fillStyle = rr()<.2?'#ffec27':'#fff1e8'; const s = rr()<.1?4:2; x.fillRect(Math.floor(rr()*150)*4, Math.floor(rr()*120)*4, s, s); }
  x.fillStyle = '#e8b04a'; x.fillRect(16,16,568,6); x.fillRect(16,728,568,6); x.fillRect(16,16,6,718); x.fillRect(578,16,6,718);
  for(let i=0;i<10;i++){ x.fillRect(30+i*56, 30, 20, 4); x.fillRect(30+i*56, 716, 20, 4); }
  // ภาพตัวละคร
  const off = document.createElement('canvas'); off.width = 192; off.height = 108; const ox = off.getContext('2d');
  const keep = G2; G2 = ox; person(4, 20, { ...snap(p), age: Math.max(r.age, 62) >= 62 ? r.age : r.age }, 'none', 0, { still:true, noCane:true }); G2 = keep;
  x.imageSmoothingEnabled = false; x.fillStyle = 'rgba(63,209,196,.15)'; x.fillRect(220, 70, 160, 170); x.drawImage(off, 0, 0, 16, 22, 236, 70, 128, 176);
  x.textAlign = 'center'; x.fillStyle = '#ffd77a'; x.font = '700 40px "Chakra Petch", sans-serif'; x.fillText(`${r.name}${r.gen>1?` · รุ่นที่ ${r.gen}`:''}`, 300, 290);
  x.fillStyle = '#a9b0cf'; x.font = '500 22px "IBM Plex Sans Thai", "Chakra Petch", sans-serif';
  const lines = [`เกิดที่${r.prov} · ฐานะ${QS[r.q].name}`, `อาชีพ ${r.career}`, `อายุขัย ${r.age} ปี · แขกงานศพ ${r.guests.toLocaleString()} คน`];
  lines.forEach((l, i) => x.fillText(l, 300, 335 + i*34));
  x.fillStyle = '#fff1e8'; x.font = '700 30px "Chakra Petch", sans-serif'; x.fillText('ชีวิตนี้ดีกว่าคนไทย', 300, 480);
  x.fillStyle = '#ffd77a'; x.font = '700 96px "Chakra Petch", sans-serif'; x.fillText(`${r.pct}%`, 300, 580);
  if(family && family.length > 1){ x.fillStyle = '#3fd1c4'; x.font = '600 22px "Chakra Petch", sans-serif'; x.fillText(`ตระกูลรุ่นที่ ${r.gen} · จาก ${QS[family[0].q].code} สู่ ${QS[r.q].code}`, 300, 625); }
  x.fillStyle = '#e8b04a'; x.font = '700 30px "Chakra Petch", sans-serif'; x.fillText('1 ใน 65 ล้าน', 300, 690);
  return c.toDataURL('image/png');
}
function shareText(r){ return `ฉันเกิดเป็น 1 ใน 65 ล้านคน ที่${r.prov} ฐานะ${QS[r.q].name} เป็น${r.career} อยู่ถึงอายุ ${r.age} ปี มีคนมางานศพ ${r.guests} คน\nชีวิตนี้ดีกว่าคนไทย ${r.pct}%${r.gen>1?` (ตระกูลรุ่นที่ ${r.gen})`:''}`; }
async function copyText(t, btn){ try { await navigator.clipboard.writeText(t); btn.textContent = 'คัดลอกแล้ว'; } catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); btn.textContent = 'คัดลอกแล้ว'; }catch(_){ btn.textContent = 'คัดลอกไม่ได้'; } ta.remove(); } }

async function summaryScreen(r, p){
  setScene('end', null, null);
  const img = await makeCard(r, p, CUR.family);
  const parts = [ ['ความสุขเฉลี่ย', r.Jbar, 100, .30], ['สุขภาพเฉลี่ย', r.Hbar, 100, .25], ['ทรัพย์ที่ส่งต่อ', r.Pw, 100, .20], ['บุญ/บาป', (r.K+100)/2, 100, .20], ['เส้นสาย', p.C, 100, .05] ];
  return new Promise(res => {
    const el = panel(`<div class="eyebrow">สรุปชีวิต<span>${esc(r.name)} · ${r.age} ปี</span></div>` +
      `<div class="score"><span class="n">${Math.round(r.score)}</span><span class="p">ชีวิตนี้ดีกว่าคนไทย <b style="color:var(--gold2)">${r.pct}%</b></span></div>` +
      `<p class="help">${SIM_SCORES ? `เทียบกับชีวิตจำลอง ${SIM_SCORES.length} ชีวิตที่สุ่มเกิดตามสัดส่วนจริงและตัดสินใจแบบสุ่ม` : 'กำลังจำลองชีวิตเปรียบเทียบ ใช้ค่าประมาณไปก่อน'}</p>` +
      `<div class="parts">${parts.map(([n,v,m,w]) => `<div class="part"><span>${n}</span><span class="bar"><i style="width:${clamp(v/m*100,0,100)}%"></i></span><span>×${w}</span></div>`).join('')}${r.goodScore ? `<div class="part"><span>กรรมดีออกผล</span><span class="bar"><i style="width:${r.goodScore/15*100}%;background:var(--gold)"></i></span><span>+${r.goodScore}</span></div>` : ''}</div>` +
      `<div class="cardwrap"><img class="card" src="${img}" alt="การ์ดสรุปชีวิตของ ${esc(r.name)}"><div><p class="help">กดค้างที่การ์ดเพื่อบันทึกภาพ แล้วนำไปแชร์ได้</p><div class="row"><button class="go ghost" id="cpBtn">คัดลอกข้อความ</button></div></div></div>` +
      `<button class="go" id="goBtn">ไปต่อ</button>`);
    $('#cpBtn').addEventListener('click', e => copyText(shareText(r), e.currentTarget));
    const done = () => { setKeys(null); res(); }; $('#goBtn').addEventListener('click', done); setKeys(e => { if(e.key==='Enter'){ e.preventDefault(); done(); } });
    focusFirst(el); scrollPanelIntoView();
  });
}
function afterScreen(r, p){
  return new Promise(res => {
    const opts = [];
    p.kids.forEach((k, i) => { if(i < 4) opts.push({ label:`เล่นต่อเป็น${k.name} (ลูก${k.sex==='M'?'ชาย':'สาว'})`, sub:`เกิดตอนคุณอายุ ${k.born} · ค่าลูก ${Math.round(k.kv)}`, v:{ t:'child', i } }); });
    opts.push({ label:'เกิดใหม่ (ชาติหน้า)', sub: r.K < 0 ? 'บาปที่สะสมจะดึงโอกาสฐานะลงเล็กน้อย' : r.K > 0 ? 'บุญที่สะสมจะดันโอกาสฐานะขึ้นเล็กน้อย' : 'สุ่มเกิดใหม่', v:{ t:'reborn' } });
    opts.push({ label:'เริ่มชีวิตใหม่', sub:'สุ่มเกิดตามสัดส่วนจริงเต็มที่', v:{ t:'new' } });
    setScene(p.kids.length ? 'home' : 'title', null, null, p.kids.length ? { ...snap(p), age: 34, spouse:null, kids: p.kids.map(k => ({ sex:k.sex, born:34-8 })) } : null);
    const el = panel(`<div class="eyebrow">ชีวิตถัดไป</div><h2>${p.kids.length ? 'ตระกูลนี้ยังมีคนสืบต่อ' : 'ชีวิตนี้จบลงแล้ว'}</h2><div class="choices">${opts.map((c,i)=>choiceHTML(c,i)).join('')}</div>`);
    const pick = i => { setKeys(null); res(opts[i].v); };
    el.querySelectorAll('.ch').forEach(b => b.addEventListener('click', () => pick(+b.dataset.i)));
    setKeys(e => { const n = parseInt(e.key,10); if(n>=1&&n<=opts.length){ e.preventDefault(); pick(n-1); } });
    focusFirst(el);
  });
}
function treeScreen(){
  const fam = CUR.family; if(fam.length < 2) return Promise.resolve();
  const first = fam[0], last = fam[fam.length-1];
  const avg = fam.reduce((s,f)=>s+f.score,0)/fam.length;
  const moved = last.qEnd - first.q;
  return new Promise(res => {
    setScene('end', null, null);
    const el = panel(`<div class="eyebrow">ต้นไม้ครอบครัว<span>${fam.length} รุ่น</span></div><h2>ตระกูลคุณขยับจาก ${QS[first.q].code} ไป ${QS[Math.min(5,last.qEnd)].code} ใน ${fam.length} รุ่น</h2>` +
      `<p class="txt">คะแนนเฉลี่ยตระกูล ${Math.round(avg)} · บุญสะสมรวม ${Math.round(fam.reduce((s,f)=>s+f.K,0))}${moved > 0 ? ' · ลูกหลานไต่ฐานะขึ้นได้' : moved < 0 ? ' · ฐานะของตระกูลถดถอยลง' : ''}</p>` +
      `<div class="tree">${fam.map(f => `<div class="gen"><span class="g">GEN ${f.gen}</span><span><b>${esc(f.name)}</b> <span class="d">${esc(f.prov)} · ${QS[f.q].name} · ${esc(f.career)} · ${f.age} ปี${f.anyFruit?' · กรรมดีออกผล':''}${f.ledger.some(l=>!l.good&&l.erupt)?' · กรรมชั่วปะทุ':''}</span></span><span class="sc">${f.pct}%</span></div>`).join('')}</div>` +
      `<button class="go" id="goBtn">เริ่มชีวิตใหม่</button>`);
    const done = () => { setKeys(null); res(); }; $('#goBtn').addEventListener('click', done); setKeys(e => { if(e.key==='Enter'){ e.preventDefault(); done(); } }); focusFirst(el);
  });
}

function rebornPlayer(K){
  const shift = Math.round(Math.abs(K)/10) * 2; const p0 = newPlayer();
  if(!shift) return p0;
  const tier = TIERS[p0.tier]; const q = tier.q.slice();
  if(K < 0){ const m = Math.min(q[4], shift); q[4] -= m; q[0] += m; } else { const m = Math.min(q[0], shift); q[0] -= m; q[4] += m; }
  const r = Math.random()*q.reduce((s,v)=>s+v,0); let acc = 0, qi = 0; for(let i=0;i<6;i++){ acc += q[i]; if(r <= acc){ qi = i; break; } }
  return newPlayer({ tier: p0.tier, prov: p0.prov, q: qi, sex: p0.sex, religion: p0.religion });
}
async function playFrom(p){
  while(true){
    CUR.p = p;
    const r = await live(p, UI);
    CUR.family.push(r);
    await summaryScreen(r, p);
    const next = await afterScreen(r, p);
    if(next.t === 'child'){ p = makeChild(p, r, next.i); continue; }
    await treeScreen(); CUR.family = [];
    p = next.t === 'reborn' ? rebornPlayer(r.K) : newPlayer();
  }
}
async function boot(){
  $('#simnote').textContent = 'กำลังจำลองชีวิตเปรียบเทียบ…';
  simulateLives(160, s => { SIM_SCORES = s; $('#simnote').textContent = `เทียบผลกับชีวิตจำลอง ${s.length} ชีวิต`; });
  await titleScreen();
  await playFrom(newPlayer());
}
boot().catch(e => { console.error(e); panel(`<h2>เกมสะดุด</h2><p class="txt">${esc(e.message)}</p><button class="go" onclick="location.reload()">เริ่มใหม่</button>`); });
</script>
