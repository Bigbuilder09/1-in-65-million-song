async function freeTime(p, io){
  if(p.status.prison || !p.career) return;
  const items = variedFreeOpts(p);
  let picks = await io.multi({ kind:'life', bg: CAREERS[p.career].bg || 'city', title:'ช่วงนี้ใช้เวลาว่างกับอะไร', text:'สุ่มกิจกรรมใหม่ 6 อย่าง ไม่ซ้ำชุดก่อน · เลือกได้ไม่เกิน 2 อย่าง หรือพักไว้ก่อนก็ได้', items: prepChoices(p, items), max:2, p, pend:p.pend.splice(0) });
  picks = [...new Set(picks)].filter(i=>Number.isInteger(i) && items[i] && !prepChoices(p,[items[i]])[0].disabled).slice(0, 2);
  if(!picks.length){ tell(p, 'เวลาว่างทั้งหมดหมดไปกับงานและการนอน'); return; }
  const lines = [];
  for(const i of picks){ const it = items[i]; spend(p, it.cost); it.run(); lines.push(it.st); log(p, it.label); }
  tell(p, lines.join(' · '));
}
// A replay record pins economic rules, so old choices and RNG remain aligned.
function economyV1(){
  return typeof SaveGame === 'undefined' || !SaveGame.active || SaveGame.active.game.economyVersion === 1;
}
function annualLivingFloor(p){ return livingFloor(p) * (economyV1() ? 12 : 1); }
// Extra staff, maintenance and coordination grow with the business, not savings.
// These are additional operating costs, separate from household living costs.
function businessProfile(p){
  const monthly=Math.max(0,curIncome(p),p.cOut==='bad' ? (p.lastSalary||0) : 0);
  const tier=monthly>=1000000 ? 3 : monthly>=300000 ? 2 : monthly>=100000 ? 1 : 0;
  const rate=[.03,.05,.08,.10][tier];
  return {monthly,tier,name:['ร้านเล็ก','กิจการกำลังโต','กิจการขนาดใหญ่','เครือข่ายกิจการ'][tier],
    annualCost:Math.round(monthly*12*rate),risk:[.10,.12,.15,.18][tier],
    lossMonths:[6,7,9,12][tier],restartCost:Math.round(Math.max(500000,monthly*6))};
}
function businessLossChance(profile,vf,world=1){ return clamp(profile.risk*vf*world,.04,.40); }
function businessRunningCost(p,profile,notes,quiet){
  if(!economyV1() || p.career!=='biz' || p.age>=60 || p.status.prison || p.unemployed>0 || !profile || !profile.annualCost)return 0;
  const amount=Math.round(profile.annualCost*worldCostF(p));

}

const LIV = [0, 12000, 10000, 9000, 7500, 6500, 6500];
function livingFloor(p){
  const adults = 1 + ((p.spouse && !p.spouse.separated) ? 1 : 0);
  return LIV[p.tier] * adults * [0.85, 1, 1.4][p.lifestyle] * (p.house && p.house.q >= 4 ? 1.2 : 1);
}

function dimin(cur, d){ if(d <= 0) return d; const f = clamp((115 - cur) / 65, .3, 1); return Math.max(1, Math.round(d * f)); }

function policeArchetype(r, p){
  if(!p.flags.policePath) return null;

  if(ever && p.flags.policePath==='bad' && E > 10000000) return { t:'นายตำรวจในบัญชีส่วย', d:'บ้านใหญ่ รถใหม่ และโทรศัพท์ที่ต้องรับทุกสาย ไม่มีใครเปิดบัญชีของคุณจนวันสุดท้าย' };
  if(ever && p.flags.policePath==='good') return { t:'คนที่ถอนตัวจากวงส่วย', d:'คุณหยุดรับเงินกลางทาง แม้ชื่อในบัญชีเก่าจะยังตามหลอกหลอน' };

  if((p.flags.casesWrong||0) >= 2) return { t:'ตำรวจที่ปิดคดีผิดตัว', d:'คุณไม่เคยรับซอง แต่มีคนติดคุกเพราะสำนวนที่คุณรีบสรุป' };

  return null;
}

function heat(p){ return p.flags.heat || 0; }
function addHeat(p, d){ p.flags.heat = clamp(heat(p) + d, 0, 100); }
// เรียกทุกปีจาก years(): บาปสะสม ความร้อนแรง และโอกาสโดนจับหรือถูกเก็บ
function crimeYear(p, notes){
  if(p.career !== 'crime' || p.status.prison || p.age >= 60) { if(heat(p) > 0) addHeat(p, -3); return; }
  const rank = p.flags.crimeRank || 0;

function statWorkF(p){
  let f = 1;
  if(p.H < 35) f *= .75 + p.H / 140;      // H 0 → −25% · H 35 → ปกติ
  else if(p.H >= 75) f *= 1.05;
  if(p.J < 25) f *= .9;

function statNote(p, notes, key, k, t){
  p.flags.sn = p.flags.sn || {};

  p.flags.sn[key] = p.age; notes.push({ k, t });
}
function statYear(p, notes){
  if(p.age < 15) return;
  const working = p.age >= 22 && p.age < 60 && !!p.career && !p.status.prison;
  if(p.H < 35){ addMoney(p, -lm(p, (35 - p.H) * 600)); statNote(p, notes, 'lowH', 'H', working ? 'สุขภาพไม่ดี ลาป่วยบ่อยจนรายได้หาย และค่ารักษาเพิ่มขึ้นทุกปี' : 'สุขภาพไม่ดี ค่ายาและค่าหมอเพิ่มขึ้นทุกปี'); }
  else if(p.H >= 75 && working) statNote(p, notes, 'hiH', 'H', 'ร่างกายแข็งแรง ทำงานได้เต็มที่ ไม่ค่อยต้องลาป่วย');
  if(p.J < 25){
    if(!p.status.depressed && chance(.08)){ stOn(p, 'depressed'); notes.push({ k:'J', t:'ความทุกข์สะสมจนกลายเป็นภาวะซึมเศร้า' }); }
    else statNote(p, notes, 'lowJ', 'J', working ? 'ใจไม่อยู่กับงาน ผลงานตกจนรายได้หายไปบ้าง' : 'วันส่วนใหญ่ผ่านไปอย่างไม่มีแรง');
    if(chance(.3)) p.H -= 1;
  } else if(p.J >= 75){ p.H += .5; if(chance(.25)) p.C = Math.min(100, p.C + 1); statNote(p, notes, 'hiJ', 'J', 'อารมณ์ดีจนคนรอบตัวอยากอยู่ใกล้ สุขภาพก็ดีตามไปด้วย'); }
  if(p.status.depressed && p.J >= 55 && chance(.25)){ stOff(p, 'depressed'); notes.push({ k:'J', t:'ภาวะซึมเศร้าค่อย ๆ หายไป' }); }
  if(!working) return;
  if(p.S >= 70 && !['farm', 'crime', 'pol'].includes(p.career) && chance(.03 + (p.S - 70) * .003)){ p.incomeBoost *= 1.06; statNote(p, notes, 'hiS', 'S', 'ฝีมือของคุณเป็นที่รู้กันในวงการ ได้งานใหญ่และขึ้นค่าตัว'); }
  else if(p.S < 30 && ['office', 'factory', 'biz', 'influ'].includes(p.career) && chance(.05)){ p.incomeBoost *= .95; statNote(p, notes, 'lowS', 'S', 'ทักษะตามงานไม่ทัน ถูกลดบทบาทลง'); }
  if(p.unemployed > 0 && p.C >= 65 && chance(.5)){ p.unemployed = 0; notes.push({ k:'C', t:'คนรู้จักฝากงานให้ ได้งานใหม่เร็วกว่าที่คิด' }); }
  if(p.C < 20){ p.J -= 1; statNote(p, notes, 'lowC', 'C', 'ไม่ค่อยมีใครให้พึ่ง เวลามีปัญหาต้องแบกไว้คนเดียว'); }
}

function wld(p){ if(!p.world) p.world = { party:null, junta:0, nextElec: 18 + randi(0, 3), mods:[], seen:{}, last:-9 }; return p.world; }
function addMod(p, m){ const w = wld(p); w.mods = w.mods.filter(x => x.id !== m.id); w.mods.push({ ...m, until: p.age + (m.years || 2) }); return w.mods[w.mods.length - 1]; }
function worldIncomeF(p){ if(!p.world) return 1; let f = 1; for(const m of p.world.mods){ if(m.inc){ const v = m.inc[p.career] ?? m.inc.all; if(v) f *= v; } if(m.tier && m.tier[p.tier]) f *= m.tier[p.tier]; } return f; }
function worldCostF(p){ return p.world ? p.world.mods.reduce((f, m) => f * (m.cost || 1), 1) : 1; }
function worldRiskF(p){ return p.world ? p.world.mods.reduce((f, m) => f * (m.risk || 1), 1) : 1; }
function worldCashYear(p){ return p.world ? p.world.mods.reduce((s, m) => s + (m.cash ? m.cash(p) : 0), 0) : 0; }
function modText(p, m){
  const out = [];
  const f = (m.inc ? (m.inc[p.career] ?? m.inc.all ?? 1) : 1) * (m.tier ? (m.tier[p.tier] ?? 1) : 1);
  if(p.career && p.age < 60 && Math.abs(f - 1) > .004) out.push(`รายได้คุณ ${f > 1 ? '+' : '−'}${Math.round(Math.abs(f - 1) * 100)}%`);
  if(m.cost && m.cost !== 1) out.push(`ค่าครองชีพ ${m.cost > 1 ? '+' : '−'}${Math.round(Math.abs(m.cost - 1) * 100)}%`);
  const c = m.cash ? m.cash(p) : 0; if(c) out.push(`เงินช่วยเหลือ ฿+${baht(c)}/ปี`);
  if(m.risk && m.risk > 1 && (p.career === 'crime' || p.tagsBad.some(t => t.type === 'corrupt'))) out.push('เสี่ยงโดนจับมากขึ้น');
  return out.join(' · ');
}
function worldHTML(p){
  if(!p.world || !p.world.mods.length) return '';
  const parts = p.world.mods.map(m => { const t = modText(p, m); return m.label + (t ? ` (${t})` : ''); });
  return `<p class="help">${ic('pin')} บ้านเมืองตอนนี้: ${rich(parts.join(' · '))}</p>`;
}
const askW = (p, io, title, text, choices, bg = 'news', kind = 'world') => choose(p, io, { kind, bg, title, text, choices, noStory:true });

function worldYear(p, notes){
  if(p.age < 18) return;
  const w = wld(p);
  const keep = [];
  for(const m of w.mods){ if(p.age < m.until) keep.push(m); else if(m.endText) notes.push({ k:'pin', t:m.endText }); }
  w.mods = keep;
  if(w.junta){ if(p.age >= w.junta){ w.junta = 0; w.nextElec = p.age; } }
  else if(p.age >= 20 && chance(.02)){ p._world = WORLD_EVENTS[0]; return; }
  if(!w.junta && p.age >= w.nextElec){ w.nextElec = p.age + 4; p._elec = true; return; }
  if(p.age - w.last >= 3 && chance(.14)){
    const pool = WORLD_EVENTS.filter(e => e.id !== 'coup' && !w.seen[e.id] && e.w(p) !== null);
    if(pool.length){ const e = wpick(pool, x => Math.max(1, x.w(p))); w.seen[e.id] = true; w.last = p.age; p._world = e; }
  }
}

async function election(p, io){
  const w = wld(p);
  if(p.career === 'pol' && p.age < 60 && !p.status.prison) await polCampaign(p, io);
  const keys = Object.keys(PARTIES);
  let vote = null;
  w.elecN = (w.elecN || 0) + 1;
  const ask = p.age < 80 && !p.status.prison && (p.career === 'pol' || w.elecN === 1 || w.elecN % 2 === 0 || w.junta === 0 && w.party === null);
  if(!ask && w.lastVote && PARTIES[w.lastVote]) vote = w.lastVote;
  if(ask){
    const buy = p.career !== 'pol' && chance(p.tier >= 4 ? .45 : .25);
    const choices = keys.map(k => ({ label:PARTIES[k].name, sub:PARTIES[k].pitch, k, cond: p.career !== 'pol' || !p.flags.polParty || k === p.flags.polParty, condText:'คุณสังกัดพรรคอื่น' }));
    choices.push({ label:'ไม่ไปใช้สิทธิ์', sub:'อยู่บ้านพักผ่อน', k:'none' });
    if(buy) choices.push({ label:`รับเงินหัวคะแนน ฿${baht(lm(p, 500))} แล้วกาตามสั่ง`, sub:'ได้เงินทันที · ผิดกฎหมาย', k:'sell' });
    const c = await choose(p, io, { kind:'vote', bg:'vote', title:'วันเลือกตั้งทั่วไป', text:`คนไทยหลายสิบล้านคนออกไปเข้าคิวหน้าหน่วยเลือกตั้ง${buy ? ' หัวคะแนนเดินแจกเงินกันตั้งแต่เมื่อคืน' : ''}`, choices, noStory:true });
    if(c.k === 'sell'){ fx(p, { m:lm(p, 500), K:-3 }); tagBad(p, 'corrupt', 'ขายเสียงเลือกตั้ง', lm(p, 500)); }
    else if(PARTIES[c.k]){ vote = c.k; fx(p, { K:1 }); }
    w.lastVote = vote;
  }
  const win = wpick(keys, k => PARTY_W[k][p.tier] + (k === vote ? .05 : 0) - (k === w.party ? .03 : 0));
  w.party = win; w.mods = w.mods.filter(m => !m.party);
  const pol = PARTY_POLICY[win];
  const m = addMod(p, { id:'gov', label:`รัฐบาล${PARTIES[win].short}`, years:4, inc:pol.inc, tier:pol.tier, cost:pol.cost, risk:pol.risk, cash:pol.cash, party:true });
  log(p, `${PARTIES[win].name}ชนะเลือกตั้ง`);
  if(pol.onWin) pol.onWin(p);
  const mine = modText(p, m);
  const txt = `${PARTIES[win].name}ชนะเลือกตั้ง${vote ? (vote === win ? ' พรรคที่คุณเลือก' : '') : ''} · ${pol.lines.join(' · ')}${mine ? ` · ผลกับคุณ: ${mine}` : ''}`;
  if(p.career === 'pol'){ await say(p, io, { kind:'world', bg:'parliament', title:`${PARTIES[win].name}ชนะเลือกตั้ง`, text: pol.lines.join('\n') + (mine ? `\nผลกับคุณ: ${mine}` : '') }); await polAfterElection(p, io, win); }
  else note(p, txt);
}

function polBeats(p, io){
  const evs = drawEvents(p, POL_EVENTS.map(e => ({ ...e, w: () => 1 })), 3);
  const ages = distinctAges(evs.length, p.age + 2, Math.min(58, p.age + 16));
  evs.forEach((e, i) => beats_later(p, ages[i] - p.age, async () => { if(p.career !== 'pol' || p.status.prison) return; const real = POL_EVENTS.find(x => x.id === e.id); if(real.w(p) === null) return; await runEvent(p, io, real); }));
}

function twistBeats(p, io, beats, pool, n, a, b){

}

function autoBg(o, p){
  if(!p) return 'home';
  const t = String((o.head && o.head.title) || o.title || '');
  const careerBg = p.career && CAREERS[p.career] ? CAREERS[p.career].bg : 'office';
  const rules = [
    [/แต่ง|สินสอด|สมรส/, 'wedding'], [/วัด|บุญ|บวช|ธรรม|ผ้าป่า|ศีล/, isBuddhist(p) ? 'temple' : 'village'],
    [/เลือกตั้ง|พรรค|การเมือง|หาเสียง|สภา/, 'rally'], [/หวย|ลงทุน|หุ้น|คริปโต|แชร์|กู้|หนี้|ออม|เงินเก็บ|ประกัน|กองทุน|เกษียณ/, 'bank'],
    [/ซื้อรถ|ขับรถ|มอเตอร์ไซค์/, 'road'], [/ที่ดิน|บ้านใหม่|ซื้อบ้าน/, 'home'], [/ขาย|ร้าน|ธุรกิจ|ตลาด|แม่ค้า|สาขา|ลูกค้า/, 'market'],
    [/ลูก|หลาน|พ่อแม่|ครอบครัว|เลี้ยง/, 'kitchen'], [/เพื่อน|หาคู่|แอป|เดท|ชมรม/, 'cafe'],
    [/เรียน|สอบ|คอร์ส|อบรม|การบ้าน/, p.age < 18 ? 'school' : p.age < 23 ? 'uni' : 'cafe'],
    [/ป่วย|สุขภาพ|ออกกำลัง|หมอ|โรงพยาบาล/, 'hospital'], [/เที่ยว|ต่างประเทศ|เครื่องบิน/, 'airport'],
    [/ทำงาน|ตำแหน่ง|OT|เจ้านาย|อาชีพ|เงินเดือน/, careerBg],
  ];
  for(const [re, bg] of rules) if(re.test(t)) return bg;
  const pool = p.age < 18 ? ['home', 'school', 'kitchen', 'village'] : p.age < 23 ? ['uni', 'dorm', 'cafe', 'city', 'home'] : p.age < 60 ? ['home', 'kitchen', 'cafe', 'market', 'city', careerBg] : ['home', 'kitchen', 'village', 'market', 'oldhome'];
  let h = 0; for(const ch of t) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return pool[h % pool.length];
}

const W = 192, Hh = 108;
const P8 = { k:'#000000', n:'#1D2B53', m:'#7E2553', g:'#008751', b:'#AB5236', d:'#5F574F', l:'#C2C3C7', w:'#FFF1E8', r:'#FF004D', o:'#FFA300', y:'#FFEC27', G:'#00E436', B:'#29ADFF', L:'#83769C', p:'#FF77A8', s:'#FFCCAA',
  nn:'#0b1026', n2:'#16203f', dd:'#3a3530', bb:'#7a3a22', gg:'#0d5a3a', ss:'#E0A070', s3:'#B86F50', cream:'#f3e2b8', gold:'#e8b04a', teal:'#3fd1c4', purple:'#9b5de5', mud:'#6b4a2b' };
let G2 = null;
function R(x,y,w,h,c){ G2.fillStyle = ART_COLORS[c] || c; G2.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h)); }
function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function routeEligible(p,route){return !p.status.prison && (['cadet','sports'].includes(route) ? p.stage===2 && p.uni===route : p.career===route && p.age<60);}
async function playRouteChapter(p,io,route,event){
 if(!routeEligible(p,route))return;
 const [id,title,bg,intro,options]=event;
 const seen=p.flags.routeChapters||(p.flags.routeChapters=[]);if(seen.includes(id))return;
 // Fourth options (risky shortcuts) belong to story v2; the first three keep their indexes for old saves.
 const live=storyV2()?options:options.slice(0,3);
 const choices=live.map(([label,effect,result,cost=0,flag,risk],k)=>({label,k,cost,loan:false,sub:[fxText(effect),risk?`โอกาสพลาด ${Math.round(risk.risk*100)}%: ${fxText(risk.fail)}`:''].filter(Boolean).join(' · ')}));
 const c=await choose(p,io,{kind:'life',bg,title,text:typeof intro==='function'?intro(p):intro,choices});
 const [,effect,result,,flag,risk]=live[c.k];fx(p,effect);if(flag)p.flags[flag]=true;seen.push(id);log(p,title);
 if(risk){
  if(risk.K)fx(p,{K:risk.K});
  if(chance(risk.risk)){fx(p,risk.fail);note(p,risk.failText);
   if(risk.warn)p.flags.schoolWarnings=(p.flags.schoolWarnings||0)+risk.warn;
   if(risk.disc)p.flags.disciplineUntil=Math.max(p.flags.disciplineUntil||0,p.age+risk.disc);
   if(risk.income)p.incomeBoost*=risk.income;
   if(risk.tag)tagBad(p,risk.tag,title,Math.abs(effect.m||0));
  }else note(p,result);
 }else note(p,result);
 // Previously established relationships and preparation add a small, explicit payoff.
 if(id==='police_partner'&&p.flags.cadetBuddy){fx(p,{C:3});note(p,'ความไว้ใจจากสมัยนายร้อยช่วยให้ทำงานเข้าขา: C+3');}
 if(id==='athlete_contract'&&p.flags.sportPortfolio){fx(p,{m:20000});note(p,'ผลงานในพอร์ตช่วยต่อรองเงินเซ็นสัญญาเพิ่ม ฿20,000');}
 if(id==='coach_first'&&p.flags.coachMaterials){fx(p,{S:3});note(p,'คลังวิดีโอที่เตรียมไว้ช่วยวางบทเรียน: S+3');}
 if(id==='police_promotion'&&p.flags.cadetIntegrity){fx(p,{C:3});note(p,'ประวัติความซื่อตรงตั้งแต่เรียนช่วยให้ทีมเชื่อมั่น: C+3');}
}
function extraStudyChapters(p,io,beats){
 if(!['cadet','sports'].includes(p.uni))return;
 const route=p.uni;
 ROUTE_CHAPTERS[route].forEach((e,i)=>beats.push({age:18+i,run:()=>playRouteChapter(p,io,route,e)}));
}
function extraCareerChapters(p,io,beats){
 if(policeProgressionEnabled())extraPoliceProgression(p,io,beats);
 if(storyV3())extraPoliceCases(p,io,beats);
 // Choose at execution time: career switches never show the former job's events.
 [24,26,29,32,34,37,41,45,49,53,57].filter(age=>age>=p.age).forEach(age=>beats.push({age,run:async()=>{
   const route=p.career;if(!['police','athlete','coach'].includes(route)||!routeEligible(p,route))return;
   if(route==='police' && p.flags.policePath){await policeChapter(p,io);return;}
   const pool=ROUTE_CHAPTERS[route].filter(e=>!(p.flags.routeChapters||[]).includes(e[0]));
   if(!pool.length)return;
   // Keep setup chapters before their payoffs; later chapters vary between lives.
   const e=pool.length===ROUTE_CHAPTERS[route].length?pool[0]:pickOne(pool);
   await playRouteChapter(p,io,route,e);
 }}));
}

function policeHeat(p, delta=0){ return p.flags.policeHeat=clamp((p.flags.policeHeat||0)+delta,0,100); }
function policeDirtyMoney(p, amount, sin=18, heatGain=12, label='รับส่วยในเครื่องแบบ'){
  p.flags.policePath='bad'; p.flags.policeEverBad=true;
  p.flags.policeDirty=(p.flags.policeDirty||0)+amount;
  fx(p,{m:amount,K:-sin,J:-3}); policeHeat(p,heatGain);
  if(storyV2()&&label==='ส่วนแบ่งส่วยประจำปี'){
    // Yearly kickbacks form one ledger entry, so the funeral claws back the total once.
    const t=p.tagsBad[p.flags.policeAnnualTag];
    if(t&&t.police&&!t.settled)t.amount+=amount;
    else{tagBad(p,'corrupt','ส่วนแบ่งส่วยรายปีในเครื่องแบบ',amount);const n=p.tagsBad.length-1;p.tagsBad[n].police=true;p.tagsBad[n].claw=1;p.flags.policeAnnualTag=n;}
  }else{tagBad(p,'corrupt',label,amount);if(storyV2())p.tagsBad[p.tagsBad.length-1].police=true;}
  note(p,`เงินนอกบัญชี ฿${baht(amount)} · ความร้อนแรง ${policeHeat(p)}/100 · เงินนี้มีคนรอทวงบุญคุณ`);
}
function policeBribePaid(p,amount,label){
  p.flags.policeEverBad=true;fx(p,{K:-18});policeHeat(p,14);

}
function policeCaseClosed(p){
  // A conviction settles the old ledger: no second arrest or posthumous claw-back for the same money.
  p.flags.policeCaseClosed=true;p.flags.policeHeat=0;p.flags.policeDirty=0;
  for(const t of p.tagsBad)if(t.police)t.settled=true;
}

function policeYear(p,notes){
  if(!p.flags.policePath)return;
  const working=p.career==='police'&&p.age<60&&!p.status.prison&&!p.unemployed;
  const v2=storyV2();
  if(working&&p.flags.policePath==='good'){
    fx(p,v2?{m:-18000,K:2}:{m:-18000,K:2,H:-.5,J:-1});
    if(p.age%3===0)notes.push(isCorrections(p)?'ค่าเดินทางและงานเวรเรือนจำที่ต้องออกเอง ฿18,000 ต่อปี ศิริยังรอเบิกค่าเวชภัณฑ์':'เงินเดือนออกแล้ว แต่ค่าน้ำมันลงพื้นที่ ฿18,000 ต่อปีไม่มีใครเบิกให้ มนัสเพิ่งเปลี่ยนรถใหม่');
  }
  if(working&&p.flags.policePath==='bad'){
    const rank=p.flags.policeRank||0, amount=600000*(rank+1);
    policeDirtyMoney(p,amount,12+rank*5,v2?4+rank*2:8+rank*3,'ส่วนแบ่งส่วยประจำปี');
    notes.push(`ส่วยนอกเงินเดือน ฿${baht(amount)} · ความร้อนแรง ${policeHeat(p)}/100`);
  }else if(p.flags.policeEverBad)policeHeat(p,v2?-5:-3);
  // Leaving the network or retiring never immediately erases old evidence.
  if(!p.flags.policeEverBad||p.status.prison||p.age>=75||policeHeat(p)<=0)return;
  if(v2&&p.flags.policeCaseClosed&&!(working&&p.flags.policePath==='bad'))return;
  const h=policeHeat(p), active=working&&p.flags.policePath==='bad';
  if(chance(v2?Math.min(.18,.005+h*.0015):Math.min(.28,.02+h*.0022))){p._policeBust=true;return;}
  if(chance((active?.004:.002)+h*(active?.0003:.00015))){throw new Death(active?'ถูกเครือข่ายส่วยลอบเก็บ หลังสงสัยว่าคุณจะเปิดปาก':'ถูกอดีตเครือข่ายส่วยลอบเก็บ แม้คุณถอนตัวแล้ว');}
}
async function policeBust(p,io,opts={}){
  const v2=storyV2(),surrender=v2&&opts.surrender;

    else note(p,'ศาลรอการลงโทษ คดีนี้ถูกปิดพร้อมเงินที่คืน คุณกลับมาใช้ชีวิตโดยไม่ต้องรอว่าวันไหนจะถูกเรียกอีก');

  const seized=Math.min(Math.max(0,p.money),Math.round((p.flags.policeDirty||0)*.5));
  fx(p,{m:-seized,C:-15,J:-15});p.flags.policeDirty=Math.max(0,(p.flags.policeDirty||0)-seized);

  await arrested(p,io,isCorrections(p)?'ผู้ตรวจการพบเส้นทางเงินในเรือนจำ ทั้งข้อหารับสินบนและใช้อำนาจโดยมิชอบ':'หมวดน้ำส่งสำเนาหลักฐานให้คณะสอบสวน เส้นทางเงินโยงมาถึงคุณ ทั้งข้อหารับสินบนและใช้อำนาจโดยมิชอบ',3);
  if(p.status.prison){p.flags.policePath='good';p.flags.policeRank=0;note(p,v2?'ถูกให้ออกจากราชการและเสียสิทธิบำนาญ คดีส่วยถูกตัดสินแล้ว เงินก้อนเดิมจะไม่ถูกนำมาฟ้องซ้ำ':'ถูกให้ออกจากราชการและเสียสิทธิบำนาญ เครือข่ายส่วยตัดชื่อคุณ แต่หลักฐานเก่ายังอยู่');if(v2)policeCaseClosed(p);}
  else note(p,'คดีครั้งนี้ยังเอาผิดไม่ได้ แต่พยานและร่องรอยเงินไม่ได้หายไป ความเสี่ยงยังตามคุณต่อ');

async function policeChapter(p,io){
 if(!routeEligible(p,'police')||!p.flags.policePath)return;
 if(isCorrections(p)){await correctionsChapter(p,io);return;}
 const path=p.flags.policePath,seen=p.flags.policeChapters||(p.flags.policeChapters=[]);
 const list=POLICE_STORIES[path];let original;
 if(storyV2()){
  // Opening and finale stay fixed; middle chapters come in a different order each life.
  const unseen=list.filter(e=>!seen.includes(e[0])),ready=unseen.filter(e=>(POLICE_AFTER[e[0]]||[]).every(id=>seen.includes(id)));
  original=ready.length?pickOne(ready):unseen[0];
 }else original=list.find(e=>!seen.includes(e[0]));
 const event=original?policeEventFor(p,original):null;
 if(!event){
  if(!storyV2()){await policeTemptation(p,io);return;}
  // After the main arc: callbacks to earlier choices first, then at most two late temptations.
  if(await policePayoff(p,io))return;
  if((p.flags.policeTempts||0)<2)await policeTemptation(p,io);
  return;
 }
 const [id,title,intro,options]=event;
 const c=await choose(p,io,{kind:'life',bg:policeStoryScene(id,path),title,text:intro,choices:options.map(([label,effect,result,cost=0,action,amount],k)=>({label,k,cost,loan:false,sub:[fxText(effect),amount?'ความร้อนแรงเพิ่ม · เสี่ยงถูกจับและถูกเก็บ':action==='reform'?'หยุดส่วยทันที · คดีเก่าและภัยจากเครือข่ายยังอยู่':action==='surrender'?'ถูกสอบสวน · เสี่ยงติดคุก 3–15 ปีและเสียบำนาญ':''].filter(Boolean).join(' · ')}))});
 const [,effect,result,,action,amount]=options[c.k];
 fx(p,effect);seen.push(id);log(p,title);note(p,result);
 if(policeProgressionEnabled()&&path==='good'&&!amount)p.flags.serviceMerit=(p.flags.serviceMerit||0)+1;
 if(amount){if(action==='rise')p.flags.policeRank=Math.min(3,(p.flags.policeRank||0)+1);policeDirtyMoney(p,amount,action==='dirtyHarm'?32:22,storyV2()?(action==='dirtyHarm'?18:12):(action==='dirtyHarm'?24:16),title);}
 if(action==='dirtyBill')fx(p,{m:-event.repairBill});
 if(action==='repairLoan'){p.debt.f+=event.repairBill;note(p,`หนี้ในระบบเพิ่ม ฿${baht(event.repairBill)} · ดอกเบี้ย 7%/ปี`);}
 if(action==='shield')p.flags.policeShield=true;
 if(action==='testify')p.flags.policeTestified=true;
 if(action==='heat')policeHeat(p,15);
 if(action==='cool')policeHeat(p,-5);
 if(action==='reform'||action==='surrender'){p.flags.policePath='good';p.flags.policeRank=0;log(p,'เลิกรับส่วย แต่ยังต้องรับผลจากอดีต');}
 if(action==='surrender')await policeBust(p,io,{surrender:true});
}
async function policeTemptation(p,io){
 if(isCorrections(p)){await correctionsTemptation(p,io);return;}
 if(storyV2())p.flags.policeTempts=(p.flags.policeTempts||0)+1;
 const bad=p.flags.policePath==='bad',amount=bad?2500000:1200000;
 const c=await choose(p,io,{kind:'event',bg:bad?'police_network':'police_honest',title:bad?'งานใหม่จากเครือข่ายเก่า':'เงินก้อนที่มากกว่าเงินเดือนหลายปี',text:bad?'คนของเฮียเส็งนำเงินมาวาง คราวนี้เขาขอให้คุณช่วยปิดตาให้รถผ่านหนึ่งคืน':'งานล้นโต๊ะ เงินเก็บแทบไม่เพิ่ม คนของเฮียเส็งยังโทรมาถามว่าคุณเปลี่ยนใจหรือยัง',choices:[
  {label:`รับเงิน ฿${baht(amount)}`,sub:'เข้าวงส่วย · ความร้อนแรง +16 · เสี่ยงคุกและถูกเก็บ',k:'take'},
  {label:bad?'ปฏิเสธงานและถอนตัวจากวง':'ปฏิเสธและทำสำนวนต่อ',sub:bad?'หยุดรายได้ส่วย · ภัยจากอดีตยังอยู่':'H−3 J−3 · เงินเดือนเท่าเดิม',k:'no'}]});
 if(c.k==='take')policeDirtyMoney(p,amount,22,16,'รับข้อเสนอเครือข่ายส่วย');
 else {fx(p,{H:-3,J:-3,K:3});if(bad){p.flags.policePath='good';p.flags.policeRank=0;}note(p,'คุณปฏิเสธเงินก้อนนั้น ชีวิตยังต้องเดินต่อด้วยเงินเดือนและงานที่ค้างอยู่');}
}

async function correctionsChapter(p,io){
 if(!publicSafetyReady(p)||!isCorrections(p))return;
 const seen=p.flags.correctionsChapters||(p.flags.correctionsChapters=[]);
 const event=CORRECTIONS_STORIES.find(e=>!seen.includes(e[0]));
 if(!event){if(!storyV2()||(p.flags.policeTempts||0)<2){if(storyV2())p.flags.policeTempts=(p.flags.policeTempts||0)+1;await correctionsTemptation(p,io);}return;}
 const [id,title,bg,intro,options]=event;
 const c=await choose(p,io,{kind:'life',bg,title,text:`${publicSafetyName(p)}\n${p.flags.policePath==='bad'?'เครือข่ายเดิมกำลังรอว่าคุณจะช่วยใครในครั้งนี้':'งบกับกำลังคนจำกัด แต่หน้าที่รอคุณอยู่ทุกเวร'}\n${intro}`,choices:options.map(([label,effect,result,cost=0,action,amount],k)=>({label,k,cost,loan:false,sub:[fxText(effect),amount?`฿+${baht(amount)} · เข้าสายทุจริต · เสี่ยงคดีและถูกเก็บ`:action==='audit'?'อดีตทุจริตอาจนำไปสู่การจับกุม':action==='reform'?'หยุดรับส่วย · คดีเก่ายังอยู่':''].filter(Boolean).join(' · ')}))});
 const [,effect,result,,action,amount]=options[c.k];seen.push(id);fx(p,effect);log(p,title);note(p,result);
 if(action==='merit'){p.flags.serviceMerit=(p.flags.serviceMerit||0)+1;tagGood(p,'honest',title);}
 if(amount){policeDirtyMoney(p,amount,action==='dirtyHarm'?32:22,action==='dirtyHarm'?24:16,title);p.flags.policeRank=Math.min(3,(p.flags.policeRank||0)+1);}
 if(action==='reform'){p.flags.policePath='good';p.flags.policeRank=0;if(p.flags.policeEverBad&&!(storyV2()&&p.flags.policeCaseClosed))await policeBust(p,io,{surrender:true});}
 if(action==='audit'&&p.flags.policeEverBad&&!(storyV2()&&p.flags.policeCaseClosed))await policeBust(p,io,{surrender:true});
}
async function correctionsTemptation(p,io){
 if(!publicSafetyReady(p)||!isCorrections(p))return;
 const c=await choose(p,io,{kind:'event',bg:'prison_office',title:'ซองบนโต๊ะเวรเรือนจำ',text:'ผู้รับเหมาขอให้คุณเซ็นรับของก่อนตรวจจริง ศิริเตือนว่าสัปดาห์ก่อนของมาไม่ครบ และชื่อคุณจะอยู่บนเอกสาร',choices:[
  {label:'ตรวจของและไม่รับซอง',sub:'H−3 J−3 · คงเงินเดือนและตำแหน่งเดิม',k:'no'},
  {label:'รับซอง ฿1,500,000',sub:'เข้าวงส่วย · ความร้อนแรง +16 · เสี่ยงคุกและถูกเก็บ',k:'yes'},
  {label:'ถอนตัวจากวงและเปิดบัญชีให้ตรวจ',sub:'หยุดส่วย · ถ้าเคยทุจริตจะเข้าสู่การสอบสวน',k:'out'}]});
 if(c.k==='yes')policeDirtyMoney(p,1500000,22,16,'เซ็นรับของเรือนจำโดยไม่ตรวจ');
 if(c.k==='no'){fx(p,{H:-3,J:-3,K:3});p.flags.serviceMerit=(p.flags.serviceMerit||0)+1;}
 if(c.k==='out'){p.flags.policePath='good';p.flags.policeRank=0;if(p.flags.policeEverBad&&!(storyV2()&&p.flags.policeCaseClosed))await policeBust(p,io,{surrender:true});else note(p,'บัญชีเปิดให้ตรวจ คุณไม่มีเงินนอกบัญชีที่ต้องซ่อน');}
}

function storyV2(){

}
// Pin the update to the next unplayed input. Historical choices keep their old
// rules during replay; both new and existing characters get fixes going forward.

 const from=SaveGame.active.game.balanceFixFrom;
 return Number.isInteger(from)&&SaveGame.cursor>=from;
}
function promotionLimits(p){
 const i=isCorrections(p)?(p.flags.correctionsGrade||0):(p.flags.policeGrade||0);
 return isCorrections(p)?{base:[45,28][i]??20,cap:[60,40][i]??30}:{base:[50,42,32,23,14][i]??10,cap:[65,58,48,38,28][i]??20};
}
function revisedPromotionOdds(p){
 const limits=promotionLimits(p),grade=publicSafetyGrade(p);
 const service=isCorrections(p)?Math.max(0,p.age-(p.flags.correctionsSince??p.age)):p.cYears;
 const grades=isCorrections(p)?CORRECTIONS_GRADES:POLICE_GRADES,index=isCorrections(p)?(p.flags.correctionsGrade||0):(p.flags.policeGrade||0);
 const needed=grades[index+1]?.years??grade.years;
 const skill=clamp((p.S-50)*.15,-6,7.5),contacts=clamp((p.C-50)*.05,-2.5,2.5);
 const merit=Math.min(5,(p.flags.serviceMerit||0)),seniority=clamp(service-needed,0,3);
 const discipline=Math.min(8,(p.flags.schoolWarnings||0)*2);
 return clamp(Math.round(limits.base+skill+contacts+merit+seniority-discipline),5,limits.cap);
}

function clubMoralEnding(p){
 const club=p.flags.billionaireClub,m=club?.moral;if(!m?.history?.length)return null;
 const last=m.history[m.history.length-1];
 if(club.debtExpelled)return {t:'อดีตสมาชิกที่คลับไม่ยอมรอ',d:'สมาชิกภาพสิ้นสุดหลังเข้าสู่การจัดการหนี้ ชีวิตนอกคลับยังต้องรับผิดหนี้และคดีเดิม',rare:true};
 if(club.expelled)return {t:last.ending==='พยานที่ขายคำพูด'?'อดีตสมาชิกที่ขายคำให้การ':'พยานนอกประตูพันล้าน',d:'ถูกคลับขับออกหลังเปิดโปงสิ่งที่เห็น ชีวิตต่อจากนั้นยังต้องเผชิญผลของคำให้การ หนี้ และการตัดสินใจเดิม',rare:true};
 if(last.path==='leave')return null;
 return {t:last.ending,d:`ผ่านเส้นเรื่อง ${CLUB_MORAL_ROUTES.find(r=>r.id===last.route).name} ทางที่เลือกทิ้งทั้งคนที่ไว้ใจคุณและคนที่อยากทวงสิ่งที่เสียไป เงินและคดีจากทุกตอนยังเป็นส่วนหนึ่งของชีวิต`,rare:true};

async function clubExpose(p,io,route,episode,state){
 const club=p.flags.billionaireClub;state.path='expose';state.exposed=true;fx(p,{K:20,J:-4});tagGood(p,'justice','เปิดโปง: '+episode.title);
 // One roll for membership, independent rolls for disclosed retaliation risks.
 const expelled=chance(clubExposeOdds(club)),lawsuit=chance(.30),threat=chance(.15);
 if(expelled){club.active=false;club.closed=true;club.expelled=true;state.followup=true;}
 else if(storyV2()){club.whistle=true;fx(p,{C:6});note(p,'สมาชิกที่ไม่เห็นด้วยกับวงในเริ่มส่งดีลสุจริตมาให้คุณก่อน ดีลที่เปิดบัญชีให้ตรวจจะมีโอกาสสำเร็จเพิ่ม 5%');}
 if(lawsuit)clubCash(p,-50000000);
 if(threat)fx(p,{H:-10,J:-8});
 if(club.dirtyDeals>0){club.casePending=true;note(p,'การให้หลักฐานไม่ลบการกระทำเดิมของคุณ ต้องชี้แจงบทบาทตัวเองในคดีด้วย');}
 await say(p,io,{kind:'result',bg:route.bg,outcome:expelled?'bad':'good',title:expelled?'คลับลงมติขับคุณออก':'เสียงแฉที่คลับปิดไม่ลง',text:`คุณส่งหลักฐานโดยปกป้องข้อมูลผู้เสียหาย นลินพาพยานไปหาที่ปรึกษาอิสระ\n${expelled?'สมาชิกลงมติขับคุณออกทันที หยุดค่าสมาชิกและดีลใหม่ แต่ยังต้องรับผิดหนี้และคดีเก่า':'สมาชิกบางส่วนยืนข้างคุณ คุณยังอยู่ในคลับ ตอนถัดไปต้องเจอกับคนที่ถูกแฉ'}${lawsuit?'\nถูกฟ้องกลับและเสียค่าต่อสู้คดี ฿50,000,000 เงินไม่พอกลายเป็นหนี้ 7%/ปี':''}${threat?'\nถูกดักข่มขู่จนบาดเจ็บ สุขภาพลดและเกิดความเครียด':''}\n${clubWealth(p)}`});
}

async function clubMoralEpisode(p,io,route,state){

 state.lastOutcome=null;

  {label:e.expose,k:'expose',sub:`โอกาสถูกขับออก ${Math.round(clubExposeOdds(club)*100)}%${storyV2()?' (ลดลงถ้าเคยลงทุนสุจริตมากกว่า) · ถ้าไม่ถูกขับ ดีลสุจริตครั้งต่อไปสำเร็จง่ายขึ้น':''} · ถูกฟ้องกลับ 30% เสีย ฿50,000,000 (เงินไม่พอเป็นหนี้ 7%) · ถูกข่มขู่จนบาดเจ็บ 15% · บุญ +20 · แต่ละความเสี่ยงสุ่มแยกกัน`},
  {label:'ปฏิเสธและหยุดข้องเกี่ยวกับเส้นเรื่องนี้',k:'leave',sub:'ไม่ลงทุน ไม่ส่งหลักฐาน · จบสายนี้ · หนี้และคดีที่เคยก่อยังอยู่'}]});
 if(c.k==='leave'){state.path='leave';state.ending='คนที่เดินออกจากเรื่อง';clubMoralFinish(p,route,state);return;}
 state.path=c.k;
 if(c.k==='expose')await clubExpose(p,io,route,e,state);
 else{
  const k=c.k==='bad'?1:0,d=offers[k];let t=terms[k];clubCash(p,-t.stake);club.invested+=t.stake;

  if(storyV3())t=await clubTwist(p,io,club,d,t);
  const roll=rnd()*100;let text,title;
  if(roll<t.success){clubCash(p,t.payout);club.realized+=t.payout-t.stake;club.wins++;clubAfterWin(club,d);text=d.good;title='กำไรที่มีชื่อคนอยู่ข้างหลัง';state.lastOutcome='win';}
  else if(roll<100-t.disaster){club.realized-=t.stake;club.losses++;text=d.bad;title='เงินเดิมพันหายไปทั้งก้อน';state.lastOutcome='loss';fx(p,{J:-8});}
  else{clubCash(p,-t.guarantee);club.realized-=t.stake+t.guarantee;club.losses++;club.crashes++;text=d.ruin;title='หนี้ค้ำตามมาถึงหน้าประตู';state.lastOutcome='crash';fx(p,{J:-15,H:-4});if(k){club.casePending=true;club.heat=clamp(club.heat+30,0,100);}if(p.career==='biz'&&(p.money===0||totalDebt(p)>p.money)){club.companyLost=true;p.cOut='bad';p.incomeBoost*=.2;p.unemployed=Math.max(p.unemployed,2);text+=' กิจการหลักขาดสินเชื่อ รายได้หยุดอย่างน้อย 2 ปี';}}
  await say(p,io,{kind:'result',bg:route.bg,outcome:resolutionStories()?(state.lastOutcome==='win'?'good':'bad'):undefined,title,text:`${text}\n${state.lastOutcome==='win'?`รับคืนรวมทุน ฿${baht(t.payout)}`:state.lastOutcome==='crash'?`เสียทุน ฿${baht(t.stake)} + เรียกค้ำ ฿${baht(t.guarantee)}`:`เสียทุน ฿${baht(t.stake)}`}\n${clubWealth(p)}`});
 }
 state.step++;
 if(clubInDistress(p))club.distressPending=true;
 if(state.step>=route.episodes.length&&!state.followup){state.finished=true;clubMoralFinish(p,route,state);await say(p,io,{kind:'result',bg:route.bg,title:'ตอนจบ — '+club.moral.history[club.moral.history.length-1].ending,text:`${route.name} จบลงด้วยทางที่คุณเลือกครั้งสุดท้าย ความสัมพันธ์และประวัติการเลือกทุกตอนยังติดตัวคุณ เงิน หนี้ และคดีไม่ถูกรีเซ็ต`});}

async function clubMoralTick(p,io){
 if(!clubMoralEnabled())return false;
 const club=p.flags.billionaireClub,m=clubMoralState(club);
 if(p.age<=m.lastAge)return false;
 if(m.current?.followup){m.lastAge=p.age;await clubWitnessAftermath(p,io,CLUB_MORAL_ROUTES.find(r=>r.id===m.current.id),m.current);return true;}
 if(club.closed||!club.active||p.age<m.nextAge)return false;
 // Alternate new moral chapters with the financial plot instead of replacing it.
 if(!m.current&&p.age>=club.nextAge)return false;
 m.lastAge=p.age;
 if(!m.current){
  const pool=CLUB_MORAL_ROUTES.filter(r=>!m.done.includes(r.id));if(!pool.length)return false;
  const c=await choose(p,io,{kind:'main',bg:'club_lounge',title:'คำเชิญหลังงานเลี้ยงเลิก',text:'เมื่อแขกทั่วไปกลับไป สมาชิกห้ากลุ่มต่างอยากพบคุณเป็นการส่วนตัว คุณจะฟังเรื่องของใครก่อน? แต่ละสายมี 3 ตอนต่อเนื่อง ปีละไม่เกินหนึ่งตอน และเปลี่ยนใจระหว่างทางได้',noStory:true,choices:[...pool.map(r=>({label:r.name,sub:r.pitch,k:r.id})),{label:'ปีนี้ไม่รับคำเชิญ เก็บชีวิตเดิมไว้',sub:'ไม่เสียเงิน · เลือกใหม่ได้ภายหลัง',k:'skip'}]});
  if(c.k==='skip'){m.nextAge=p.age+2;return true;}
  m.current={id:c.k,step:0,path:null,choices:[]};
 }
 const state=m.current,route=CLUB_MORAL_ROUTES.find(r=>r.id===state.id);
 const oldStep=state.step;await clubMoralEpisode(p,io,route,state);state.choices.push({step:oldStep,path:state.path,outcome:state.lastOutcome||null,age:p.age});
 return true;
}

 return {cost,fine,reward};
}

function clubCash(p,amount){
 // Contract losses are personal guarantees at the existing formal-debt rate,
 // not a new informal loan silently created by the ordinary credit ceiling.
 if(amount>=0){fx(p,{m:amount});return;}
 const paid=Math.min(p.money,-amount),short=-amount-paid;
 if(paid)fx(p,{m:-paid});if(short){p.debt.f+=short;note(p,`เงินสดไม่พอชำระ ภาระตามสัญญา ฿${baht(short)} กลายเป็นหนี้ในระบบ ดอกเบี้ย 7%/ปี`);}
}
function clubTerms(p,deal){

 const boost=Math.round(clamp((p.S-50)*.08,-4,4)+clamp((p.C-50)*.04,-2,2))+(storyV2()&&!deal.illegal&&p.flags.billionaireClub?.whistle?5:0);
 const success=clamp(deal.chance+boost,20,55),disaster=deal.disaster;
 return {stake,guarantee,success,disaster,loss:100-success-disaster,payout:Math.round(stake*deal.multiple),multiple:deal.multiple};
}

  const chapter=CLUB_CHAPTERS.find(e=>!club.seen.includes(e[0]));

  let pool=CLUB_BIG_EVENTS.filter(e=>!club.bigSeen.includes(e[0]));if(!pool.length){club.bigSeen=[];pool=CLUB_BIG_EVENTS;}
  const event=pickOne(pool);club.bigSeen.push(event[0]);await clubPlayDeal(p,io,event);
 }finally{club.busy=false;}
}

function policeCaseBuild(p,tpl){
 const [id,path,title,bg,intro,roles,allowed,influential]=tpl;
 const pool=[...NAMES_M,...NAMES_F].filter(n=>n!==p.name),names=[];
 while(names.length<3){const n=pickOne(pool);if(!names.includes(n))names.push(n);}
 const dims=[],rest=allowed.slice();
 while(dims.length<4)dims.push(rest.splice(Math.floor(rnd()*rest.length),1)[0]);
 // Two clues single out different suspects, one more singles out anyone, one fits everyone.
 const a=randi(0,2),b=(a+randi(1,2))%3,singles=[a,b,randi(0,2),-1];
 for(let i=singles.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[singles[i],singles[j]]=[singles[j],singles[i]];}
 const vals={};
 dims.forEach((d,i)=>{const base=randi(0,1),one=singles[i];vals[d]=[0,1,2].map(s=>s===one?1-base:base);});
 return {id,path,title,bg,intro,roles,influential,names,dims,vals,culprit:randi(0,2)};
}

}

// Cast sprite drawn from the scene snapshot (st.mg); falls back to the classic cast.
function mgCastNpc(t,st,who,x,y){
 const cast=st.mg&&st.mg.cast,sex=cast&&cast[who]?cast[who].sex:who==='mekha'&&st.mg&&st.mg.lrSex?st.mg.lrSex:{rival:'M',friend:'F',star:'F',mekha:'M'}[who]||'M';
 mgCharacterNpc(t,{...st,skin:who==='star'||who==='rival'?0:1},sex,x,y,{profile:who});
}
// Participants belong to an event, independently of the selected romance route.
// Resolve before callbacks so breakup, departure and rescue results keep their cast.
function mgEventCast(p,ev){
 const cast=typeof ev.sceneCast==='function'?ev.sceneCast(p):ev.sceneCast;
 return Array.isArray(cast)?[...cast]:[];
}
function sceneSnapshot(o,p){
 if(!Object.prototype.hasOwnProperty.call(o,'sceneCast'))return null;
 const st=snap(p);
 st.mg={...(st.mg||{}),sceneCast:[...o.sceneCast],hidePlayer:!!o.sceneHidePlayer,detail:o.sceneDetail||null};
 return st;
}
// Fixed background casts are used only outside an explicitly staged story event.
function mgBackdropCastNpc(t,st,who,x,y){
 if(Array.isArray(st.mg&&st.mg.sceneCast))return;
 mgCastNpc(t,st,who,x,y);
}

const ICONS = {};
for(const [k, rows] of Object.entries(ICON_TPL)){ const c = document.createElement('canvas'); c.width = 7; c.height = 7; const x = c.getContext('2d'); rows.forEach((r, y) => [...r].forEach((ch, i) => { if(ch !== '.'){ x.fillStyle = ICON_COL[ch]; x.fillRect(i, y, 1, 1); } })); ICONS[k] = c.toDataURL(); }
const ic = (k, cls = 'ic') => `<img class="${cls}" src="${ICONS[k]}" alt="${ICON_ALT[k] || ''}" title="${ICON_ALT[k] || ''}">`;
const sgn = s => s === '+' ? '+' : '−';
const upd = s => s === '+' ? 'up' : 'dn';
// แปลงตัวย่อ H J S C ฿ ค่าลูก ให้เป็นสัญลักษณ์
function rich(s){
  // บุญ/บาป (K) ซ่อนไว้จนตาย ไม่แสดงในตัวเลือก
  s = String(s).replace(/(^|[\s·])K\s?[+−\-]\s?\d+/g, '$1').replace(/(\s*·\s*){2,}/g, ' · ').replace(/^\s*·\s*|\s*·\s*$/g, '').replace(/\s{2,}/g, ' ').trim();
  let h = esc(s); const tok = []; const put = html => { tok.push(html); return `\u0001${tok.length-1}\u0002`; };
  h = h.replace(/(^|[^A-Za-z])([HJSC])\s?([+−\-])\s?(\d+)/g, (m, pre, k, sg, n) => pre + put(`<span class="fx ${upd(sg)}">${ic(k)}${sgn(sg)}${n}</span>`));
  h = h.replace(/ค่าลูก\s?([+−\-])\s?(\d+)/g, (m, sg, n) => put(`<span class="fx ${upd(sg)}">${ic('kid')}${sgn(sg)}${n}</span>`));
  h = h.replace(/฿\s?([+−\-])\s?([\d,]+)/g, (m, sg, n) => put(`<span class="fx ${upd(sg)}">${ic('M')}${sgn(sg)}${n}</span>`));
  h = h.replace(/(^|[^A-Za-z])([HJSC])(?=[^A-Za-z]|$)/g, (m, pre, k) => pre + put(ic(k)));
  return h.replace(/\u0001(\d+)\u0002/g, (m, i) => tok[+i]);
}

}

}

async function runResolution(p,io,group,fn,...args){

 const frame=async(o,extra=[])=>{shown++;const unique=[...new Set(extra)].filter(x=>!String(o.text||'').includes(x));return io.say({...o,bg:resolutionBackground(group,o),text:[...unique,o.text].filter(Boolean).join('\n\n')});};
 const flush=async(extra=[])=>{const notes=[...extra,...take()];if(notes.length)await frame({kind:'result',bg:lastBg,title:group==='police'?'ผลของสำนวนและคนที่ต้องรับผล':'หลังการตัดสินใจในคลับ',text:[...new Set(notes)].join('\n')});};

 return result;

const Music = (() => {
  const SRC = { arcade:'music/arcade.mp3', quest:'music/quest.mp3', guitar:'music/guitar.mp3', piano:'music/piano.mp3' };
  const VOL = { arcade:.42, quest:.40, guitar:.55, piano:.55 };
  const els = {}; let cur = null, want = 'arcade', unlocked = false, on = true, raf = 0;
  try { on = localStorage.getItem('o65m_music') !== 'off'; } catch(e) {}
  function el(k){ if(!els[k]){ const a = new Audio(SRC[k]); a.loop = true; a.preload = 'auto'; a.volume = 0; els[k] = a; } return els[k]; }
  function trackFor(bg){
    const st = CUR.p ? CUR.p.stage : 0;
    if(['funeral','karma','death','end'].includes(bg) || st >= 7) return 'piano';
    if(bg === 'timeskip') return cur || want;
    if(st >= 6 || bg === 'hospital' || bg === 'oldhome') return 'guitar';
    if(st >= 3) return 'quest';
    return 'arcade';
  }
  function fade(){
    cancelAnimationFrame(raf); let last = performance.now();
    const step = now => {
      const dt = Math.min(.1, (now - last)/1000); last = now; let busy = false;
      for(const k in els){ const a = els[k]; const target = (on && unlocked && k === cur) ? VOL[k] : 0;
        const d = target - a.volume; if(Math.abs(d) > .005){ busy = true; a.volume = clamp(a.volume + Math.sign(d)*Math.min(Math.abs(d), dt*.45), 0, 1); } else a.volume = target;
        if(a.volume === 0 && target === 0 && !a.paused) a.pause(); }
      if(busy) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  function apply(){
    if(!unlocked || !on){ fade(); return; }
    const a = el(cur); if(a.paused){ a.play().catch(()=>{}); }
    fade();
  }
  function pick(bg){ want = trackFor(bg); if(want === cur) return; const prev = cur; cur = want;
    // เพลงใหม่เริ่มต้นเพลง ยกเว้นกลับมาเพลงเดิมเร็ว ๆ ให้เล่นต่อจากเดิม
    if(prev && els[cur] && els[cur].paused) { try { els[cur].currentTime = 0; } catch(e) {} }
    apply(); }
  function ui(){ const b = $('#sndBtn'); if(!b) return; b.classList.toggle('off', !on); b.setAttribute('aria-pressed', on ? 'true' : 'false'); $('#sndTxt').textContent = on ? 'เพลง' : 'ปิดเพลง'; }
  function toggle(){ if(!unlocked && on){ unlock(); return; } on = !on; try { localStorage.setItem('o65m_music', on ? 'on' : 'off'); } catch(e) {} unlocked = true; ui(); apply(); }
  function unlock(){ if(unlocked) return; unlocked = true; apply(); }
  addEventListener('pointerdown', e => { if(!(e.target.closest && e.target.closest('#sndBtn'))) unlock(); }, { capture:true }); addEventListener('keydown', e => { if(e.key === 'm' || e.key === 'M'){ if(!e.target.closest || !e.target.closest('input,textarea')) toggle(); } else unlock(); }, { capture:true });
  document.addEventListener('visibilitychange', () => { const a = cur && els[cur]; if(!a) return; if(document.hidden) a.pause(); else if(on && unlocked) a.play().catch(()=>{}); });
  $('#sndBtn').addEventListener('click', e => { e.stopPropagation(); toggle(); });
  ui();
  return { pick, toggle, state: () => ({ cur, on, unlocked, playing: Object.keys(els).filter(k => !els[k].paused) }) };
})();

function afterScreen(r, p){
  return saveGate('screen-8', res => {
    const opts = [];
    p.kids.forEach((k, i) => { if(i < 4) opts.push({ label:`เล่นต่อเป็น${k.name} (ลูก${k.sex==='M'?'ชาย':'สาว'})`, sub:`เกิดตอนคุณอายุ ${k.born} · ค่าลูก ${Math.round(k.kv)}`, v:{ t:'child', i } }); });
    opts.push({ label:'เกิดใหม่ (ชาติหน้า)', sub: r.K < 0 ? 'บาปที่สะสมจะดึงโอกาสฐานะลงเล็กน้อย' : r.K > 0 ? 'บุญที่สะสมจะดันโอกาสฐานะขึ้นเล็กน้อย' : 'สุ่มเกิดใหม่', v:{ t:'reborn' } });
    opts.push({ label:'เริ่มชีวิตใหม่', sub:'สุ่มเกิดตามสัดส่วนจริงเต็มที่', v:{ t:'new' } });
    setScene(p.kids.length ? 'home' : 'title', null, null, p.kids.length ? { ...snap(p), age: 34, spouse:null, kids: p.kids.map(k => ({ sex:k.sex, born:34-8 })) } : null);
    const el = panel(`<div class="eyebrow">ชีวิตถัดไป</div><h2>${p.kids.length ? 'ตระกูลนี้ยังมีคนสืบต่อ' : 'ชีวิตนี้จบลงแล้ว'}</h2><div class="choices">${opts.map((c,i)=>choiceHTML(c,i)).join('')}</div>`);

  });
}
function treeScreen(){
  const fam = CUR.family; if(fam.length < 2) return Promise.resolve();
  const first = fam[0], last = fam[fam.length-1];
  const avg = fam.reduce((s,f)=>s+f.score,0)/fam.length;
  const moved = last.qEnd - first.q;
  return saveGate('screen-9', res => {
    setScene('end', null, null);
    const el = panel(`<div class="eyebrow">ต้นไม้ครอบครัว<span>${fam.length} รุ่น</span></div><h2>ตระกูลคุณขยับจาก ${QS[first.q].code} ไป ${QS[Math.min(5,last.qEnd)].code} ใน ${fam.length} รุ่น</h2>` +
      `<p class="txt">คะแนนเฉลี่ยตระกูล ${Math.round(avg)} · บุญสะสมรวม ${Math.round(fam.reduce((s,f)=>s+f.K,0))}${moved > 0 ? ' · ลูกหลานไต่ฐานะขึ้นได้' : moved < 0 ? ' · ฐานะของตระกูลถดถอยลง' : ''}</p>` +

}

function rebornPlayer(K){
  const shift = Math.round(Math.abs(K)/10) * 2; const p0 = newPlayer();
  if(!shift) return p0;
  const tier = TIERS[p0.tier]; const q = tier.q.slice();
  if(K < 0){ const m = Math.min(q[4], shift); q[4] -= m; q[0] += m; } else { const m = Math.min(q[0], shift); q[0] -= m; q[4] += m; }
  const r = rnd()*q.reduce((s,v)=>s+v,0); let acc = 0, qi = 0; for(let i=0;i<6;i++){ acc += q[i]; if(r <= acc){ qi = i; break; } }
  return newPlayer({ tier: p0.tier, prov: p0.prov, q: qi, sex: p0.sex, religion: p0.religion });
}
async function playFrom(p){
  while(true){
    CUR.p = p;
    const r = await live(p, UI);
    CUR.family.push(r);
    await summaryScreen(r, p);
    const next = await afterScreen(r, p);
    if(next.t === 'child'){ p = makeChild(p, r, next.i); continue; }
    await treeScreen(); CUR.family = [];
    p = next.t === 'reborn' ? rebornPlayer(r.K) : newPlayer();
  }
}
async function boot(){
  await showLatestUpdate();
  // Firebase and the first cloud read can take a few seconds; never leave the panel blank.
  panel('<p class="txt">กำลังเชื่อมต่อบัญชีและโหลดเซฟ…</p>');





  let record = await SaveGame.init();
  while(!record){ record = SaveGame.signedIn ? await SaveGame.library(true) : await titleScreen(); }
  while(true){
    RNG = SaveGame.seeded(SaveGame.start(record));
    CUR.family = []; CUR.keys = null; chipQ.length = 0;
    $('#drawer').hidden = true;
    try { await playFrom(newPlayer()); return; }
    catch(e){
      if(e?.code !== 'O65M_RESTART' || !e.record) throw e;
      record = e.record;
    }
  }
}
boot().catch(e => { console.error(e); panel(`<h2>เกมสะดุด</h2><p class="txt">${esc(e.message)}</p><button class="go" onclick="location.reload()">เริ่มใหม่</button>`); });
